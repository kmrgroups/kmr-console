<script>
/* ENGINE — pure functions, no screen access. Units: metres. y grows downwards (north = 0). */
const TYPES = {
  cnc:    { n: 'CNC turning (Computer Numerical Control lathe)', s: 'CNC turning', c: '#2563eb', o: 1 },
  vmc:    { n: 'Machining centre (vertical / horizontal)', s: 'Machining centre', c: '#7c3aed', o: 2 },
  conv:   { n: 'Conventional machine', s: 'Conventional', c: '#d97706', o: 3 },
  msa:    { n: 'Quality / measurement table', s: 'Quality table', c: '#059669', o: 4 },
  finish: { n: 'Finishing, assembly and packing', s: 'Finish & pack', c: '#db2777', o: 5 },
  office: { n: 'Office room', s: 'Office room', c: '#0891b2', o: 6 }
};
const KINDS = {
  public:  { n: 'Public (visitors, meetings)', c: '#0284c7' },
  open:    { n: 'Open workspace', c: '#0891b2' },
  private: { n: 'Private cabin', c: '#7c3aed' },
  service: { n: 'Service (pantry, restrooms, server)', c: '#64748b' }
};
const FACTORY_CONCEPTS = [
  { key: 'cellular-u',     name: 'Option A: Dual U-cells (lean group technology)', short: 'U-cells' },
  { key: 'cellular-heavy', name: 'Option B: Heavy machines on the walls + central island', short: 'Heavy perimeter' },
  { key: 'straight-flow',  name: 'Option C: Straight one-piece flow, north to south', short: 'Straight flow' }
];
const OFFICE_VARIANTS = [
  { key: 'office-ergonomic', name: 'Option A: Visitors at the entrance, quiet cabins at the back', short: 'Public first', order: ['public', 'service', 'open', 'private'] },
  { key: 'office-ergonomic', name: 'Option B: Visitors and cabins together, open floor at the back', short: 'Cabins near entrance', order: ['public', 'private', 'service', 'open'] },
  { key: 'office-ergonomic', name: 'Option C: Open floor at the entrance, services beside it', short: 'Open floor first', order: ['open', 'service', 'public', 'private'] }
];
const DEFAULT_DIM = { width: 20, depth: 30, hallDepth: 24, qcDepth: 5.4, aisle: 2.8, opClearance: 1.2, maintClearance: 1.5 };
const TARGETS = { saving: 15, utilMin: 40, utilMax: 70, aisle: 2.8, op: 1.2, maint: 1.5 };
const WALL = 0.5, GAP = 0.3, AISLE_SIDE = 0.3;

const r1 = n => Math.round(n * 10) / 10;
const r2 = n => Math.round(n * 100) / 100;
const num = (v, d) => { const n = parseFloat(v); return isFinite(n) && n > 0 ? n : d; };
const area = m => m.w * m.h;
const manhattan = (a, b) => Math.abs(a[0] - b[0]) + Math.abs(a[1] - b[1]);

/* Shelf-pack items in rows across one or more x-segments. Rotates an item by 90 degrees when that is the only way it fits. */
function packRows(items, segs, y0, yMax, gx, rowGap) {
  const placed = [], noFit = [];
  let y = y0, i = 0;
  const bw = Math.max(...segs.map(s => s[1] - s[0]));
  const queue = items.map(m => {
    let w = m.w, h = m.h, rot = false;
    if (w > bw + 1e-9 && h <= bw + 1e-9) { const t = w; w = h; h = t; rot = true; }
    return { m, w, h, rot };
  });
  const fits = q => q.w <= bw + 1e-9;
  const rest = queue.filter(q => { if (!fits(q)) { noFit.push(q.m); return false; } return true; });
  while (i < rest.length) {
    let rowH = 0, rowItems = [];
    for (const s of segs) {
      let x = s[0];
      while (i < rest.length) {
        const q = rest[i];
        if (x + q.w > s[1] + 1e-9) break;
        rowItems.push({ q, x }); x += q.w + gx; rowH = Math.max(rowH, q.h); i++;
      }
    }
    if (!rowItems.length) { noFit.push(rest[i].m); i++; continue; }
    if (y + rowH > yMax + 1e-9) { for (const r of rowItems) noFit.push(r.q.m); while (i < rest.length) noFit.push(rest[i++].m); break; }
    for (const r of rowItems) placed.push(Object.assign({}, r.q.m, { x: r2(r.x), y: r2(y), w: r.q.w, h: r.q.h, rot: r.q.rot }));
    y += rowH + rowGap;
  }
  return { placed, noFit, yEnd: y };
}

/* One U-cell block: two rows facing each other around an operator gangway, flow goes along row A and back along row B. */
function packBlock(items, x0, x1, y0, yMax, op, maint, label) {
  const bw = x1 - x0, noFit = [], placed = [];
  items = items.slice().sort((a, b) => b.h - a.h);
  const norm = items.map(m => { let w = m.w, h = m.h, rot = false; if (w > bw + 1e-9 && h <= bw + 1e-9) { w = m.h; h = m.w; rot = true; } return { m, w, h, rot }; });
  const ok = norm.filter(q => { if (q.w > bw + 1e-9) { noFit.push(q.m); return false; } return true; });
  const rows = []; let cur = [], cw = 0;
  for (const q of ok) {
    if (cur.length && cw + GAP + q.w > bw + 1e-9) { rows.push(cur); cur = []; cw = 0; }
    cw += (cur.length ? GAP : 0) + q.w; cur.push(q);
  }
  if (cur.length) rows.push(cur);
  if (rows.length === 1 && rows[0].length >= 2) { const r = rows[0], k = Math.ceil(r.length / 2); rows.splice(0, 1, r.slice(0, k), r.slice(k)); }
  let y = y0; const blocks = [];
  for (let b = 0; b < rows.length; b += 2) {
    const rA = rows[b], rB = rows[b + 1];
    const hA = Math.max(...rA.map(q => q.h)), hB = rB ? Math.max(...rB.map(q => q.h)) : 0;
    const bh = hA + (rB ? op + hB : 0);
    if (y + bh > yMax + 1e-9) { for (const r of rows.slice(b)) for (const q of r) noFit.push(q.m); break; }
    let x = x0;
    for (const q of rA) { placed.push(Object.assign({}, q.m, { x: r2(x), y: r2(y), w: q.w, h: q.h, rot: q.rot })); x += q.w + GAP; }
    const wA = x - GAP - x0;
    let wB = 0;
    if (rB) {
      x = x0;
      for (const q of rB.slice().reverse()) { placed.push(Object.assign({}, q.m, { x: r2(x), y: r2(y + hA + op), w: q.w, h: q.h, rot: q.rot })); x += q.w + GAP; }
      wB = x - GAP - x0;
    }
    blocks.push({ x: r2(x0 - 0.15), y: r2(y - 0.15), w: r2(Math.max(wA, wB) + 0.3), h: r2(bh + 0.3), label });
    y += bh + maint;
  }
  return { placed, noFit, yEnd: y, blocks };
}

function cellsOf(items) {
  const map = new Map();
  for (const m of items) { const k = (m.cell || 'Other').trim() || 'Other'; if (!map.has(k)) map.set(k, []); map.get(k).push(m); }
  const list = [...map.entries()].map(([name, ms]) => {
    ms.sort((a, b) => ((TYPES[a.type] || {}).o || 9) - ((TYPES[b.type] || {}).o || 9));
    return { name, ms, area: ms.reduce((s, m) => s + area(m), 0), o: Math.min(...ms.map(m => (TYPES[m.type] || {}).o || 9)) };
  });
  return list;
}

function geometry(dim) {
  const W = num(dim.width, 20), D = num(dim.depth, 30);
  let Hh = num(dim.hallDepth, 24); if (Hh > D - 1) Hh = Math.max(1, D - 1);
  const aisle = num(dim.aisle, 2.8), op = num(dim.opClearance, 1.2), maint = num(dim.maintClearance, 1.5);
  const qcDepth = Math.max(0, D - Hh);
  const west = [WALL, W / 2 - aisle / 2 - AISLE_SIDE], east = [W / 2 + aisle / 2 + AISLE_SIDE, W - WALL];
  return { W, D, Hh, aisle, op, maint, qcDepth, west, east, yMin: WALL, yMax: Hh - WALL,
    inbound: [W / 2, 0], dispatch: [W, Math.max(2, Hh - 2)], scrap: [0, Math.max(2, Hh - 2)], d1: [W / 2, Hh] };
}

function layoutQC(items, G) {
  const qc = items.filter(m => m.type === 'msa');
  if (!qc.length) return { placed: [], noFit: [] };
  const r = packRows(qc, [[WALL, G.W - WALL]], G.Hh + 0.7, G.D - WALL, GAP, G.op);
  return { placed: r.placed, noFit: r.noFit };
}

function layoutU(items, G) {
  const cells = cellsOf(items).sort((a, b) => a.o - b.o || b.area - a.area);
  const bays = [{ seg: G.west, y: G.yMin }, { seg: G.east, y: G.yMin }];
  return placeCells(cells, bays, G);
}

/* place each cell as U-cell blocks in the bay with more free depth; a cell that does not fit goes to the other bay */
function placeCells(cells, bays, G) {
  const placed = [], noFit = [], blocks = [];
  for (const c of cells) {
    const order = bays[0].y <= bays[1].y ? [bays[0], bays[1]] : [bays[1], bays[0]];
    let left = c.ms;
    for (const b of order) {
      if (!left.length) break;
      if (b.seg[1] - b.seg[0] < 1.0) continue;
      const r = packBlock(left, b.seg[0], b.seg[1], b.y, G.yMax, G.op, G.maint, c.name);
      placed.push(...r.placed); blocks.push(...r.blocks);
      if (r.placed.length) b.y = r.yEnd;
      left = r.noFit;
    }
    noFit.push(...left);
  }
  return { placed, noFit, blocks };
}

function boundsBlock(list, label, pad) {
  const p = pad === undefined ? 0.15 : pad;
  const x0 = Math.min(...list.map(m => m.x)), y0 = Math.min(...list.map(m => m.y));
  const x1 = Math.max(...list.map(m => m.x + m.w)), y1 = Math.max(...list.map(m => m.y + m.h));
  return { x: r2(x0 - p), y: r2(y0 - p), w: r2(x1 - x0 + 2 * p), h: r2(y1 - y0 + 2 * p), label };
}

function layoutHeavy(items, G) {
  const isHeavy = m => area(m) >= 9 || Math.max(m.w, m.h) >= 4.5;
  const heavy = items.filter(isHeavy).sort((a, b) => area(b) - area(a)), light = items.filter(m => !isHeavy(m));
  const placed = [], noFit = [], blocks = [];
  const cols = [{ side: 'w', list: [], w: 0, y: G.yMin }, { side: 'e', list: [], w: 0, y: G.yMin }];
  for (const m of heavy) {
    const c = cols[0].y <= cols[1].y ? cols[0] : cols[1];
    const seg = c.side === 'w' ? G.west : G.east;
    const rot = m.w > m.h, w = rot ? m.h : m.w, h = rot ? m.w : m.h;
    if (w > seg[1] - seg[0] + 1e-9 || c.y + h > G.yMax + 1e-9) { noFit.push(m); continue; }
    const x = c.side === 'w' ? seg[0] : seg[1] - w;
    const p = Object.assign({}, m, { x: r2(x), y: r2(c.y), w, h, rot });
    placed.push(p); c.list.push(p); c.w = Math.max(c.w, w); c.y += h + G.op;
  }
  for (const c of cols) if (c.list.length) blocks.push(boundsBlock(c.list, 'Heavy machines — ' + (c.side === 'w' ? 'west' : 'east') + ' wall'));
  const cells = cellsOf(light).sort((a, b) => a.o - b.o || b.area - a.area);
  const bays = [
    { seg: [G.west[0] + cols[0].w + (cols[0].w ? G.maint : 0), G.west[1]], y: G.yMin },
    { seg: [G.east[0], G.east[1] - cols[1].w - (cols[1].w ? G.maint : 0)], y: G.yMin }
  ];
  const r = placeCells(cells, bays, G);
  return { placed: placed.concat(r.placed), noFit: noFit.concat(r.noFit), blocks: blocks.concat(r.blocks) };
}

function layoutStraight(items, G) {
  const placed = [], noFit = [], blocks = [];
  let y = G.yMin, n = 0;
  for (const t of ['cnc', 'vmc', 'conv', 'finish']) {
    const ms = items.filter(m => m.type === t);
    if (!ms.length) continue;
    n++;
    const r = packRows(ms, [G.west, G.east], y, G.yMax, GAP, G.op);
    placed.push(...r.placed); noFit.push(...r.noFit);
    for (const side of [0, 1]) {
      const part = r.placed.filter(p => (p.x + p.w / 2 < G.W / 2) === (side === 0));
      if (part.length) blocks.push(boundsBlock(part, 'Stage ' + n + ': ' + TYPES[t].s));
    }
    if (r.placed.length) y = r.yEnd - G.op + G.maint;
  }
  return { placed, noFit, blocks };
}

function centroid(list) {
  const a = list.reduce((s, m) => s + area(m), 0);
  if (!a) return null;
  return [list.reduce((s, m) => s + area(m) * (m.x + m.w / 2), 0) / a, list.reduce((s, m) => s + area(m) * (m.y + m.h / 2), 0) / a];
}

function factoryOption(items, dim, idx) {
  const G = geometry(dim), concept = FACTORY_CONCEPTS[idx];
  const hall = items.filter(m => m.type !== 'msa');
  const lay = idx === 0 ? layoutU(hall, G) : idx === 1 ? layoutHeavy(hall, G) : layoutStraight(hall, G);
  const qc = layoutQC(items, G);
  const placed = lay.placed.concat(qc.placed), noFit = lay.noFit.concat(qc.noFit);
  const pts = [G.inbound];
  const hallPlaced = lay.placed;
  const stage = t => centroid(hallPlaced.filter(m => m.type === t));
  let travel = 0, prev = G.inbound, viaD1 = false;
  const route = [G.inbound];
  const go = (p, d1) => { if (!p) return; if (d1) { travel += manhattan(prev, G.d1) + manhattan(G.d1, p); route.push(G.d1, p); } else { travel += manhattan(prev, p); route.push(p); } prev = p; };
  go(stage('cnc')); go(stage('vmc')); go(stage('conv'));
  const qcC = centroid(qc.placed);
  if (qcC) { go(qcC, true); }
  const fin = stage('finish');
  if (fin) { if (qcC) { travel += manhattan(prev, G.d1) + manhattan(G.d1, fin); route.push(G.d1, fin); prev = fin; } else go(fin); }
  travel += manhattan(prev, G.dispatch); route.push(G.dispatch);
  const hallArea = G.W * G.Hh;
  const util = hallArea ? (lay.blocks || []).reduce((s, b) => s + b.w * b.h, 0) / hallArea * 100 : 0;
  return { idx, key: concept.key, name: concept.name, short: concept.short, kind: 'factory', G, placed, noFit, blocks: lay.blocks || [], route, travel: r1(travel), util: r1(util), total: items.length, placedN: placed.length };
}

function officeOption(items, dim, idx) {
  const W = num(dim.width, 20), D = num(dim.depth, 30), cw = 2.0, v = OFFICE_VARIANTS[idx];
  const G = { W, D, cw, entrance: [W / 2, D] };
  const bays = [{ seg: [0.3, W / 2 - cw / 2], load: 0, list: [] }, { seg: [W / 2 + cw / 2, W - 0.3], load: 0, list: [] }];
  const sorted = items.slice().sort((a, b) => v.order.indexOf(a.kind) - v.order.indexOf(b.kind) || area(b) - area(a));
  for (const m of sorted) { const b = bays[0].load <= bays[1].load ? bays[0] : bays[1]; b.list.push(m); b.load += area(m); }
  const placed = [], noFit = [];
  for (const b of bays) {
    const r = packRows(b.list, [b.seg], 0.3, D - 0.3, 0.2, 0.2);
    for (const p of r.placed) placed.push(Object.assign(p, { y: r2(D - p.y - p.h) }));
    noFit.push(...r.noFit);
  }
  const c = m => [m.x + m.w / 2, m.y + m.h / 2];
  const pub = placed.filter(m => m.kind === 'public'), opn = placed.filter(m => m.kind === 'open'), svc = placed.filter(m => m.kind === 'service');
  let travel = pub.reduce((s, m) => s + manhattan(G.entrance, c(m)), 0);
  if (svc.length) travel += opn.reduce((s, m) => s + Math.min(...svc.map(q => manhattan(c(m), c(q)))), 0);
  const floor = W * D - cw * D;
  const util = floor ? placed.reduce((s, m) => s + area(m), 0) / floor * 100 : 0;
  return { idx, key: v.key, name: v.name, short: v.short, kind: 'office', G, placed, noFit, blocks: [], route: [G.entrance], travel: r1(travel), util: r1(util), total: items.length, placedN: placed.length };
}

function evaluate(items, dim, kind) {
  const opts = [0, 1, 2].map(i => kind === 'office' ? officeOption(items, dim, i) : factoryOption(items, dim, i));
  const maxT = Math.max(...opts.map(o => o.travel));
  const okOpts = opts.filter(o => !o.noFit.length).sort((a, b) => a.travel - b.travel);
  const grades = ['A+', 'A', 'B+'];
  for (const o of opts) {
    o.saving = maxT > 0 ? r1((maxT - o.travel) / maxT * 100) : 0;
    const rank = okOpts.indexOf(o);
    o.grade = o.noFit.length ? 'C' : (rank < 0 ? 'C' : grades[rank]);
    const d = num(dim.aisle, 2.8), op = num(dim.opClearance, 1.2), mt = num(dim.maintClearance, 1.5);
    o.checks = [
      { k: 'fit', name: 'Every machine / room has a place', ok: !o.noFit.length, txt: o.noFit.length ? o.noFit.length + ' left out: ' + o.noFit.slice(0, 6).map(m => m.name).join(', ') + (o.noFit.length > 6 ? ' …' : '') : 'All ' + o.total + ' placed' },
      { k: 'aisle', name: 'Central aisle at least ' + TARGETS.aisle + ' m', ok: kind === 'office' ? true : d >= TARGETS.aisle - 1e-9, txt: kind === 'office' ? 'Office corridor is 2.0 m' : d.toFixed(1) + ' m set' },
      { k: 'op', name: 'Operator clearance at least ' + TARGETS.op + ' m', ok: op >= TARGETS.op - 1e-9, txt: op.toFixed(1) + ' m set' },
      { k: 'maint', name: 'Maintenance corridor at least ' + TARGETS.maint + ' m', ok: mt >= TARGETS.maint - 1e-9, txt: mt.toFixed(1) + ' m set' },
      { k: 'util', name: 'Floor use between ' + TARGETS.utilMin + '% and ' + TARGETS.utilMax + '%', ok: o.util >= TARGETS.utilMin && o.util <= TARGETS.utilMax, txt: o.util.toFixed(1) + '%' }
    ];
  }
  return opts;
}

/* The key performance indicators of one chosen option and their gaps against the targets. */
function kpis(opt) {
  const c = k => opt.checks.find(x => x.k === k);
  return [
    { k: 'saving', name: 'Travel saving against the longest option', val: opt.saving.toFixed(1) + '%', target: '≥ ' + TARGETS.saving + '%', ok: opt.saving >= TARGETS.saving - 1e-9 },
    { k: 'util', name: 'Floor utilisation', val: opt.util.toFixed(1) + '%', target: TARGETS.utilMin + '–' + TARGETS.utilMax + '%', ok: c('util').ok },
    { k: 'fit', name: 'Machines / rooms placed', val: opt.placedN + ' of ' + opt.total, target: 'all', ok: c('fit').ok },
    { k: 'clear', name: 'Aisle and clearances', val: c('aisle').txt + ' / ' + c('op').txt + ' / ' + c('maint').txt, target: '≥ ' + TARGETS.aisle + ' / ' + TARGETS.op + ' / ' + TARGETS.maint + ' m', ok: c('aisle').ok && c('op').ok && c('maint').ok }
  ];
}

    const col=o.kind==='office'?(KINDS[m.kind]||{c:'#0891b2'}).c:(TYPES[m.type]||{c:'#64748b'}).c,x=px(m.x),y=px(m.y),mw=px(m.w),mh=px(m.h),ch=Math.max(4,Math.floor(mw/5.4));
    s+=`<rect x="${x}" y="${y}" width="${mw}" height="${mh}" rx="3" fill="${col}" fill-opacity="${o.kind==='office'?.82:.92}" stroke="${dk?'#fff':'#0f172a'}" stroke-opacity=".55"/>`;
    const lab=mw>=70?m.name:(m.id||m.name),dims=`${r2(m.w)}×${r2(m.h)}${m.rot?' ↻':''}`;
    s+=`<text x="${x+mw/2}" y="${y+mh/2-(mw>=70&&mh>=34?2:-3)}" font-size="${mw>=70?9.5:8}" fill="#fff" text-anchor="middle" font-weight="700">${esc(String(lab).slice(0,ch))}</text>`;
    if(mw>=70&&mh>=34)s+=`<text x="${x+mw/2}" y="${y+mh/2+10}" font-size="8" fill="#fff" fill-opacity=".85" text-anchor="middle">${dims}${o.kind==='office'?' · '+r1(m.w*m.h)+' m²':''}</text>`;
  }
  s+=T(px(W/2),px(D)+34,`WIDTH ${W.toFixed(1)} m (${Math.round(W*1000)} mm)`,11,C.dim,'text-anchor="middle" font-weight="700"')+T(-30,px(D/2),`DEPTH ${D.toFixed(1)} m (${Math.round(D*1000)} mm)`,11,C.dim,`text-anchor="middle" font-weight="700" transform="rotate(-90 -30 ${px(D/2)})"`);
  return s+'</g></svg>';
}
function legendHTML(o){
  if(o.kind==='office')return `<div class="legend">${Object.entries(KINDS).map(([k,v])=>`<span><i style="background:${v.c}"></i>${esc(v.n)}</span>`).join('')}</div>`;
  const used=[...new Set(o.placed.map(m=>m.type))];
  return `<div class="legend">${used.map(t=>`<span><i style="background:${TYPES[t].c}"></i>${esc(TYPES[t].n)}</span>`).join('')}<span><i style="background:#f59e0b"></i>Material route per part (dashed)</span></div>`;
}
/* ---------- DXF (Drawing Exchange Format, AutoCAD R12) ---------- */
function dxf(o){
  const G=o.G,D=G.D,mm=v=>Math.round(v*1000),Y=y=>mm(D-y);let e='';
  const L=(ly,a,b,c,d)=>{e+=`0\nLINE\n8\n${ly}\n10\n${a}\n20\n${b}\n30\n0\n11\n${c}\n21\n${d}\n31\n0\n`};
  const R=(ly,x,y,w,h)=>{const X=mm(x),X2=mm(x+w),Y1=Y(y),Y2=Y(y+h);L(ly,X,Y1,X2,Y1);L(ly,X2,Y1,X2,Y2);L(ly,X2,Y2,X,Y2);L(ly,X,Y2,X,Y1)};
  const T=(ly,x,y,ht,t)=>{e+=`0\nTEXT\n8\n${ly}\n10\n${mm(x)}\n20\n${Y(y)}\n30\n0\n40\n${ht}\n1\n${String(t).replace(/[\r\n]/g,' ')}\n`};
  R('WALLS',0,0,G.W,D);
  if(o.kind==='factory'){R('AISLES',G.W/2-G.aisle/2,.5,G.aisle,G.Hh-1);L('WALLS',0,Y(G.Hh),mm(G.W),Y(G.Hh));R('ZONES',.3,G.Hh+.3,G.W-.6,G.qcDepth-.6);T('ANNOTATIONS',G.W/2-3,G.Hh+.9,250,'QUALITY CONTROL AND MEASUREMENT ROOM');for(const b of o.blocks){R('ZONES',b.x,b.y,b.w,b.h);T('ANNOTATIONS',b.x+.1,b.y+.4,200,b.label)}}
  else{R('AISLES',G.W/2-G.cw/2,.3,G.cw,D-.6)}
  for(const m of o.placed){R('MACHINES',m.x,m.y,m.w,m.h);T('ANNOTATIONS',m.x+.15,m.y+m.h/2,200,m.name)}
  T('ANNOTATIONS',0,-1,300,`${P?P.title:''} — ${o.name} — scale 1:1, units mm`);
  const lay=[['WALLS',7],['MACHINES',1],['AISLES',4],['ZONES',3],['ANNOTATIONS',2]];
  return '0\nSECTION\n2\nHEADER\n9\n$ACADVER\n1\nAC1009\n9\n$INSUNITS\n70\n4\n0\nENDSEC\n0\nSECTION\n2\nTABLES\n0\nTABLE\n2\nLTYPE\n70\n1\n0\nLTYPE\n2\nCONTINUOUS\n70\n0\n3\nSolid line\n72\n65\n73\n0\n40\n0.0\n0\nENDTAB\n0\nTABLE\n2\nLAYER\n70\n'+lay.length+'\n'+lay.map(l=>`0\nLAYER\n2\n${l[0]}\n70\n0\n62\n${l[1]}\n6\nCONTINUOUS\n`).join('')+'0\nENDTAB\n0\nENDSEC\n0\nSECTION\n2\nENTITIES\n'+e+'0\nENDSEC\n0\nEOF\n';
}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}

function fromRow(r){const d=r.dimensions||{};return{id:r.id,no:r.no,title:r.title,kind:r.kind,status:r.status,source_file:r.source_file||'',sample:!!r.sample,history:r.history||[],sel:Math.max(0,Math.min(2,(r.selected_option||1)-1)),dirty:false,dim:{width:+d.width||20,depth:+d.depth||30,hallDepth:+d.hallDepth||24,qcDepth:+d.qcDepth||5.4,aisle:+d.aisle||2.8,opClearance:+d.opClearance||1.2,maintClearance:+d.maintClearance||1.5},items:(r.machines||[]).map(m=>({...m,w:+m.w,h:+m.h}))}}
const good=m=>m.w>0&&m.h>0;
function recalc(){OPTS=P?evaluate(P.items.filter(good),P.dim,P.kind):[];if(P&&P.sel>2)P.sel=0}
function summary(){return OPTS.map(x=>({name:x.name,short:x.short,key:x.key,travel:x.travel,util:x.util,saving:x.saving,grade:x.grade,placed:x.placedN,total:x.total,noFit:x.noFit.length}))}
function payload(){return{id:P.id||undefined,title:P.title,kind:P.kind,concept:P.kind==='office'?'office-ergonomic':FACTORY_CONCEPTS[P.sel].key,dimensions:{...P.dim},source_file:P.source_file||null,machines:P.items.filter(good).map(({id,type,name,w,h,cell,kind})=>({id,type,name,w,h,cell,kind})),options:summary(),selected_option:P.sel+1}}
async function loadList(){LIST=await api.rpc('kmr_layout_list',{p_slug:slug})||[]}
async function openProject(id){const r=await api.rpc('kmr_layout_get',{p_slug:slug,p_id:id});P=fromRow(r);recalc();REPORT=null;underlay='';await loadActions();paint();go('stu')}
async function save(quiet){
  if(!P)return;if(!canEdit){say('You can view layouts but not change them. Ask your administrator for editor access.');return false}
  if(!String(P.title||'').trim()){say('Write a title for the layout first.');return false}
  try{const r=await api.rpc('kmr_layout_save',{p_slug:slug,p:payload()});P.id=r.id;if(r.no)P.no=r.no;P.dirty=false;await loadList();if(!quiet)say('Saved '+(P.no||'')+'.',true);paintHead();return true}catch(err){say(err.message);return false}
}
async function newProject(kind,example){
  if(!canEdit){say('You can view layouts but not change them.');return}
  const t=($('#np_t')||{value:''}).value.trim()||(kind==='office'?'New office floor plan':'New factory layout');
  P={id:null,no:null,title:t,kind,status:'draft',source_file:'',history:[],sel:0,dirty:true,dim:{...DEFAULT_DIM},items:example?JSON.parse(JSON.stringify(kind==='office'?SAMPLE_ROOMS:SAMPLE_MACHINES)):[]};
  if(example&&kind==='factory'){P.dim={...P.dim,width:24,depth:36,hallDepth:30,qcDepth:6}}
  recalc();REPORT=null;underlay='';ACTIONS=[];if(await save(true)){say('Layout '+P.no+' created. Add or change the machines below.',true)}paint();go('stu')
}

const num2=(id,lab,f,step)=>`<div><label for="${id}">${lab}</label><input id="${id}" type="number" step="${step||.1}" min="0" data-dim="${f}" value="${P.dim[f]}" ${canEdit?'':'disabled'}></div>`;

function paintOpts(){

/* ---------- report ---------- */
function pageWrap(body,i,n,ref){const F=CFG.FORMAT;return`<div class="page"><div class="ph"><div class="logo">${ctx&&ctx.logo_url?`<img src="${esc(ctx.logo_url)}" alt="${esc(ctx.company)}" crossorigin="anonymous">`:`<b>${esc(ctx?ctx.company:'')}</b>`}</div><div class="pt">${esc(F.title)}<small>${esc(P.title)} · ${esc(P.no||'')}</small></div><div class="rf">Report reference<b>${esc(ref)}</b>Issued ${dmy(REPORT.issued_at)}</div></div><div class="pb">${body}</div><div class="pf"><div>Format No. ${esc(F.no)} · Rev. ${esc(F.rev)} · Rev. date ${dmy(F.revDate)}</div><div style="text-align:center">${esc(ctx?ctx.company:'')} · ${esc(ref)}</div><div style="text-align:right">Page ${i} of ${n}</div></div></div>`}
function reportPages(){
  const o=OPTS[REPORT.opt],ref=REPORT.ref,ks=kpis(o),items=o.placed.concat(o.noFit.map(m=>({...m,x:null,y:null}))),per=24,pages=[];
  pages.push(`<div class="two"><div>${drawSVG(o,'light','r1')}${legendHTML(o)}</div><div><table><tbody>
   <tr><th>Layout</th><td>${esc(P.no||'')} · ${esc(P.title)}</td></tr><tr><th>Type</th><td>${kindName(P.kind)}</td></tr><tr><th>Building</th><td>${P.dim.width} m × ${P.dim.depth} m${P.kind==='office'?'':' (hall '+P.dim.hallDepth+' m)'}</td></tr><tr><th>Status</th><td>${STATUS_NAME[P.status]||P.status}</td></tr><tr><th>Source plan</th><td>${esc(P.source_file||'—')}</td></tr><tr><th>Option shown</th><td>${esc(o.name)}</td></tr><tr><th>Issued by</th><td>${esc(REPORT.issued_by||'')}</td></tr></tbody></table>

/* ---------- try-out mode without a database: ?demo=1 ---------- */
function demo(){
  const iso=n=>new Date(Date.now()+n*864e5).toISOString().slice(0,10);let seq=2,rseq=0,acts=[];
  const mk=(no,title,kind,items,dim,status)=>{const opts=evaluate(items,dim,kind);return{id:'d'+no,no,title,kind,concept:kind==='office'?'office-ergonomic':'cellular-u',dimensions:dim,source_file:'',machines:items,options:opts.map(x=>({name:x.name,short:x.short,key:x.key,travel:x.travel,util:x.util,saving:x.saving,grade:x.grade,placed:x.placedN,total:x.total,noFit:x.noFit.length})),selected_option:3,status,history:[],sample:true,updated_at:iso(-2)+'T10:00:00Z',created_at:iso(-5)}};
  let S=[mk('LAY-S-0001','Example machine shop — 41 machines','factory',SAMPLE_MACHINES,{width:24,depth:36,hallDepth:30,qcDepth:6,aisle:2.8,opClearance:1.2,maintClearance:1.5},'approved'),mk('LAY-S-0002','Example office floor','office',SAMPLE_ROOMS,{...DEFAULT_DIM},'review')];
  const sum=r=>({id:r.id,no:r.no,title:r.title,kind:r.kind,concept:r.concept,dimensions:r.dimensions,source_file:r.source_file,machine_count:r.machines.length,options_count:r.options.length,options:r.options,selected_option:r.selected_option,status:r.status,sample:r.sample,updated_at:r.updated_at,created_at:r.created_at});
  return{async rpc(f,a){
   if(f==='kmr_layout_context')return{role:'admin',company:'Demo Engineering (sample data)',logo_url:'',is_staff:true};
   if(f==='kmr_layout_list')return S.map(sum);
   if(f==='kmr_layout_get')return JSON.parse(JSON.stringify(S.find(x=>x.id===a.p_id)));
   if(f==='kmr_layout_save'){const p=a.p;let r=S.find(x=>x.id===p.id);if(!r){r={id:'d'+(seq),no:'LAY-'+String(seq++).padStart(4,'0'),status:'draft',history:[],sample:false,created_at:iso(0)};S.unshift(r)}Object.assign(r,{title:p.title,kind:p.kind,concept:p.concept,dimensions:p.dimensions,source_file:p.source_file,machines:p.machines,options:p.options,selected_option:p.selected_option,updated_at:new Date().toISOString()});return{ok:true,id:r.id,no:r.no}}
   if(f==='kmr_layout_delete'){S=S.filter(x=>x.id!==a.p_id);return{ok:true}}
   if(f==='kmr_layout_status'){S.find(x=>x.id===a.p_id).status=a.p_status;return{ok:true}}
   if(f==='kmr_layout_report'){const r=S.find(x=>x.id===a.p_id),ref='LAY-R-DEMO-'+String(++rseq).padStart(4,'0');r.history.push({t:'report',ref,at:new Date().toISOString(),by:'demo'});return{ref,issued_at:new Date().toISOString(),issued_by:'demo',no:r.no}}
   if(f==='kmr_pres_actions_get')return acts.slice();
   if(f==='kmr_pres_action_save'){const p=a.p;if(p.id){Object.assign(acts.find(x=>x.id===p.id),p)}else acts.unshift({...p,id:'a'+Math.random()});return'ok'}
   if(f==='kmr_pres_action_delete'){acts=acts.filter(x=>x.id!==a.p_id);return null}
   if(f==='kmr_app_sample')return{}
   return null}}}
boot();
</script></body></html>
