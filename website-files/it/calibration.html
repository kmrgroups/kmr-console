<style>

<script>

const qs=new URLSearchParams(location.search),DEMO=qs.has('demo');let slug=(qs.get('co')||'').toLowerCase(),sb,ctx,D={instruments:[],records:[],events:[],oot:[],msa:[]},canEdit=false;
const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Kolkata'}),dd=(a,b)=>Math.round((new Date(a)-new Date(b))/864e5),dmy=d=>d?d.split('-').reverse().join('-'):'—';

$('#dash').innerHTML=I.length?`<div class="kpis">${k(I.length,'Instruments','var(--b2)')}${k(ok+'%','Calibrated on time',ok>=95?'var(--g)':'var(--r)')}${k(od.length,'Overdue','var(--r)')}${k(soon.length,'Due in '+CFG.DUE_DAYS+' days','var(--a)')}${k(oo.length,'Open OOT cases',oo.length?'var(--r)':'var(--g)')}${k(I.filter(i=>i.status==='Quarantine').length,'Quarantined','var(--a)')}</div><h3>Overdue &amp; due soon</h3>${L?`<table><thead><tr><th>Instrument</th><th>Dept</th><th>Next due</th><th>Status</th><th></th></tr></thead><tbody>${L}</tbody></table>`:'<p class="mut">Nothing due. ✔</p>'}`:'<p class="mut">No instruments yet. Open <b>Instruments</b> and press <b>＋ Add instrument</b>.</p>'}
let q='';function inst(){$('#inst').innerHTML=`<div class="row"><input id="q" placeholder="Search tag, name, dept" value="${esc(q)}" style="max-width:240px"><div style="flex:1"></div>${canEdit?'<button class="btn o" id="sync">⟳ Sync from Operations Master</button>':''}${canEdit?'<button class="btn o" id="imp">⬆ Import Excel / CSV</button>':''}<button class="btn o" id="lab">🏷 QR labels</button>${canEdit?'<button class="btn o" id="addm">＋ Add manually</button><button class="btn" id="add">＋ Add from Operations Master</button>':''}</div><div id="ib"></div>`;pi()}
/* gauges come from Operations Master › Gauges: pick them here, they are not typed again */
let OG=[];
async function opsPicker(){OG=await api.rpc('kmr_cal_ops_gauges',{p_slug:slug});OPS=OG;open(`<h3>Add gauges from Operations Master</h3><p class="mut">Gauges are created and maintained in Operations Master › Gauges. Tick the ones to bring into Calibration Hub.</p><div class="row"><input id="ogq" placeholder="Search tag, name, location" style="max-width:260px"><span class="mut" id="ogn"></span></div><div id="ogl" style="max-height:48vh;overflow:auto"></div><div class="row" style="margin-top:10px"><button class="btn" id="ogo">Add selected</button><button class="btn o" data-x>Cancel</button></div>`);ogPaint()}
function ogPaint(){const q=($('#ogq')||{value:''}).value.trim().toLowerCase(),L=OG.map((g,k)=>({g,k})).filter(({g})=>!q||[g.tag,g.name,g.location,g.itype,g.make].join(' ').toLowerCase().includes(q)),keep=new Set([...document.querySelectorAll('[data-og]:checked')].map(x=>x.dataset.og));

const iss=id=>{const e=D.events.find(x=>x.instrument_id===id&&['Issued','Returned'].includes(x.ev_type));return e&&e.ev_type==='Issued'?e.detail||'Issued':''};

function oot(){$('#oot').innerHTML=D.oot.length?`<p class="mut">Opened automatically when a calibration shows the as-found reading out of tolerance. Assess every part measured since the last good calibration.</p><table><thead><tr><th>Instrument</th><th>Opened</th><th>Summary</th><th>Last good cal</th><th>Risk</th><th>Status</th><th></th></tr></thead><tbody>${D.oot.map(o=>{const i=D.instruments.find(x=>x.id===o.instrument_id)||{};return`<tr><td><b>${esc(i.tag)}</b><br><span class="mut">${esc(i.name)}</span></td><td>${dmy(o.opened_at)}</td><td>${esc(o.summary)}<br><span class="mut">${esc(o.action||'')}</span></td><td>${dmy(o.last_good)}</td><td>${esc(o.risk||'')}</td><td><span class="chip ${o.status==='Closed'?'g':'r'}">${o.status}</span></td><td>${canEdit?`<button class="btn o sm" data-o="${o.id}">Assess / edit</button> <button class="btn o sm" data-do="${o.id}">✕</button>`:''}</td></tr>`}).join('')}</tbody></table>`:'<p class="mut">No out-of-tolerance cases.</p>'}
const STD=[['ISO 9001:2015','7.1.5 Monitoring and measuring resources','Every instrument is registered with calibration status, due date and traceable certificate data.',()=>`${D.instruments.length} registered, ${D.instruments.filter(i=>st(i)[0]==='Overdue').length} overdue`],
['ISO 9001:2015','7.1.5.2 Measurement traceability','Calibration records keep lab, accreditation (e.g. NABL) and certificate number; status is visible on each gauge card.',()=>`${D.records.filter(r=>r.cert_no).length}/${D.records.length} records carry a certificate no.`],
['IATF 16949:2016','7.1.5.2 Records and out-of-calibration assessment','As-found results are recorded; an out-of-tolerance as-found opens a case to assess affected product and customer notification.',()=>`${D.oot.length} cases, ${D.oot.filter(o=>o.status==='Closed').length} closed`],
['IATF 16949:2016','7.1.5.3 Laboratory requirements','Internal / external source and accreditation are recorded for every calibration.',()=>`${D.records.filter(r=>r.accreditation).length} records with accreditation noted`],
['IATF 16949:2016','7.1.5.1.1 Measurement systems analysis','Gage R&R studies (average & range method) with %GRR, %tolerance, distinct categories and a decision per study. Bias, linearity and stability studies are planned.',()=>`${(D.msa||[]).length} studies, ${(D.msa||[]).filter(s=>s.decision==='Acceptable').length} acceptable`],
['VDA 6.3','Test equipment suitability and status (process audit)','Status, history card and audit evidence can be shown on screen or printed per gauge.',()=>`${D.records.length} calibration records`]];
function csvDown(n,rows){const c=v=>`"${String(v??'').replace(/"/g,'""')}"`,a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(c).join(',')).join('\n')],{type:'text/csv'}));a.download=n+'-'+today()+'.csv';a.click()}
function audit(){const I=D.instruments;csvDown('instrument-register',[['Tag','Description','Type','Make','Model','Serial','Range','Least count','Tolerance','Department','Location','Criticality','Source','Lab','Frequency (months)','Last calibration','Next due','Status'],...I.map(i=>[i.tag,i.name,i.itype,i.make,i.model,i.serial_no,i.range_text,i.least_count,i.tolerance,i.department,i.location,i.criticality,i.cal_source,i.lab,i.freq_months,i.last_cal,i.next_due,st(i)[0]])]);
csvDown('calibration-records',[['Tag','Date','Kind','Lab','Accreditation','Certificate','As-found OK','Result','Max error','Uncertainty','Next due','Calibrator'],...D.records.map(r=>{const i=I.find(x=>x.id===r.instrument_id)||{};return[i.tag,r.cal_date,r.kind,r.lab,r.accreditation,r.cert_no,r.as_found_ok,r.result,r.max_error,r.uncertainty,r.next_due,r.calibrator]})]);
csvDown('oot-register',[['Tag','Opened','Summary','Last good calibration','Risk','Status','Closed'],...D.oot.map(o=>{const i=I.find(x=>x.id===o.instrument_id)||{};return[i.tag,o.opened_at,o.summary,o.last_good,o.risk,o.status,o.closed_at]})]);
csvDown('msa-register',[['Tag','Characteristic','Date','%GRR','%Tolerance','ndc','Decision'],...(D.msa||[]).map(s=>{const i=I.find(x=>x.id===s.instrument_id)||{},r=s.results||{};return[i.tag,s.characteristic,s.study_date,r.pctGRR,r.pctTol,r.ndc,s.decision]})])}
function std(){$('#std').innerHTML=`<div class="row"><button class="btn" id="aud">⬇ Download audit pack (4 CSV files)</button><button class="btn o" onclick="window.print()">Print this page</button></div><p class="mut">How this app supports each requirement, with live evidence from your data. The auditor decides compliance; clause wording should be checked against your copy of each standard.</p><table><thead><tr><th>Standard</th><th>Requirement</th><th>How the app meets it</th><th>Live evidence</th></tr></thead><tbody>${STD.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td><b>${esc(r[3]())}</b></td></tr>`).join('')}</tbody></table>`}
const F=(id,l,v,t='text',o)=>`<div><label>${l}</label>${o?`<select id="${id}">${o.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('')}</select>`:`<input id="${id}" type="${t}" value="${esc(v??'')}">`}</div>`,V=id=>$('#'+id).value.trim();
/* ---- MSA: Gage R&R, average & range method (AIAG MSA 4th ed. constants, 6σ spread) ---- */
const K1={2:.8862,3:.5908},K2={2:.7071,3:.5231},K3={2:.7071,3:.5231,4:.4467,5:.4030,6:.3742,7:.3534,8:.3375,9:.3249,10:.3146},D4={2:3.267,3:2.574};
function grr(d,A,P,T,tol){const av=a=>a.reduce((x,y)=>x+y,0)/a.length,rg=a=>Math.max(...a)-Math.min(...a);let ok=true;d.forEach(a=>a.forEach(p=>p.forEach(v=>{if(isNaN(v))ok=false})));if(!ok)return null;
const Rb=d.map(a=>av(a.map(p=>rg(p)))),Rbb=av(Rb),aMean=d.map(a=>av(a.flat())),xd=Math.max(...aMean)-Math.min(...aMean),pMean=Array.from({length:P},(_,j)=>av(d.flatMap(a=>a[j]))),Rp=Math.max(...pMean)-Math.min(...pMean);
const EV=Rbb*K1[T],AV=Math.sqrt(Math.max((xd*K2[A])**2-EV**2/(P*T),0)),GRR=Math.hypot(EV,AV),PV=Rp*K3[P],TV=Math.hypot(GRR,PV),pg=GRR/TV*100,pt=tol>0?6*GRR/tol*100:null,ndc=Math.max(1,Math.floor(1.41*PV/GRR));

const dc=x=>x==='Acceptable'?'g':x==='Conditional'?'a':'r';
function msa(){const L=D.msa||[];$('#msa').innerHTML=`<div class="row"><span class="mut">Gage R&amp;R studies — decision uses the worse of %GRR and %tolerance: &lt;10% acceptable, 10–30% conditional, &gt;30% not acceptable; ndc should be ≥ 5.</span><div style="flex:1"></div>${canEdit?'<button class="btn" id="nms">＋ New Gage R&amp;R study</button>':''}</div>${L.length?`<table><thead><tr><th>Instrument</th><th>Characteristic</th><th>Date</th><th>Set-up</th><th>%GRR</th><th>%Tol</th><th>ndc</th><th>Decision</th><th></th></tr></thead><tbody>${L.map(s=>{const i=D.instruments.find(x=>x.id===s.instrument_id)||{},r=s.results||{};return`<tr><td><b>${esc(i.tag)}</b><br><span class="mut">${esc(i.name)}</span></td><td>${esc(s.characteristic||'')}</td><td>${dmy(s.study_date)}</td><td>${s.appraisers}A × ${s.parts}P × ${s.trials}T</td><td>${r.pctGRR!=null?r.pctGRR.toFixed(1)+'%':'—'}</td><td>${r.pctTol!=null?r.pctTol.toFixed(1)+'%':'—'}</td><td>${r.ndc??'—'}</td><td><span class="chip ${dc(s.decision)}">${esc(s.decision)}</span></td><td>${canEdit?`<button class="btn o sm" data-em="${s.id}">Edit</button> <button class="btn o sm" data-dm="${s.id}">✕</button>`:''}</td></tr>`}).join('')}</tbody></table>`:'<p class="mut">No MSA studies yet.</p>'}`}
let MS={},CP=null;const parseTol=s=>{s=String(s||'').replace(/,/g,'').replace(/[−–]/g,'-');let m=s.match(/(\d+(?:\.\d+)?)\s*(?:±|\+\/-)\s*(\d+(?:\.\d+)?)/);if(m)return+(2*+m[2]).toFixed(6);m=s.match(/\+\s*(\d+(?:\.\d+)?)\s*[\/ ]\s*-\s*(\d+(?:\.\d+)?)/);if(m)return+(+m[1]+ +m[2]).toFixed(6);m=s.match(/(\d+(?:\.\d+)?)\s*(?:-|to)\s*(\d+(?:\.\d+)?)/);if(m&&+m[2]>+m[1])return+(m[2]-m[1]).toFixed(6);return''};

dated.`,true)}else if(b.dataset.e)iform(I(b.dataset.e));else if(b.dataset.c)cform(I(b.dataset.c));else if(b.dataset.h)hist(b.dataset.h);else if('x'in b.dataset)close();
