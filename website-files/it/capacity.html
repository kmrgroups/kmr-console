function parseStockPaste(txt) {
  const rows = [], unknown = [];
  String(txt || '').split(/\r?\n/).forEach(line => {
    const c = line.split(/\t|;|,(?=\s*[A-Za-z])/).map(x => x.trim()); if (c.length < 3) { if (line.trim()) unknown.push(line); return; }
    const partNo = c[0], st = c[1].toLowerCase(), qty = Number(String(c[c.length - 1]).replace(/,/g, '')), ty = c.length >= 4 ? c[2].toLowerCase() : '';
    const ops = state.operations.filter(o => o.partNo === partNo);
    if (!ops.length || !(qty >= 0)) { unknown.push(line); return; }
    let r = null;
    if (/^fg$|finish|despatch|dispatch/.test(st)) r = { kind: 'fg' };
    else {
      const m = st.match(/^op\s*(\d+)$/); const o = m ? ops[Number(m[1]) - 1] : ops.find(x => String(x.process).toLowerCase() === st);
      if (o) r = { kind: /supplier|vendor/.test(ty) ? 'sup' : /inspect|inward|iqc/.test(ty) ? 'insp' : 'wip', op: o.id };
    }
    if (!r) { unknown.push(line); return; }
    rows.push(Object.assign({ partNo, qty: Math.round(qty) }, r));
  });
  return { rows, unknown };
}
function parsePlanPaste(txt) {
  const known = new Set(state.operations.map(o => o.partNo));
  const rows = [], unknown = [];
  txt.split(/\r?\n/).forEach(line => {
    const c = line.split(/\t|;|,(?=\s*\d)/).map(x => x.trim()); if (c.length < 2 || !c[0]) return;
    const qty = Number(String(c[1]).replace(/[, ]/g, '')); if (isNaN(qty)) return;
    if (!known.has(c[0])) { unknown.push(c[0]); return; }
    rows.push({ partNo: c[0], qty: Math.max(0, qty), due: c[2] ? parseDue(c[2]) : null });
  });
  return { rows, unknown };
}
function parseDue(s) {
  s = String(s).trim(); const y = state.year, m = state.month, last = E.daysInMonth(y, m);
  let d;
  if (/^\d{1,2}$/.test(s)) d = Math.min(last, Number(s));
  else if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  else if ((d = /^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})$/.exec(s))) { const yy = d[3].length === 2 ? 2000 + Number(d[3]) : Number(d[3]); return E.iso(yy, Number(d[2]) - 1, Number(d[1])); }
  else if (/^\d{5}$/.test(s)) { const dt = new Date(Date.UTC(1899, 11, 30) + Number(s) * 864e5); return E.iso(dt.getUTCFullYear(), dt.getUTCMonth(), dt.getUTCDate()); }
  else return null;
  return E.iso(y, m, d);
}
function applyRoutingRows(rows, replace) {
  const clean = x => String(x || '').replace(/ /g, ' ').replace(/\s+/g, ' ').trim();
  if (replace) state.operations = [];
  let id = state.operations.reduce((a, o) => Math.max(a, o.id), 0);
  const p = ensurePlan();
  rows.forEach(r => {
    const mc = clean(r.machine);
    if (mc && !state.machines.some(m => m.code === mc)) state.machines.push({ code: mc, cell: E.cellOf(mc), availDays: null, hoursPerDay: null, remarks: '', active: true });
    const ex = state.operations.find(o => o.partNo === clean(r.partNo) && o.process === clean(r.process));
    if (ex) { ex.machine = mc; ex.cycleTime = r.ct; ex.partName = clean(r.partName) || ex.partName; }
    else state.operations.push({ id: ++id, partNo: clean(r.partNo), partName: clean(r.partName), process: clean(r.process), machine: mc, cycleTime: r.ct, alternates: [] });
    if (r.qty != null && !isNaN(r.qty)) { const pp = p.parts[clean(r.partNo)] = p.parts[clean(r.partNo)] || {}; pp.qty = r.qty; if (!pp.due) pp.due = model.monthEnd; }
  });
  commit();
}

function genPassword() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';
  const a = new Uint32Array(10); crypto.getRandomValues(a);
  return Array.from(a, n => chars[n % chars.length]).join('').replace(/^(.{4})(.{3})/, '$1-$2-');
}

/* ---------- Excel import (reads the original capacity.xlsx layout) ---------- */
async function importWorkbook(file) {
  try {
    const sheets = await XLSX.read(await file.arrayBuffer());
    let work = null, hdr = -1, name = '';
    for (const [n, g] of Object.entries(sheets)) {
      for (let r = 0; r < Math.min(10, g.length); r++) {
        const row = (g[r] || []).map(v => String(v || '').toLowerCase().trim());
        if (row.includes('part name') && row.some(v => v.startsWith('machine')) && row.some(v => v.startsWith('cycle time'))) { work = g; hdr = r; name = n; break; }
      }
      if (work) break;
    }
    if (!work) return toast('No sheet with “Part Name”, “Machine Code” and “Cycle Time” headers was found.');
    const H = work[hdr].map(v => String(v || '').toLowerCase().trim());
    const col = f => H.findIndex(f);
    const cN = col(v => v === 'part name'), cP = col(v => v.startsWith('part #') || v === 'part no' || v === 'part number'), cPr = col(v => v.startsWith('process')),
      cM = col(v => v.startsWith('machine')), cQ = col(v => v.startsWith('month plan') || v === 'qty' || v === 'quantity'), cC = col(v => v.startsWith('cycle time')),
      cG = col(v => v.startsWith('pph')), cH = col(v => v.startsWith('working hours')), cI = col(v => v.startsWith('working days'));
    const rows = [];
    let oeeGuess = null, hrs = null, days = null;
    for (let r = hdr + 1; r < work.length; r++) {
      const w = work[r] || []; if (!w[cP] || !(Number(w[cC]) > 0)) continue;
      rows.push({ partName: w[cN], partNo: w[cP], process: w[cPr], machine: w[cM], qty: cQ >= 0 ? Number(w[cQ]) || 0 : null, ct: Number(w[cC]) });
      if (oeeGuess == null && cG >= 0 && Number(w[cG]) > 0) oeeGuess = Math.round(Number(w[cG]) * Number(w[cC]) / 36);
      if (hrs == null && cH >= 0 && Number(w[cH]) > 0) hrs = Number(w[cH]);
      if (days == null && cI >= 0 && Number(w[cI]) > 0) days = Number(w[cI]);
    }
    // Capacity Plan sheet: machines, available days, remarks
    const capRows = [];
    for (const g of Object.values(sheets)) {
      for (let r = 0; r < Math.min(10, g.length); r++) {
        const row = (g[r] || []).map(v => String(v || '').toLowerCase().trim());
        if (row[0] === 'machines' && row.some(v => v.includes('available'))) {
          const cA = row.findIndex(v => v.includes('available')), cR = row.findIndex(v => v.startsWith('remark'));
          for (let k = r + 1; k < g.length; k++) { const w = g[k] || []; if (w[0]) capRows.push({ code: String(w[0]).trim(), avail: Number(w[cA]), remark: cR >= 0 ? w[cR] || '' : '' }); }
        }
      }
    }
    modal({
      title: 'Import Excel workbook',
      body: `<p>Found <b>${rows.length}</b> operations on sheet “${h(name)}”${capRows.length ? ` and <b>${capRows.length}</b> machines on the Capacity Plan sheet` : ''}.</p>
        ${oeeGuess ? `<p>Detected plant standards: <b>OEE ${oeeGuess}%</b>${hrs ? `, <b>${hrs} h/day</b>` : ''}${days ? `, <b>${days} days/month</b>` : ''}.</p>` : ''}
        <p>Quantities and remarks will be loaded into <b>${E.MONTHS[state.month]} ${state.year}</b>. Change the month at the top first if needed.</p>
        <label class="chk"><input type="checkbox" id="impReplace" checked> Replace existing routings (recommended for the first import)</label>
        <label class="chk"><input type="checkbox" id="impStd" ${oeeGuess ? 'checked' : ''}> Use the detected plant standards</label>`,
      buttons: [{ label: 'Import', cls: 'primary', act: () => {
        if ($('#impStd').checked) { if (oeeGuess) state.settings.oee = oeeGuess; if (hrs) state.settings.hoursPerDay = hrs; if (days) state.settings.daysPerMonth = days; }
        applyRoutingRows(rows, $('#impReplace').checked);
        const p = ensurePlan();
        capRows.forEach(c => {
          if (!state.machines.some(m => m.code === c.code)) state.machines.push({ code: c.code, cell: E.cellOf(c.code), availDays: null, hoursPerDay: null, remarks: '', active: true });
          p.machines[c.code] = { availDays: isNaN(c.avail) ? null : c.avail, remarks: String(c.remark || '') };
        });
        commit(); toast(`Imported ${rows.length} operations from ${file.name}`);
      } }]
    });
  } catch (e) { toast(e.message || 'Could not read this workbook.'); }
}

   DEPLOYMENT GUIDE — Settings › Deployment guide
   Step-by-step set-up of the planner for any customer. Everything is built
   from the current connection and page address; no customer data is fixed.

'use strict';

function projectRef() {
  const m = /^https:\/\/([a-z0-9-]+)\.supabase\.(co|in)$/i.exec(Cloud.config().url || '');
  return m ? m[1] : '_';            // "_" lets Supabase ask which project to open
}
const sbLink = path => `https://supabase.com/dashboard/project/${projectRef()}/${path}`;
const extLink = (url, text) => `<a href="${h(url)}" target="_blank" rel="noopener">${h(text)} ↗</a>`;
function plannerAddress() {
  return /^https?:/.test(location.protocol) ? location.origin + location.pathname : '';
}
function pageFileName() {
  const f = (location.pathname.split('/').pop() || '').trim();
  return /\.html?$/i.test(f) ? f : 'capacity.html';
}
function deploySql() {
  const email = ((ui.deployEmail || '').trim() || 'admin@yourcompany.com').toLowerCase().replace(/'/g, '');
  return (window.DEPLOY_ASSETS.sql || '').replace(/admin@yourcompany\.com/g, email);
}
function manifestText() {
  const s = state.settings, page = pageFileName();
  return JSON.stringify({
    name: `${s.companyName || 'Capacity'} Planner`, short_name: 'Capacity', id: page, start_url: page, scope: './',
    display: 'standalone', background_color: '#F3F5F8', theme_color: '#0E2240',
    icons: [{ src: 'capacity-icon.svg', sizes: 'any', type: 'image/svg+xml', purpose: 'any maskable' }]
  }, null, 2);
}
const EMAIL_TEMPLATE = `<h2>Password reset</h2>
<p>Your code for the Capacity Planner is:</p>
<p style="font-size:28px;font-weight:bold;letter-spacing:6px">{{ .Token }}</p>
<p>It expires in 1 hour. If you did not ask for this, ignore this e-mail.</p>`;

function codeBlock(id, text, dl) {
  return `<div class="codebox"><div class="codebar"><span>${h(dl ? dl.name : '')}</span><span style="display:flex;gap:6px"><button class="btn sm" data-act="copyBlock" data-target="${id}">${icon('copy')}Copy</button>${dl && dl.asset ? `<button class="btn sm" data-act="dlAsset" data-asset="${dl.asset}">${icon('download')}Download</button>` : ''}</span></div><pre id="${id}">${h(text)}</pre></div>`;
}
function step(n, title, time, body) {
  const done = (ui.deployDone || {})[n];
  return `<section class="card dstep ${done ? 'done' : ''}" id="dstep-${n}"><div class="card-h"><div style="display:flex;gap:12px;align-items:flex-start"><span class="dnum">${done ? '✓' : n}</span><div><h2>${h(title)}</h2><div class="sub">${h(time)}</div></div></div>
    <label class="chk small"><input type="checkbox" data-dstep="${n}" ${done ? 'checked' : ''}> Done</label></div><div class="card-b prose dbody">${body}</div></section>`;
}

    </tbody></table></div></section>

  <section class="card"><div class="card-h"><div><h2>Updating the planner later</h2></div></div><div class="card-b prose">
    <p>Replace only the planner page (<code>${h(page)}</code>) in the same place. <code>capacity-config.json</code> and the data in Supabase stay as they are, so nothing needs to be entered again. Ask users to press <b>Ctrl+F5</b> once.</p></div></section>`;
}

/* ---------- actions used by the guide ---------- */
Object.assign(Actions, {
  async copyBlock(t) {
    const el = document.getElementById(t.dataset.target); if (!el) return;
    try { await navigator.clipboard.writeText(el.textContent); toast('Copied'); }
    catch (e) { const r = document.createRange(); r.selectNodeContents(el); getSelection().removeAllRanges(); getSelection().addRange(r); toast('Press Ctrl+C to copy'); }
  },
  async dlAsset(t) {
    const a = t.dataset.asset, txt = (name, body, type) => download(name, new Blob([body], { type: type || 'text/plain' }));
    if (a === 'sql') return txt('supabase_setup.sql', deploySql());
    if (a === 'fn') return txt('admin-users-function.txt', window.DEPLOY_ASSETS.fn || '');
    if (a === 'manifest') return txt('capacity.webmanifest', manifestText(), 'application/manifest+json');
    if (a === 'config') {
      const c = Cloud.config();
      if (!c.url || !c.key) return toast('Connect first in Settings › General › Cloud connection.');
      return txt('capacity-config.json', JSON.stringify({ url: c.url, anonKey: c.key, workspace: c.workspace }, null, 2), 'application/json');
    }
  },
  clearPlans() {
    confirmBox('Clear all monthly plans?', 'Every month’s part quantities, due dates, machine days and splits are removed. Machines, routings and plant standards stay in the Operations Master. Download a backup first if you may need them.', 'Clear plans', () => {
      state.plans = {}; commit(); toast('Monthly plans cleared.'); render();
    }, true);
  },
  blankStart() {
    confirmBox('Start a new company (empty)?', 'All company details, machines, routings and monthly plans will be removed so you can set up a new company from scratch. Plant standards keep their default values. Download a backup first if you may need the current data.', 'Start empty', () => {
      state = blankState(); commit(); ui.mastersTab = 'machines'; go('settings'); toast('Empty company ready. Enter the company name, then add machines in Masters.');
    }, true);
  }
});

function blankState() {
  const d = defaultState();
  return normalise({
    version: 4, year: new Date().getFullYear(), month: new Date().getMonth(), scenario: 'standard',
    settings: Object.assign({}, d.settings, { companyName: 'Your Company Name', subtitle: 'Capacity Plan & Machine Loading', logo: '', holidays: [], holidayNames: {} }),
    machines: [], operations: [], plans: {}
  });
}

document.addEventListener('input', ev => {
  if (ev.target.id === 'dgEmail') { ui.deployEmail = ev.target.value; const pre = $('#dgSql'); if (pre) pre.textContent = deploySql(); }
});
document.addEventListener('change', ev => {
  const n = ev.target.dataset && ev.target.dataset.dstep;
  if (n) { ui.deployDone = Object.assign({}, ui.deployDone, { [n]: ev.target.checked }); LS.set('cp4_deploy_done', ui.deployDone); render(true); }
});
ui.deployDone = LS.get('cp4_deploy_done') || {};

/* ---------- boot (runs last) ---------- */
'use strict';
(function boot() {
  applyTheme();
  state = loadLocal();
  const brand = LS.get('cp4_brand'); if (brand && !LS.get(K_STATE)) Object.assign(state.settings, brand);
    const [hp, hs] = (location.hash || '').replace(/^#(go=)?/, '').split('/'); if (PAGES.some(p => p.id === hp)) { ui.page = hp; if (hp === 'masters' && hs) ui.mastersTab = hs; if (hp === 'settings' && hs) ui.settingsTab = hs; }
  render();
  Cloud.loadSiteConfig().then(() => { cloudBoot(); render(); });
})();

</script>
<script src="/it/apps/back.js"></script>
<script src="/it/apps/kmr-present-link.js"></script></body>
