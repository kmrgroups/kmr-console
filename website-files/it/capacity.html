<style>
/* ==========================================================================
   Capacity Planner — "Navy & Brass" corporate theme
   ========================================================================== */
:root {
  --ink: #0E2240;          /* navy — sidebar, headings */
  --ink-2: #16305A;
  --brass: #A8844A;        /* accent */
  --brass-soft: #F4ECDD;
  --bg: #F3F5F8;
  --surface: #FFFFFF;
  --surface-2: #F8F9FB;
  --line: #DDE2EA;
  --line-strong: #C5CDD9;
  --text: #16202E;
  --muted: #5B6778;
  --faint: #8A95A5;
  --focus: #2F5EA8;
  --ok: #1F7A55;   --ok-bg: #E3F4EC;
  --tight: #6A6F1E; --tight-bg: #F1F3D9;
  --warn: #9A6200; --warn-bg: #FFF1D1;
  --crit: #B42318; --crit-bg: #FDE7E5;
  --idle: #6B7686; --idle-bg: #EEF1F5;
  --bar-track: #E9EDF2;
  --shadow: 0 1px 2px rgba(14,34,64,.05), 0 4px 16px rgba(14,34,64,.05);
  --nav-bg: #0E2240; --nav-text: #C9D3E3; --nav-active: #FFFFFF; --nav-hover: rgba(255,255,255,.07);
  --radius: 10px;
  --serif: "Source Serif 4", "Source Serif Pro", Georgia, "Times New Roman", serif;
  --sans: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #D9E2F1; --ink-2: #B9C7DD; --brass: #D1AE72; --brass-soft: #2E2718;
    --bg: #0B1321; --surface: #111C2E; --surface-2: #0F192A; --line: #22324A; --line-strong: #2F4260;
    --text: #E4E9F1; --muted: #9AA7BA; --faint: #6F7D92; --focus: #7FA6E6;
    --ok: #5CC795; --ok-bg: #12301F; --tight: #C9CF6A; --tight-bg: #2B2D12; --warn: #F0B54A; --warn-bg: #33260B;
    --crit: #FF8A7E; --crit-bg: #3A1512; --idle: #93A0B3; --idle-bg: #1A2638; --bar-track: #1C2A40;
    --shadow: 0 1px 2px rgba(0,0,0,.3); --nav-bg: #08101C; --nav-text: #A9B6CA;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ink: #D9E2F1; --ink-2: #B9C7DD; --brass: #D1AE72; --brass-soft: #2E2718;
  --bg: #0B1321; --surface: #111C2E; --surface-2: #0F192A; --line: #22324A; --line-strong: #2F4260;
  --text: #E4E9F1; --muted: #9AA7BA; --faint: #6F7D92; --focus: #7FA6E6;
  --ok: #5CC795; --ok-bg: #12301F; --tight: #C9CF6A; --tight-bg: #2B2D12; --warn: #F0B54A; --warn-bg: #33260B;
  --crit: #FF8A7E; --crit-bg: #3A1512; --idle: #93A0B3; --idle-bg: #1A2638; --bar-track: #1C2A40;
  --shadow: 0 1px 2px rgba(0,0,0,.3); --nav-bg: #08101C; --nav-text: #A9B6CA;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
h1, h2, h3 { font-family: var(--serif); color: var(--ink); text-wrap: balance; margin: 0; font-weight: 600; letter-spacing: -.005em; }
h1 { font-size: 1.55rem; line-height: 1.2; }
h2 { font-size: 1.15rem; line-height: 1.3; }
h3 { font-size: 1rem; }
p { margin: 0; }
a { color: var(--focus); }
.num, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--brass); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- App shell ---------- */
.app { display: block; min-height: 100%; }
.side { display: none !important; }
.apptabs { position: sticky; top: 0; z-index: 25; background: var(--card, #fff); border-bottom: 1px solid var(--line); }
.apptabs .brand-row { display: flex; align-items: center; gap: 10px; padding: 8px 20px 0; }
.apptabs .logo { width: 30px; height: 30px; border-radius: 8px; background: var(--nav-bg); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 12px; overflow: hidden; }
.apptabs .logo img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
.apptabs .brand-text { display: flex; flex-direction: column; line-height: 1.2; font-size: 13px; }.apptabs .brand-text small { color: var(--muted); }
.apptabs .grow { flex: 1; }
.apptabs .tabs { display: flex; gap: 4px; padding: 6px 16px 0; flex-wrap: wrap; align-items: flex-end; }
.apptabs .tab { text-decoration: none; display: inline-flex; gap: 6px; align-items: center; padding: 9px 14px; font-weight: 600; font-size: 13px; color: var(--muted); border-radius: 10px 10px 0 0; white-space: nowrap; cursor: pointer; }
.apptabs .tab.on { color: var(--ink); background: var(--bg); box-shadow: inset 0 -3px 0 var(--brass); }
.apptabs .tabs2 { flex-basis: 100%; display: flex; gap: 4px; flex-wrap: wrap; padding: 4px 0 6px; border-top: 1px solid var(--line); }
.apptabs .tabs2 .tab { font-weight: 500; padding: 6px 12px; border-radius: 8px; }
.apptabs .badge { background: var(--red, #b42318); color: #fff; border-radius: 99px; padding: 0 6px; font-size: 11px; }
.side { background: var(--nav-bg); color: var(--nav-text); position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; overflow-y: auto; }
.brand { display: flex; gap: 12px; align-items: center; padding: 20px 18px 18px; border-bottom: 1px solid rgba(255,255,255,.08); }
.logo { width: 40px; height: 40px; border-radius: 8px; flex: none; display: grid; place-items: center; background: #fff; color: #0E2240; font: 700 15px/1 var(--serif); overflow: hidden; border: 1px solid rgba(168,132,74,.6); }
.logo img { width: 100%; height: 100%; object-fit: contain; }
.brand-name { color: #fff; font: 600 14px/1.25 var(--serif); }
.brand-sub { font-size: 11px; color: #9FB0C8; margin-top: 2px; }
.nav { padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; flex: 1; }
.nav-group { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: #7E8FA9; padding: 14px 10px 6px; }
.nav :is(button,a) { all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: 7px; cursor: pointer; font-size: 13.5px; color: var(--nav-text); position: relative; }
.nav :is(button,a):hover { background: var(--nav-hover); color: #fff; }
.nav :is(button,a).active { background: rgba(255,255,255,.1); color: var(--nav-active); font-weight: 600; }
.nav :is(button,a).active::before { content: ""; position: absolute; left: -10px; top: 8px; bottom: 8px; width: 3px; border-radius: 2px; background: var(--brass); }
.nav :is(button,a):focus-visible { outline: 2px solid var(--brass); }
.nav svg { width: 18px; height: 18px; flex: none; opacity: .9; }
.nav .badge { margin-left: auto; font: 600 10.5px/1 var(--mono); padding: 3px 6px; border-radius: 10px; background: #B42318; color: #fff; }
.side-foot { padding: 14px 18px 18px; border-top: 1px solid rgba(255,255,255,.08); font-size: 11px; color: #7E8FA9; }
.side-foot a { color: #C9A96E; text-decoration: none; }
html.kmr-platform .side-foot .powered-line { display: none; }
.sync-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: #C9D3E3; margin-bottom: 8px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #6B7686; display: inline-block; }
.dot.on { background: #3CC486; } .dot.busy { background: #F0B54A; } .dot.err { background: #FF6B5E; }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: 74px; z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.topbar-in { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; padding: 12px 28px; }
.page-title { flex: 1 1 260px; min-width: 0; }
.page-title h1 { font-size: 1.35rem; }
.page-title p { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.content { padding: 22px 28px 40px; display: flex; flex-direction: column; gap: 20px; max-width: 1480px; width: 100%; }

/* ---------- Controls ---------- */
.btn { all: unset; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 34px; padding: 0 13px; border-radius: 7px; font: 500 13px/1 var(--sans); cursor: pointer; border: 1px solid var(--line-strong); background: var(--surface); color: var(--text); white-space: nowrap; }
.btn:hover { border-color: var(--ink-2); }
.btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.btn svg { width: 16px; height: 16px; }
.btn.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.btn.primary:hover { background: var(--ink-2); }
.btn.brass { background: var(--brass); border-color: var(--brass); color: #fff; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.danger { color: var(--crit); border-color: color-mix(in srgb, var(--crit) 40%, var(--line)); }
.btn.sm { height: 28px; padding: 0 9px; font-size: 12px; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { all: unset; box-sizing: border-box; padding: 0 12px; height: 32px; display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; cursor: pointer; color: var(--muted); border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--ink); color: var(--surface); font-weight: 600; }
.seg button:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
.period { display: inline-flex; align-items: center; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); height: 34px; }
.period button { all: unset; cursor: pointer; width: 30px; height: 32px; display: grid; place-items: center; color: var(--muted); }
.period button:hover { color: var(--text); }
.period select { border: 0; background: transparent; font: 600 13px var(--sans); color: var(--text); padding: 0 2px; height: 32px; cursor: pointer; }
input, select, textarea { font: inherit; color: var(--text); }
.inp { width: 100%; height: 34px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: 7px; background: var(--surface); }
textarea.inp { height: auto; padding: 8px 10px; min-height: 120px; font: 12px/1.45 var(--mono); }
.inp:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 18%, transparent); }
.inp.num { text-align: right; }
.cell-inp { width: 100%; min-width: 64px; height: 30px; padding: 0 8px; border: 1px solid transparent; border-radius: 6px; background: var(--brass-soft); font-family: var(--mono); font-variant-numeric: tabular-nums; }
.cell-inp.txt { font-family: var(--sans); background: transparent; border-color: var(--line); }
.cell-inp:hover { border-color: var(--line-strong); }
.cell-inp:focus { outline: none; border-color: var(--focus); background: var(--surface); }
.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-size: 12px; font-weight: 600; color: var(--muted); }
.field .hint { font-size: 11.5px; color: var(--faint); }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px 16px; }
.chk { display: flex; gap: 9px; align-items: flex-start; font-size: 13px; cursor: pointer; }
.chk input { margin-top: 3px; accent-color: var(--ink); }

/* ---------- Cards ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); min-width: 0; }
.card-h { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; padding: 16px 20px 12px; }
.card-h .sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.card-b { padding: 4px 20px 20px; }
.card-b.flush { padding: 0 0 6px; }
.grid-2 { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 20px; }
.grid-2e { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }

/* KPI strip */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.kpi { padding: 16px 20px 18px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.kpi:last-child { border-right: 0; }
.kpi .lbl { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.kpi .val { font: 600 1.9rem/1.05 var(--serif); color: var(--ink); font-variant-numeric: tabular-nums lining-nums; }
.kpi .val small { font: 500 .8rem var(--sans); color: var(--muted); margin-left: 4px; }
.kpi .foot { font-size: 12px; color: var(--muted); }
.meter { height: 6px; border-radius: 3px; background: var(--bar-track); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--ink); border-radius: 3px; }
.tiers { display: flex; gap: 6px; flex-wrap: wrap; }

/* Status pills */
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px 3px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.ok { color: var(--ok); background: var(--ok-bg); }
.pill.tight { color: var(--tight); background: var(--tight-bg); }
.pill.sunday { color: var(--warn); background: var(--warn-bg); }
.pill.critical { color: var(--crit); background: var(--crit-bg); }
.pill.idle { color: var(--idle); background: var(--idle-bg); }
.pill.plain::before { display: none; }
.tag { display: inline-block; padding: 1px 7px; border-radius: 5px; font-size: 11px; font-weight: 600; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.tag.brass { background: var(--brass-soft); border-color: transparent; color: var(--brass); }

/* ---------- Tables ---------- */
.tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table.tbl { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
.tbl th { position: sticky; top: 0; z-index: 1; text-align: left; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; background: var(--surface-2); padding: 9px 12px; border-bottom: 1px solid var(--line); border-top: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl .r { text-align: right; }
/* fit-to-width tables: headers wrap, tighter cells, no sideways scrolling on a normal screen */
.tbl.fit { width: 100%; table-layout: auto; }
.tbl.fit th { white-space: normal; line-height: 1.25; padding: 8px 6px; vertical-align: bottom; }
.tbl.fit td { padding: 8px 6px; }
.tbl.fit th .xl { display: block; }
.tbl.fit .cell-inp { width: 100%; min-width: 0; box-sizing: border-box; }
.tbl.fit td.remcol { width: 22%; min-width: 120px; }
.tbl.fit .pill { white-space: normal; }
.tbl.fit .small { font-size: 11px; }
.tbl-wrap.fitwrap { overflow-x: visible; }
.tbl .c { text-align: center; }
.tbl td.num, .tbl th.r { font-variant-numeric: tabular-nums; }
.tbl tbody tr.click { cursor: pointer; }
.tbl tbody tr.click:hover td { background: var(--surface-2); }
.tbl tbody tr.sel td { background: color-mix(in srgb, var(--brass) 9%, var(--surface)); }
.tbl tfoot td { font-weight: 600; background: var(--surface-2); border-top: 1px solid var(--line-strong); border-bottom: 0; }
.tbl .stick { position: sticky; left: 0; background: var(--surface); z-index: 1; }
.tbl th.stick { z-index: 2; background: var(--surface-2); }
.tbl .neg { color: var(--crit); font-weight: 600; }
.tbl .pos { color: var(--ok); }
.tbl .zero td { color: var(--faint); }
.xl { font: 600 10px var(--mono); color: var(--brass); letter-spacing: 0; text-transform: none; display: block; margin-top: 2px; }

/* Load bar in table */
.lbar { position: relative; height: 10px; border-radius: 5px; background: var(--bar-track); min-width: 90px; }
.lbar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; }
.lbar .cap { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); border-radius: 1px; }
.fill-ok { background: var(--ok); } .fill-tight { background: var(--tight); } .fill-sunday { background: var(--warn); } .fill-critical { background: var(--crit); } .fill-idle { background: var(--idle); }

/* Machine load chart (SVG) */
.chart svg { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font: 11px var(--sans); }
.chart .lab { fill: var(--text); font-weight: 500; }
.chart .val { fill: var(--text); font: 600 11px var(--mono); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .capline { stroke: var(--ink); stroke-width: 2; }
.chart .sunline { stroke: var(--warn); stroke-width: 1.5; stroke-dasharray: 4 3; }
.chart .track { fill: var(--bar-track); }
.chart .b-ok { fill: var(--ok); } .chart .b-tight { fill: var(--tight); } .chart .b-sunday { fill: var(--warn); } .chart .b-critical { fill: var(--crit); } .chart .b-idle { fill: var(--idle); }
.chart .row-hit { fill: transparent; cursor: pointer; }
.chart .row-hit:hover { fill: color-mix(in srgb, var(--brass) 10%, transparent); }
.legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 8px; border-radius: 2px; display: inline-block; }
.legend i.line { width: 2px; height: 12px; background: var(--ink); }
.legend i.dash { width: 12px; height: 0; border-top: 2px dashed var(--warn); border-radius: 0; }

/* Cells */
.cells { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.cellbox { all: unset; box-sizing: border-box; cursor: pointer; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); display: flex; flex-direction: column; gap: 7px; }
.cellbox:hover { border-color: var(--line-strong); }
.cellbox.on { border-color: var(--brass); box-shadow: inset 0 0 0 1px var(--brass); background: var(--surface); }
.cellbox:focus-visible { outline: 2px solid var(--focus); }
.cellbox .t { display: flex; justify-content: space-between; font-weight: 600; font-size: 13px; }
.cellbox .s { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); }

/* Action list */
.actions-list { display: flex; flex-direction: column; }
.act { display: grid; grid-template-columns: 4px 1fr; gap: 14px; padding: 13px 20px; border-top: 1px solid var(--line); }
.act:first-child { border-top: 0; }
.act .stripe { border-radius: 2px; }
.act h4 { margin: 0 0 3px; font: 600 13.5px var(--sans); color: var(--text); }
.act p { font-size: 12.5px; color: var(--muted); }
.act .go { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; }

/* Inspector */
.insp-metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 12px; }
.insp-metrics div { background: var(--surface-2); padding: 9px 10px; }
.insp-metrics b { display: block; font: 600 15px var(--mono); color: var(--ink); }
.insp-metrics span { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.oplist { display: flex; flex-direction: column; gap: 8px; max-height: 460px; overflow-y: auto; }
.opcard { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 12.5px; }
.opcard.zero { opacity: .55; }
.opcard .l1 { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; }
.opcard .l2 { color: var(--muted); margin-top: 2px; }
.opcard .l3 { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 7px; padding-top: 7px; border-top: 1px dashed var(--line); font: 11.5px var(--mono); color: var(--muted); }

/* ---------- Gantt ---------- */
.gantt { min-width: 900px; font-size: 12px; }
.g-head, .g-row { display: grid; grid-template-columns: 170px 1fr; }
.g-days { display: grid; }
.g-day { text-align: center; font: 10.5px var(--mono); color: var(--muted); padding: 6px 0 5px; border-left: 1px solid var(--line); }
.g-day.off { background: repeating-linear-gradient(135deg, transparent 0 4px, color-mix(in srgb, var(--line) 70%, transparent) 4px 5px); color: var(--faint); }
.g-day.hol { background: var(--crit-bg); color: var(--crit); }
.g-day .w { display: block; font-size: 9px; font-family: var(--sans); text-transform: uppercase; }
.g-head { position: sticky; top: 0; background: var(--surface-2); border-bottom: 1px solid var(--line); border-top: 1px solid var(--line); z-index: 2; }
.g-name { padding: 8px 12px; display: flex; flex-direction: column; justify-content: center; border-right: 1px solid var(--line); position: sticky; left: 0; background: var(--surface); z-index: 1; }
.g-head .g-name { background: var(--surface-2); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.g-name b { font-weight: 600; font-size: 12.5px; }
.g-name span { font: 11px var(--mono); color: var(--muted); }
.g-row { border-bottom: 1px solid var(--line); }
.g-lane { position: relative; min-height: 44px; }
.g-bg { position: absolute; inset: 0; display: grid; }
.g-bg i { border-left: 1px solid var(--line); }
.g-bg i.off { background: repeating-linear-gradient(135deg, transparent 0 4px, color-mix(in srgb, var(--line) 55%, transparent) 4px 5px); }
.g-bg i.hol { background: var(--crit-bg); }
.g-bar { position: absolute; height: 22px; top: 11px; border-radius: 5px; color: #fff; font: 600 10.5px/22px var(--sans); padding: 0 6px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; cursor: default; box-shadow: 0 1px 0 rgba(0,0,0,.08); }
.g-bar.a { background: #2F4C7A; } .g-bar.b { background: #4E6A95; }
.g-bar.late { background: var(--warn); color: #231800; }
.g-bar.over { background: var(--crit); }
.g-bar.moved { outline: 2px dashed var(--brass); outline-offset: 1px; }
.g-due { position: absolute; top: 4px; width: 9px; height: 9px; background: var(--ink); transform: translateX(-50%) rotate(45deg); border: 1.5px solid var(--surface); z-index: 1; }
.g-cap { position: absolute; top: 0; bottom: 0; border-left: 2px solid var(--ink); opacity: .55; }
.g-today { position: absolute; top: 0; bottom: 0; border-left: 2px solid var(--brass); }

/* ---------- Tabs (sub) ---------- */
.subtabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); padding: 0 20px; overflow-x: auto; }
.subtabs :is(button,a) { all: unset; cursor: pointer; padding: 11px 12px; font-size: 13px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.subtabs :is(button,a).on { color: var(--ink); border-bottom-color: var(--brass); font-weight: 600; }
.subtabs :is(button,a):focus-visible { outline: 2px solid var(--focus); }

/* Toolbar row inside cards */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 0 20px 12px; }
.toolbar .grow { flex: 1 1 200px; }
.search { position: relative; flex: 1 1 220px; max-width: 340px; }
.search input { padding-left: 32px; }
.search svg { position: absolute; left: 10px; top: 9px; width: 16px; height: 16px; color: var(--faint); }

/* Notices */
.vd-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.vd { border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); padding: 18px 20px; border-left: 6px solid var(--idle); }
.vd.ok { border-left-color: var(--ok); } .vd.warn { border-left-color: var(--warn); } .vd.bad { border-left-color: var(--crit); }
.vd .q { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.vd .a { font-family: var(--serif); font-size: 26px; font-weight: 700; margin: 4px 0 6px; }
.vd.ok .a { color: var(--ok); } .vd.warn .a { color: var(--warn); } .vd.bad .a { color: var(--crit); }
.bul { display: grid; grid-template-columns: 34px 1fr; gap: 12px; padding: 14px 20px; border-top: 1px solid var(--line); }
.bul .n { width: 28px; height: 28px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 13px; }
.bul.s3 .n { background: var(--crit); } .bul.s2 .n { background: var(--warn); } .bul.s1 .n { background: var(--idle); }
.bul h4 { margin: 0 0 4px; font-size: 14.5px; } .bul .k { font-size: 12.5px; color: var(--muted); } .bul .k b { color: var(--text); }
.cls { display: inline-block; min-width: 20px; text-align: center; padding: 1px 6px; border-radius: 4px; font-size: 11px; font-weight: 700; background: var(--idle-bg); color: var(--idle); }
.cls.A { background: var(--crit-bg); color: var(--crit); } .cls.B { background: var(--warn-bg); color: var(--warn); }
details.dsp { border-top: 1px solid var(--line); padding: 10px 20px; } details.dsp summary { cursor: pointer; font-weight: 600; font-size: 13.5px; }
details.dsp ul { margin: 8px 0 0; padding-left: 18px; font-size: 13px; } details.dsp li { margin: 4px 0; }
@media (max-width: 900px) { .vd-grid { grid-template-columns: 1fr; } }
.note { display: flex; gap: 12px; padding: 12px 16px; border-radius: 8px; font-size: 13px; background: var(--surface-2); border: 1px solid var(--line); }
.note svg { width: 18px; height: 18px; flex: none; margin-top: 1px; color: var(--brass); }
.note.warn { background: var(--warn-bg); border-color: transparent; }
.note.warn svg { color: var(--warn); }
.note.crit { background: var(--crit-bg); border-color: transparent; }
.note.crit svg { color: var(--crit); }
.note.ok { background: var(--ok-bg); border-color: transparent; }
.note.ok svg { color: var(--ok); }
.note b { font-weight: 600; }

/* Steps (guided workflow) */
.steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.step { all: unset; box-sizing: border-box; cursor: pointer; padding: 13px 16px; display: flex; gap: 12px; align-items: center; border-right: 1px solid var(--line); }
.step:last-child { border-right: 0; }
.step:hover { background: var(--surface-2); }
.step:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
.step .n { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--brass); color: var(--brass); display: grid; place-items: center; font: 600 12px var(--mono); flex: none; }
.step.done .n { background: var(--brass); color: #fff; }
.step b { display: block; font-size: 13px; }
.step span { font-size: 11.5px; color: var(--muted); }

/* Modal + toast */
.scrim { position: fixed; inset: 0; background: rgba(8,16,28,.45); z-index: 60; display: grid; place-items: center; padding: 16px; }
.modal { background: var(--surface); border-radius: 12px; width: min(620px, 100%); max-height: 90vh; overflow: auto; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
.modal-h { padding: 18px 22px 8px; }
.modal-b { padding: 8px 22px 16px; display: flex; flex-direction: column; gap: 12px; font-size: 13.5px; }
.modal-f { padding: 12px 22px 18px; display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; border-top: 1px solid var(--line); }
.toast { position: fixed; right: 20px; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 70; background: var(--ink); color: var(--surface); padding: 11px 16px; border-radius: 8px; font-size: 13px; box-shadow: 0 8px 30px rgba(0,0,0,.25); max-width: calc(100vw - 40px); }

/* Help */
.prose { max-width: 72ch; font-size: 14px; line-height: 1.65; }
.prose h3 { margin: 18px 0 6px; font-size: 1.05rem; }
.prose p, .prose ul, .prose ol { margin: 0 0 10px; }
.prose code, .formula { font: 12.5px var(--mono); background: var(--surface-2); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; }
.formula { display: block; padding: 9px 12px; margin: 6px 0 10px; white-space: pre-wrap; }
.glossary { display: grid; grid-template-columns: minmax(140px, 200px) 1fr; gap: 8px 18px; font-size: 13px; }
.glossary dt { font-weight: 600; }
.glossary dd { margin: 0; color: var(--muted); }

/* Mobile bottom nav */
.bnav { display: none; }
.mcards { display: none; }

/* ---------- Responsive ---------- */
@media (max-width: 1180px) {
  .brand { justify-content: center; padding: 16px 8px; }
  .brand-text, .nav-group, .nav .lbl-t, .side-foot .hide-rail { display: none; }
  .nav :is(button,a) { justify-content: center; padding: 11px 0; }
  .nav .badge { position: absolute; top: 3px; right: 6px; margin: 0; }
  .side-foot { padding: 12px 8px; text-align: center; }
  .grid-2 { grid-template-columns: 1fr; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }

}
@media (max-width: 760px) {

  .content { padding: 16px 16px calc(92px + env(safe-area-inset-bottom, 0px)); gap: 16px; }
  .page-title h1 { font-size: 1.2rem; }
  .controls { width: 100%; }
  .controls .seg { flex: 1; }
  .controls .seg button { flex: 1; justify-content: center; padding: 0 6px; }
  .hide-sm { display: none !important; }
  .kpi { padding: 14px 14px 15px; }

  .card-h, .card-b, .toolbar { padding-left: 14px; padding-right: 14px; }
  .subtabs { padding: 0 8px; }
  .grid-2e { grid-template-columns: 1fr; }
  .steps { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .step:nth-child(2) { border-right: 0; }
  .step:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
  .desk-only { display: none !important; }
  .mcards { display: flex; flex-direction: column; }
  .mcard { padding: 12px 14px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
  .mcard:first-child { border-top: 0; }
  .mcard .t { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 600; }
  .mcard .s { display: grid; grid-template-columns: repeat(3, 1fr); font-size: 11.5px; color: var(--muted); }
  .mcard .s b { display: block; font: 600 13px var(--mono); color: var(--text); }
  .bnav { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--nav-bg); padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px)); }
  .bnav :is(button,a) { all: unset; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10.5px; color: var(--nav-text); padding: 4px 0; cursor: pointer; position: relative; }
  .bnav :is(button,a).active { color: #fff; }
  .bnav :is(button,a).active svg { color: var(--brass); }
  .bnav svg { width: 20px; height: 20px; }
  .toast { left: 16px; right: 16px; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
  .glossary { grid-template-columns: 1fr; gap: 2px; }
  .glossary dd { margin-bottom: 8px; }
}
@media (min-width: 761px) { .mob-only { display: none !important; } }

/* ---------- Print (A4 landscape report) ---------- */
.print-head { display: none; }
@page { size: A4 landscape; margin: 10mm; }
@media print {
  :root { --bg: #fff; --surface: #fff; --surface-2: #F4F6F9; --text: #000; --shadow: none; color-scheme: light; }
  body { background: #fff; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .app { display: block; }
  .side, .topbar, .bnav, .no-print, .toast, .btn, .toolbar, .subtabs, .steps { display: none !important; }
  .content { padding: 0; max-width: none; }
  .print-head { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2px solid #0E2240; padding-bottom: 8px; margin-bottom: 12px; }
  .card, .kpis { box-shadow: none; break-inside: avoid; }
  .tbl-wrap { overflow: visible; }
  .tbl th { position: static; }
  .gantt { min-width: 0; }
  .desk-only { display: block !important; } table.desk-only { display: table !important; }
  .mcards { display: none !important; }
}
#printArea { display: none; }
@media print {
  body.print-report #view { display: none !important; }
  body.print-report #printArea { display: block; }
  body.print-report .kpis { grid-template-columns: repeat(4, 1fr); }
  body.print-report .tbl { font-size: 10.5px; }
  body.print-report .tbl td, body.print-report .tbl th { padding: 4px 6px; }
}

.meter i.fill-ok { background: var(--ok); } .meter i.fill-tight { background: var(--tight); } .meter i.fill-sunday { background: var(--warn); } .meter i.fill-critical { background: var(--crit); }
.col-stack { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.grid-side { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start; }
.tbl td.stick b, .nowrap { white-space: nowrap; }
.mrow { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.mrow .cell-inp { flex: 1 1 120px; }
@media (max-width: 1180px) { .grid-side { grid-template-columns: 1fr; } }
@media (max-width: 760px) {
  .controls .period { flex: 1 1 100%; justify-content: space-between; }
  .controls .period select { flex: 1; }
  .controls .seg { flex: 1 1 auto; }
  .controls > .btn { flex: none; }
}

/* ---------- Sign-in gate (cloud mode) ---------- */
.gate { position: fixed; inset: 0; z-index: 80; background: var(--nav-bg); display: grid; place-items: center; padding: 16px; overflow-y: auto;
  background-image: radial-gradient(circle at 20% 10%, rgba(168,132,74,.18), transparent 40%), linear-gradient(160deg, #0E2240, #08101C); }
body.gated .app, body.gated .bnav { visibility: hidden; }
.gate-card { width: min(420px, 100%); background: var(--surface); border-radius: 14px; padding: 28px 28px 22px; box-shadow: 0 30px 80px rgba(0,0,0,.35); display: flex; flex-direction: column; gap: 14px; border-top: 4px solid var(--brass); }
.gate-brand { display: flex; gap: 12px; align-items: center; }
.gate-brand .logo { border-color: var(--line); }
.gate-co { font: 600 15px/1.25 var(--serif); color: var(--ink); }
.gate-card h1 { font-size: 1.5rem; margin-top: 6px; }
.gate-form { display: flex; flex-direction: column; gap: 12px; }
.gate-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.gate-foot { text-align: center; border-top: 1px solid var(--line); padding-top: 12px; margin-top: 4px; }
.role-chip { display: inline-block; font: 600 10px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; padding: 3px 6px; border-radius: 4px; background: rgba(201,169,110,.2); color: #E3C48C; margin-left: 4px; }
.me-line { color: #C9D3E3; font-size: 11.5px; margin-bottom: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.readonly-banner { margin-bottom: 0; }
[data-locked] { opacity: .75; cursor: not-allowed; }
input[data-locked], select[data-locked], textarea[data-locked] { background: var(--surface-2) !important; }
.pwd-box { display: flex; gap: 8px; }
.pwd-box .inp { font-family: var(--mono); }
.cred { font: 13px/1.7 var(--mono); background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; white-space: pre-wrap; word-break: break-all; }

/* ---------- account, sign out, password eye ---------- */
.side-out { all: unset; box-sizing: border-box; cursor: pointer; display: flex; align-items: center; gap: 9px; width: 100%; padding: 8px 10px; margin: 6px 0 10px; border-radius: 7px; border: 1px solid rgba(255,255,255,.14); color: #E3E9F2; font-size: 12.5px; }
.side-out:hover { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.3); }
.side-out:focus-visible { outline: 2px solid var(--brass); }
.side-out svg { width: 16px; height: 16px; }
@media (max-width: 1180px) { .side-out { justify-content: center; padding: 9px 0; } }
.acct { all: unset; box-sizing: border-box; cursor: pointer; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--brass); color: #fff; font: 600 12px/1 var(--sans); letter-spacing: .03em; flex: none; }
.acct:hover { filter: brightness(1.08); }
.acct:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.pw-wrap { position: relative; }
.pw-wrap .inp { padding-right: 42px; }
.pw-wrap .eye { all: unset; cursor: pointer; position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 32px; height: 30px; display: grid; place-items: center; color: var(--muted); border-radius: 6px; }
.pw-wrap .eye:hover { color: var(--text); background: var(--surface-2); }
.pw-wrap .eye:focus-visible { outline: 2px solid var(--focus); }
.pw-wrap .eye svg { width: 18px; height: 18px; }
.inp.otp { font: 600 20px/1 var(--mono); letter-spacing: .35em; text-align: center; height: 46px; }
.acct-card { display: flex; gap: 12px; align-items: center; padding: 4px 0 8px; }
.acct-card .acct { width: 44px; height: 44px; font-size: 15px; cursor: default; }
.conn-details { border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; }
.conn-details summary { cursor: pointer; font-weight: 600; font-size: 13px; }

/* ---------- deployment guide ---------- */
.dstep .dnum { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--brass); color: var(--brass); display: grid; place-items: center; font: 600 13px var(--mono); flex: none; margin-top: 2px; }
.dstep.done .dnum { background: var(--brass); color: #fff; }
.dstep.done { border-color: color-mix(in srgb, var(--ok) 35%, var(--line)); }
.dbody { max-width: none; }
.dbody ol, .dbody ul { padding-left: 20px; }
.dbody li { margin: 4px 0; }
.dbody a { color: var(--focus); font-weight: 500; }
.codebox { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin: 8px 0 10px; }
.codebar { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 8px 6px 12px; background: var(--surface-2); border-bottom: 1px solid var(--line); font: 600 11.5px var(--mono); color: var(--muted); flex-wrap: wrap; }
.codebox pre { margin: 0; padding: 12px; max-height: 260px; overflow: auto; font: 11.5px/1.5 var(--mono); background: var(--surface); color: var(--text); white-space: pre; }

/* ---------- New screens ---------- */
.fl-card { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; background: var(--surface); }
.fl-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 14px; }
.fl-meta { margin: 4px 0 8px; line-height: 1.5; }
.fl-row { display: flex; align-items: stretch; flex-wrap: wrap; gap: 4px; }
.fl-chip { display: inline-flex; flex-direction: column; gap: 2px; padding: 6px 10px; border-radius: 8px; font-size: 12px; border: 1px solid var(--line-strong); background: var(--surface-2); min-width: 108px; max-width: 190px; }
.fl-chip b { font-size: 12.5px; } .fl-chip span { font-size: 11px; opacity: .85; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fl-chip.ok { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); } .fl-chip.tight { background: var(--tight-bg); border-color: var(--tight); color: var(--tight); }
.fl-chip.critical { background: var(--crit-bg); border-color: var(--crit); color: var(--crit); } .fl-chip.gap { background: transparent; border: 1px dashed var(--crit); color: var(--crit); }
.fl-chip.idle { background: var(--idle-bg); color: var(--idle); border-color: var(--line); }
.fl-arrow { align-self: center; color: var(--muted); font-size: 20px; line-height: 1; }
.fl-legend { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; } .fl-legend .fl-chip { min-width: 0; padding: 2px 9px; flex-direction: row; }
.ap-list { margin: 0; padding-left: 22px; } .ap-list li { margin: 0 0 14px; line-height: 1.5; } .ok-t { color: var(--ok); }
.pm-grid { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 16px; align-items: start; }
.pm-items { max-height: 640px; overflow: auto; } .pm-item { display: grid; grid-template-columns: 1fr auto; gap: 0 8px; padding: 9px 16px; border-top: 1px solid var(--line); text-decoration: none; color: inherit; font-size: 13px; }
.pm-item span { grid-column: 1; color: var(--muted); font-size: 12px; } .pm-item em { grid-row: 1 / span 2; grid-column: 2; align-self: center; font-style: normal; font-size: 11px; color: var(--muted); } .pm-item.on { background: var(--surface-2); box-shadow: inset 3px 0 0 var(--brass, #c9962b); } .pm-item:hover { background: var(--surface-2); }
.pm-top { display: grid; grid-template-columns: 220px 1fr; gap: 14px; margin-bottom: 14px; }
.pm-step { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; background: var(--surface); }
.pm-sh { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; } .pm-sh .inp { flex: 1 1 220px; min-width: 160px; } .pm-n { width: 26px; height: 26px; border-radius: 50%; background: var(--ink, #0e2240); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex: none; }
.pm-ms { padding: 8px 0 2px 34px; } .pm-mh, .pm-m { display: grid; grid-template-columns: minmax(150px, 1fr) 190px 40px; gap: 8px; margin-bottom: 6px; align-items: center; }
@media (max-width: 960px) { .pm-grid { grid-template-columns: 1fr; } .pm-top { grid-template-columns: 1fr; } .vd-grid { grid-template-columns: 1fr !important; } .pm-ms { padding-left: 0; } }
/* ---------- Quick Workout ---------- */
.qw-in { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px 16px; align-items: start; }
.qw-f { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.qw-f > span { font-size: 12px; font-weight: 600; }
.qw-f small { font-size: 11.5px; color: var(--muted); line-height: 1.3; }
.qw-f .cell-inp { width: 100%; box-sizing: border-box; text-align: left; }
.qw-chk { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; line-height: 1.45; cursor: pointer; }
.qw-chk input { margin-top: 3px; width: 17px; height: 17px; flex: none; }
.qw-fix td { background: var(--surface-2); font-size: 12.5px; padding-top: 8px; padding-bottom: 10px; }
.qw-fixin { position: sticky; left: 0; width: min(100%, calc(100vw - 380px)); white-space: normal; }
.qw-opt { display: inline-block; margin: 3px 4px 0 0; padding: 2px 9px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line-strong); font-weight: 600; }
.qw-m { display: grid; grid-template-columns: 110px 1fr 46px 110px; gap: 10px; align-items: center; padding: 3px 0; font-size: 12.5px; }
.qw-ml { max-height: 420px; overflow: auto; }
.nav-more { margin: 10px 12px 0; padding: 8px 10px; border: 1px dashed var(--line-strong); background: transparent; color: var(--muted); border-radius: 8px; font: inherit; font-size: 12px; cursor: pointer; text-align: left; width: calc(100% - 24px); }
.nav-more:hover { color: var(--text); border-style: solid; }
@media (max-width: 760px) { .qw-m { grid-template-columns: 84px 1fr 40px; } .qw-m .small { display: none; } }

window.DEPLOY_ASSETS = {"sql": "-- =====================================================================\n--  Capacity Planner \u2014 Supabase (free plan) database setup  \u00b7 v4.1\n--  Multi-user access with roles:  admin \u00b7 editor \u00b7 viewer\n--\n--  HOW TO RUN: Supabase dashboard \u203a SQL Editor \u203a New query \u203a paste ALL of\n--  this file \u203a change the e-mail on the LAST line to your own \u203a Run.\n--  Safe to run again (it only adds what is missing).\n-- =====================================================================\n\n-- 1. Shared plan: one row per workspace (plant). The whole plan is one JSON document.\ncreate table if not exists public.workspaces (\n  id          text primary key,\n  data        jsonb not null,\n  updated_at  timestamptz not null default now(),\n  updated_by  text\n);\n\n-- 2. Users who may open the planner, and their role\ncreate table if not exists public.members (\n  email        text primary key check (email = lower(email)),\n  role         text not null default 'viewer' check (role in ('admin', 'editor', 'viewer')),\n  display_name text,\n  created_at   timestamptz not null default now(),\n  created_by   text\n);\n-- upgrade from the first version of this script ('planner' role)\nalter table public.members drop constraint if exists members_role_check;\nupdate public.members set role = 'editor' where role = 'planner';\nalter table public.members add constraint members_role_check check (role in ('admin', 'editor', 'viewer'));\nalter table public.members add column if not exists display_name text;\nalter table public.members add column if not exists created_at timestamptz not null default now();\nalter table public.members add column if not exists created_by text;\n\n-- 3. Every save is kept here (audit trail + restore)\ncreate table if not exists public.workspace_history (\n  id           bigserial primary key,\n  workspace_id text,\n  data         jsonb,\n  saved_at     timestamptz default now(),\n  saved_by     text\n);\n\n-- 4. Helper: the signed-in user's role (null = no access)\ncreate or replace function public.my_role() returns text\nlanguage sql stable security definer set search_path = public as $$\n  select role from public.members where email = lower(auth.jwt() ->> 'email')\n$$;\ngrant execute on function public.my_role() to authenticated;\n\n-- 5. Timestamps and history\ncreate or replace function public.touch_updated_at() returns trigger\nlanguage plpgsql as $$ begin new.updated_at := now(); return new; end $$;\ndrop trigger if exists trg_touch on public.workspaces;\ncreate trigger trg_touch before insert or update on public.workspaces\nfor each row execute function public.touch_updated_at();\n\ncreate or replace function public.keep_history() returns trigger\nlanguage plpgsql security definer set search_path = public as $$\nbegin\n  insert into public.workspace_history(workspace_id, data, saved_by) values (old.id, old.data, old.updated_by);\n  -- keep the latest 300 versions per workspace\n  delete from public.workspace_history\n   where workspace_id = old.id\n     and id not in (select id from public.workspace_history where workspace_id = old.id order by id desc limit 300);\n  return new;\nend $$;\ndrop trigger if exists trg_history on public.workspaces;\ncreate trigger trg_history before update on public.workspaces\nfor each row execute function public.keep_history();\n\n-- 6. Never allow the last admin to be removed or demoted\ncreate or replace function public.protect_last_admin() returns trigger\nlanguage plpgsql as $$\nbegin\n  if (tg_op = 'DELETE' and old.role = 'admin') or (tg_op = 'UPDATE' and old.role = 'admin' and new.role <> 'admin') then\n    if (select count(*) from public.members where role = 'admin' and email <> old.email) = 0 then\n      raise exception 'At least one admin must remain.';\n    end if;\n  end if;\n  return coalesce(new, old);\nend $$;\ndrop trigger if exists trg_last_admin on public.members;\ncreate trigger trg_last_admin before update or delete on public.members\nfor each row execute function public.protect_last_admin();\n\n-- 7. Row Level Security \u2014 the database itself enforces the roles\nalter table public.workspaces        enable row level security;\nalter table public.members           enable row level security;\nalter table public.workspace_history enable row level security;\n\ndrop policy if exists ws_read   on public.workspaces;\ndrop policy if exists ws_write  on public.workspaces;\ndrop policy if exists ws_update on public.workspaces;\ndrop policy if exists mem_self  on public.members;\ndrop policy if exists mem_read  on public.members;\ndrop policy if exists hist_read on public.workspace_history;\n\n-- anyone listed (admin, editor, viewer) can read the plan\ncreate policy ws_read on public.workspaces for select to authenticated\n  using (public.my_role() is not null);\n-- only admins and editors can save\ncreate policy ws_write on public.workspaces for insert to authenticated\n  with check (public.my_role() in ('admin', 'editor'));\ncreate policy ws_update on public.workspaces for update to authenticated\n  using (public.my_role() in ('admin', 'editor'))\n  with check (public.my_role() in ('admin', 'editor'));\n-- a user sees their own membership; admins see everyone\ncreate policy mem_read on public.members for select to authenticated\n  using (email = lower(auth.jwt() ->> 'email') or public.my_role() = 'admin');\n-- only admins can read the version history\ncreate policy hist_read on public.workspace_history for select to authenticated\n  using (public.my_role() = 'admin');\n-- (members are added / changed only through the \"admin-users\" Edge Function)\n\n-- 8. FIRST ADMIN \u2014 change this e-mail to your own, then Run\ninsert into public.members(email, role, display_name, created_by)\nvalues (lower('admin@yourcompany.com'), 'admin', 'Administrator', 'setup')\non conflict (email) do update set role = 'admin';\n", "fn": "// FILE: admin-users-function.txt  (TypeScript code for the Supabase Edge Function \"admin-users\" \u2014 copy ALL of it into the Supabase editor)\n// =====================================================================\n//  Capacity Planner \u2014 \"admin-users\" Supabase Edge Function  \u00b7 v4.1\n//  Lets an ADMIN add users, change roles, reset passwords and remove users\n//  from inside the planner. No e-mail service is needed.\n//\n//  Deploy: Supabase dashboard \u203a Edge Functions \u203a Deploy a new function \u203a\n//          Via Editor \u203a name it exactly  admin-users  \u203a replace all code\n//          with this file \u203a Deploy function.\n// =====================================================================\n\nconst CORS = {\n  'Access-Control-Allow-Origin': '*',\n  'Access-Control-Allow-Headers': 'authorization, x-client-info, apikey, content-type',\n  'Access-Control-Allow-Methods': 'POST, OPTIONS',\n};\nconst BASE = Deno.env.get('SUPABASE_URL') ?? '';\n\n// Service key: legacy service_role JWT if present, otherwise the new secret key\nfunction serviceKey(): string {\n  const legacy = Deno.env.get('SUPABASE_SERVICE_ROLE_KEY');\n  if (legacy) return legacy;\n  try {\n    const keys = JSON.parse(Deno.env.get('SUPABASE_SECRET_KEYS') ?? '{}');\n    return keys.default ?? Object.values(keys)[0] ?? '';\n  } catch { return ''; }\n}\nconst SK = serviceKey();\nconst svcHeaders = (extra: Record<string, string> = {}) => {\n  const h: Record<string, string> = { apikey: SK, 'Content-Type': 'application/json', ...extra };\n  if (SK.split('.').length === 3) h.Authorization = `Bearer ${SK}`;   // legacy JWT key\n  return h;\n};\n\nconst json = (body: unknown, status = 200) =>\n  new Response(JSON.stringify(body), { status, headers: { ...CORS, 'Content-Type': 'application/json' } });\nclass Fail extends Error { constructor(msg: string, public status = 400) { super(msg); } }\n\nasync function call(path: string, init: RequestInit = {}) {\n  const res = await fetch(BASE + path, { ...init, headers: svcHeaders((init.headers ?? {}) as Record<string, string>) });\n  const txt = await res.text();\n  let body: any = null; try { body = txt ? JSON.parse(txt) : null; } catch { body = txt; }\n  if (!res.ok) throw new Fail(body?.msg ?? body?.message ?? body?.error_description ?? body?.error ?? `Error ${res.status}`, res.status >= 500 ? 500 : 400);\n  return body;\n}\nasync function allAuthUsers(): Promise<any[]> {\n  const out: any[] = [];\n  for (let page = 1; page < 50; page++) {\n    const b = await call(`/auth/v1/admin/users?page=${page}&per_page=200`);\n    const list = b?.users ?? [];\n    out.push(...list);\n    if (list.length < 200) break;\n  }\n  return out;\n}\nconst ROLES = ['admin', 'editor', 'viewer'];\nconst clean = (e: unknown) => String(e ?? '').trim().toLowerCase();\n\nDeno.serve(async (req) => {\n  if (req.method === 'OPTIONS') return new Response('ok', { headers: CORS });\n  try {\n    if (!BASE || !SK) throw new Fail('Function is missing its Supabase keys.', 500);\n\n    // 1. Who is calling? (verify their session with Supabase Auth)\n    const me = await fetch(`${BASE}/auth/v1/user`, {\n      headers: { apikey: req.headers.get('apikey') ?? SK, Authorization: req.headers.get('Authorization') ?? '' },\n    });\n    if (!me.ok) throw new Fail('Please sign in again.', 401);\n    const caller = clean((await me.json()).email);\n\n    // 2. Only admins may continue\n    const mine = await call(`/rest/v1/members?email=eq.${encodeURIComponent(caller)}&select=role`);\n    if (mine?.[0]?.role !== 'admin') throw new Fail('Only an admin can manage users.', 403);\n\n    const body = await req.json().catch(() => ({}));\n    const action = body.action;\n\n    if (action === 'list') {\n      const [members, users] = await Promise.all([call('/rest/v1/members?select=*&order=email'), allAuthUsers()]);\n      const byEmail = new Map(users.map((u: any) => [clean(u.email), u]));\n      return json({\n        users: members.map((m: any) => {\n          const u: any = byEmail.get(m.email);\n          return { email: m.email, role: m.role, name: m.display_name, createdAt: m.created_at, createdBy: m.created_by,\n                   hasLogin: Boolean(u), lastSignIn: u?.last_sign_in_at ?? null };\n        }),\n      });\n    }\n\n    const email = clean(body.email);\n    if (!/^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$/.test(email)) throw new Fail('Enter a valid e-mail address.');\n\n    if (action === 'create') {\n      const role = ROLES.includes(body.role) ? body.role : 'viewer';\n      if (!body.password || String(body.password).length < 8) throw new Fail('The password must have at least 8 characters.');\n      const users = await allAuthUsers();\n      const existing = users.find((u: any) => clean(u.email) === email);\n      if (existing) {\n        await call(`/auth/v1/admin/users/${existing.id}`, { method: 'PUT', body: JSON.stringify({ password: body.password, email_confirm: true }) });\n      } else {\n        await call('/auth/v1/admin/users', { method: 'POST', body: JSON.stringify({ email, password: body.password, email_confirm: true, user_metadata: { name: body.name ?? '' } }) });\n      }\n      await call('/rest/v1/members?on_conflict=email', {\n        method: 'POST', headers: { Prefer: 'resolution=merge-duplicates' },\n        body: JSON.stringify({ email, role, display_name: body.name ?? null, created_by: caller }),\n      });\n      return json({ ok: true });\n    }\n\n    if (action === 'setRole') {\n      if (!ROLES.includes(body.role)) throw new Fail('Unknown role.');\n      await call(`/rest/v1/members?email=eq.${encodeURIComponent(email)}`, { method: 'PATCH', body: JSON.stringify({ role: body.role, ...(body.name !== undefined ? { display_name: body.name } : {}) }) });\n      return json({ ok: true });\n    }\n\n    if (action === 'resetPassword') {\n      if (!body.password || String(body.password).length < 8) throw new Fail('The password must have at least 8 characters.');\n      const u = (await allAuthUsers()).find((x: any) => clean(x.email) === email);\n      if (!u) throw new Fail('This user has no login yet.');\n      await call(`/auth/v1/admin/users/${u.id}`, { method: 'PUT', body: JSON.stringify({ password: body.password }) });\n      return json({ ok: true });\n    }\n\n    if (action === 'remove') {\n      if (email === caller) throw new Fail('You cannot remove yourself.');\n      await call(`/rest/v1/members?email=eq.${encodeURIComponent(email)}`, { method: 'DELETE' });   // last-admin guard runs in the database\n      const u = (await allAuthUsers()).find((x: any) => clean(x.email) === email);\n      if (u) await call(`/auth/v1/admin/users/${u.id}`, { method: 'DELETE' });\n      return json({ ok: true });\n    }\n\n    throw new Fail('Unknown action.');\n  } catch (e) {\n    const status = e instanceof Fail ? e.status : 500;\n    return json({ error: (e as Error).message }, status);\n  }\n});\n"};

/* ==========================================================================
   CAPACITY ENGINE  —  pure functions, no DOM.  Mirrors capacity.xlsx exactly:
     PPH            = (3600 / CycleTime) × OEE            (Capacity-workout!G)
     Req. Hours     = MonthPlan / PPH                      (Capacity-workout!J)
     Req. Days      = Req. Hours / Hours per Day           (Capacity-workout!K)
     Machine Req.   = Σ Req. Days by Machine               (Pivot → Capacity Plan!C)
     Balance        = Available Days − Required Days       (Capacity Plan!D)
     Status         = Balance > 0 ? within : Overload      (Capacity Plan!E)
   Adds on top: calendar-aware Sundays/holidays, per-machine availability,
   takt time vs due date, finite EDD schedule with routing precedence,
   and a generic (data-driven) load-levelling algorithm.
   ========================================================================== */
(function (root) {
  'use strict';

  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const pad = n => String(n).padStart(2, '0');
  const periodKey = (y, m) => `${y}-${pad(m + 1)}`;
  const iso = (y, m, d) => `${y}-${pad(m + 1)}-${pad(d)}`;
  const daysInMonth = (y, m) => new Date(y, m + 1, 0).getDate();

  /* ---------- Calendar ---------------------------------------------------- */
  function buildCalendar(y, m, settings, includeOffDays) {
    const n = daysInMonth(y, m);
    const off = new Set(settings.weeklyOff || [0]);
    const hol = new Set(settings.holidays || []);
    const days = [];
    for (let d = 1; d <= n; d++) {
      const dow = new Date(y, m, d).getDay();
      const date = iso(y, m, d);
      const isOff = off.has(dow);
      const isHol = hol.has(date);
      days.push({ d, date, dow, isOff, isHol, working: !isOff && !isHol });
    }
    const working = days.filter(x => x.working);
    const offDays = days.filter(x => x.isOff && !x.isHol);           // Sundays that could be worked
    const schedulable = includeOffDays ? days.filter(x => !x.isHol) : working;
    return { y, m, n, days, working, offDays, schedulable };
  }

  /* ---------- Helpers ------------------------------------------------------ */
  function cellOf(code) {
    // "AR Engineering-2" -> "AR Engineering"; "TN Engineering" -> "TN Engineering"
    return String(code).replace(/[-\s]*\d+$/, '').trim() || code;
  }

  function getPlan(state, key) {
    return (state.plans && state.plans[key]) || { parts: {}, machines: {}, splits: {} };
  }

  /* ---------- Dynamic capacity: net the stock off the sales quantity, stage by stage -------------------
     Walking backwards from the customer:   need(after last op) = sales − finished-goods stock
       good parts a process must still make = need after it − stock waiting after it
           (stock after a process = in-house WIP + parts at the supplier + parts in inward inspection, all of that process)
       parts the process must RUN = good parts ÷ (1 − scrap %)   (scrap % is typed by hand per process for now)
       the process before it must supply exactly what this one runs
     What the first process must run is the quantity of parts to start; the Raw Material Planning app will turn that into material.
     Static capacity skips all of this (sales quantity at every operation). */
  function netDemand(state, plan, seqMap, o) {
    o = o || {};
    const out = {};
    const stock = (plan && plan.stock) || {}, scrap = (plan && plan.scrap) || {}, cls = (plan && plan.cls) || {}, minq = (plan && plan.minStock) || {};
    const coverOf = c => Math.max(0, num(plan && (c === 'A' ? (plan.coverA != null ? plan.coverA : plan.cover) : c === 'B' ? plan.coverB : plan.coverC), c === 'A' ? 7 : 0));
    const minOn = !o.noMin && !(plan && plan.minOn === false);
    const dpm = Math.max(1, num(state.settings && state.settings.daysPerMonth, 25));
    const byPart = new Map();
    state.operations.forEach(op => { const l = byPart.get(op.partNo) || []; l.push(op); byPart.set(op.partNo, l); });
    byPart.forEach((ops, partNo) => {
      const sales = Math.max(0, num(((plan.parts || {})[partNo] || {}).qty, 0));
      const st = stock[partNo] || {}, wip = st.wip || {}, sup = st.sup || {}, insp = st.insp || {};
      const fg = Math.max(0, num(st.fg, 0));
      // every class can keep a minimum stock: typed quantity, or (when left 0) sales per working day × the cover days of its class (A runner, B repeater, C stranger)
      const c = cls[partNo] || (state.partClass || {})[partNo] || 'B', isA = c === 'A';
      const minStock = !minOn ? 0 : (num(minq[partNo], 0) > 0 ? Math.round(num(minq[partNo], 0)) : (plan && plan.minZero && plan.minZero[partNo]) ? 0 : Math.ceil(sales / dpm * (num((state.partMinDays || {})[partNo], 0) > 0 ? num(state.partMinDays[partNo], 0) : coverOf(c))));
      let need = Math.max(0, sales + minStock - fg);
      const needAfterFg = need;
      const steps = new Array(ops.length);
      for (let k = ops.length - 1; k >= 0; k--) {
        const id = ops[k].id;
        const w = Math.max(0, num(wip[id], 0)), su = Math.max(0, num(sup[id], 0)), iq = Math.max(0, num(insp[id], 0));
        const stockAfter = w + su + iq;
        const sp = Math.min(99, Math.max(0, num(scrap[id], 0)));
        const good = Math.max(0, need - stockAfter);
        const run = good > 0 ? Math.ceil(good / (1 - sp / 100) - 1e-9) : 0;
        steps[k] = { opId: id, process: ops[k].process, needAfter: need, wip: w, supplier: su, inspection: iq, stockAfter, scrapPct: sp, good, produce: run };
        need = run;
      }
      // Static: no stock netted, but the scrap allowance is still added at every process (from the last process back)
      let sn = sales; const sBy = {};
      for (let k = ops.length - 1; k >= 0; k--) { const sp = Math.min(99, Math.max(0, num(scrap[ops[k].id], 0))); sn = sn > 0 ? Math.ceil(sn / (1 - sp / 100) - 1e-9) : 0; sBy[ops[k].id] = sn; }
      out[partNo] = { sales, fg, isA, cls: c, minStock, staticByOp: sBy, needAfterFg, steps, material: { need }, byOp: Object.fromEntries(steps.map(x => [x.opId, x.produce])) };
    });
    return out;
  }

  /* ---------- Core model --------------------------------------------------- */
  function compute(state, opts) {
    opts = opts || {};
    const s = state.settings;
    const y = state.year, m = state.month;
    const key = periodKey(y, m);
    const plan = getPlan(state, key);
    const scenario = opts.scenario || state.scenario || 'standard';
    const oee = (s.oee || 80) / 100;
    const cal = buildCalendar(y, m, s, scenario === 'sunday');
    const sundaysAvailable = cal.offDays.length;
    const monthEnd = iso(y, m, cal.n);

    // Machines with period overrides
    const machines = state.machines.filter(x => x.active !== false).map(mc => {
      const ov = (plan.machines && plan.machines[mc.code]) || {};
      const baseDays = num(ov.availDays, num(mc.availDays, s.daysPerMonth));
      const extraDays = scenario === 'sunday' ? sundaysAvailable : 0;
      return {
        code: mc.code,
        cell: mc.cell || cellOf(mc.code),
        hoursPerDay: num(mc.hoursPerDay, s.hoursPerDay),
        baseDays,
        availDays: baseDays + extraDays,
        remarks: ov.remarks != null ? ov.remarks : (mc.remarks || ''),
        ops: [], reqHours: 0, reqDays: 0
      };
    });
    const mIndex = new Map(machines.map(x => [x.code, x]));

    // Determine operation sequence inside each part (routing order)
    const seqMap = new Map();
    state.operations.forEach(op => {
      const list = seqMap.get(op.partNo) || [];
      list.push(op.id);
      seqMap.set(op.partNo, list);
    });

    // Static: every operation makes the sales quantity. Dynamic: each operation makes only what is still needed after the stock.
    const mode = (opts.mode || state.capMode) === 'dynamic' ? 'dynamic' : 'static';
    const net = netDemand(state, plan, seqMap, { noMin: opts.noMin });

    // Split / reassign overrides: either from plan (applied) or from auto-level preview
    // machines listed for one process share its quantity by speed (auto load balancing) unless the planner typed or applied a split
    const auto = (s.autoShare === false || opts.noAuto) ? {} : workout(state, { ignoreQuick: true, mode }).splits;
    const splits = Object.assign({}, auto, plan.splits || {}, opts.splitsOverride || {});

    // Expand operations to machine allocations
    const rows = [];
    state.operations.forEach(op => {
      const part = (plan.parts && plan.parts[op.partNo]) || {};
      const salesQty = Math.max(0, num(part.qty, 0));
      const qty = mode === 'dynamic' ? (((net[op.partNo] || {}).byOp || {})[op.id] || 0) : (((net[op.partNo] || {}).staticByOp || {})[op.id] ?? salesQty);
      const due = validDue(part.due, y, m) || monthEnd;
      const alloc = splits[op.id] && splits[op.id].length ? splits[op.id] : [{ machine: op.machine, share: 1 }];
      const seqList = seqMap.get(op.partNo);
      alloc.forEach((a, idx) => {
        const mc = mIndex.get(a.machine);
        const ctm = num((op.altCt || {})[a.machine], 0) || op.cycleTime, pph = ctm > 0 ? (3600 / ctm) * oee : 0;
        const hrs = mc ? mc.hoursPerDay : s.hoursPerDay;
        const q = alloc.length === 1 ? qty : Math.round(qty * a.share);
        const reqHours = pph > 0 ? q / pph : 0;
        const reqDays = hrs > 0 ? reqHours / hrs : 0;
        const row = {
          key: `${op.id}:${idx}`,
          opId: op.id, partNo: op.partNo, partName: op.partName, process: op.process,
          seq: seqList.indexOf(op.id), homeMachine: op.machine, machine: a.machine,
          moved: a.machine !== op.machine, split: alloc.length > 1,
          cycleTime: ctm, qty: q, partQty: salesQty, due,
          pph, effCT: oee > 0 ? ctm / oee : ctm,
          hoursPerDay: hrs, reqHours, reqDays,
          rowBalance: s.daysPerMonth - reqDays     // Excel Capacity-workout!L
        };
        rows.push(row);
        if (mc) { mc.ops.push(row); mc.reqHours += reqHours; mc.reqDays += reqDays; }
      });
    });

    // Status per machine
    const warnPct = num(s.warnPct, 90);
    machines.forEach(mc => {
      mc.balDays = mc.availDays - mc.reqDays;
      mc.util = mc.availDays > 0 ? (mc.reqDays / mc.availDays) * 100 : (mc.reqDays > 0 ? 999 : 0);
      mc.excelStatus = mc.balDays > 0 ? 'No Load' : 'Overload';   // literal Excel formula result
      if (mc.reqDays === 0) mc.tier = 'idle';
      else if (mc.balDays > 0 && mc.util < warnPct) mc.tier = 'ok';
      else if (mc.balDays > 0) mc.tier = 'tight';
      else if (scenario !== 'sunday' && mc.reqDays <= mc.availDays + sundaysAvailable) mc.tier = 'sunday';
      else mc.tier = 'critical';
      mc.overloadHours = Math.max(0, -mc.balDays) * mc.hoursPerDay;
    });

    // Takt per row: time available until due date on the working calendar
    const workUpTo = date => cal.schedulable.filter(x => x.date <= date).length;
    rows.forEach(r => {
      const days = Math.max(0, workUpTo(r.due));
      const hrs = r.hoursPerDay;
      r.windowDays = days;
      r.windowSec = days * hrs * 3600;
      // Takt = time available up to the due date ÷ quantity this machine must make
      r.taktSec = r.qty > 0 ? r.windowSec / r.qty : 0;
      r.meetsTakt = r.qty === 0 || (r.taktSec > 0 && r.effCT <= r.taktSec);
    });

    const schedule = scheduleRows(rows, machines, cal, s);

    // Totals
    const active = rows.filter(r => r.qty > 0);
    const totals = {
      avail: sum(machines, 'availDays'),
      req: sum(machines, 'reqDays'),
      reqHours: sum(machines, 'reqHours'),
      qtyParts: Object.values(plan.parts || {}).reduce((a, p) => a + Math.max(0, num(p.qty, 0)), 0),
      activeOps: active.length,
      lateOps: active.filter(r => r.late).length,
      taktFail: active.filter(r => !r.meetsTakt).length,
      counts: countBy(machines, 'tier')
    };
    totals.bal = totals.avail - totals.req;
    totals.util = totals.avail > 0 ? totals.req / totals.avail * 100 : 0;

    totals.netQty = mode === 'dynamic' ? Object.values(net).reduce((a, p) => a + p.steps.reduce((x, st) => x + st.produce, 0), 0) : null;
    const lagHint = num(s.transferLagHours, 2) / Math.max(1, s.hoursPerDay);
    return { key, plan, scenario, mode, net, lagDaysHint: lagHint, cal, sundaysAvailable, machines, rows, schedule, totals, monthEnd };
  }

  /* ---------- Finite schedule: EDD + routing precedence --------------------- */
  function scheduleRows(rows, machines, cal, s) {
    const lagDays = num(s.transferLagHours, 2) / Math.max(1, s.hoursPerDay);
    const cursor = new Map(machines.map(m => [m.code, 0]));   // machine membership
    const byOp = new Map();   // opId -> {start, end} (min start / max end across split allocations)
    const active = rows.filter(r => r.qty > 0 && cursor.has(r.machine));
    active.sort((a, b) => (a.due < b.due ? -1 : a.due > b.due ? 1 : 0) || a.partNo.localeCompare(b.partNo) || a.seq - b.seq);

    const partOps = new Map();
    rows.forEach(r => { const l = partOps.get(r.partNo) || []; if (!l.includes(r.opId)) l.push(r.opId); partOps.set(r.partNo, l); });

    const busy = new Map(machines.map(m => [m.code, []]));   // busy intervals per machine
    // Fill free time on the machine from `t`, splitting the run around booked work if needed
    const MIN_GAP = 0.1;                       // ignore gaps shorter than ~2 h
    const fill = (ivs, t, dur) => {
      const pieces = []; let left = dur;
      for (const iv of ivs) {                  // ivs sorted by start
        if (left <= 1e-9) break;
        if (iv.end <= t + 1e-9) continue;
        if (iv.start > t + 1e-9) {
          const gap = iv.start - t;
          if (gap >= Math.min(MIN_GAP, left) - 1e-9) { const take = Math.min(gap, left); pieces.push({ start: t, end: t + take }); left -= take; }
        }
        t = Math.max(t, iv.end);
      }
      if (left > 1e-9) pieces.push({ start: t, end: t + left });
      return pieces;
    };
    active.forEach(r => {

       2 DELIVERY (throughput) – does every part come out of its last operation before the customer's date?

function defaultState() { return clone(window.SEED_DATA); }

/* An alternate machine may carry its own cycle time:  "EPI-B-80=65, EPI-B-05"  (no "=" means the same cycle time as the first machine) */
function parseAlts(o) {
  const ct = Object.assign({}, o.altCt || {}), codes = [];
  (Array.isArray(o.alternates) ? o.alternates : String(o.alternates || '').split(',')).forEach(a => {
    const m = String(a).split('='), c = m[0].trim(); if (!c) return;
    if (m[1] !== undefined && Number(m[1]) > 0) ct[c] = Number(m[1]); codes.push(c);
  });
  o.alternates = codes; o.altCt = ct; return o;
}
function normalise(s) {
  s.settings = Object.assign(clone(window.SEED_DATA.settings), s.settings || {});
  s.machines = (s.machines || []).map(m => Object.assign({ cell: E.cellOf(m.code), availDays: null, hoursPerDay: null, remarks: '', active: true }, m));
  s.operations = (s.operations || []).map(o => parseAlts(Object.assign({ alternates: [] }, o, { cycleTime: Number(o.cycleTime) || 0 })));
  s.plans = s.plans || {};
  if (typeof s.month !== 'number') s.month = new Date().getMonth();
  if (typeof s.year !== 'number') s.year = new Date().getFullYear();
  s.scenario = s.scenario || 'standard';
  s.version = 4;
  return s;
}

// Converts JSON files from the earlier v3 planner to this format
function convertV3(d) {
  const clean = x => String(x || '').replace(/ /g, ' ').replace(/\s+/g, ' ').trim();
  const y = d.year || new Date().getFullYear(), m = typeof d.month === 'number' ? d.month : new Date().getMonth();
  const key = E.periodKey(y, m), last = E.daysInMonth(y, m);
  const b = d.branding || {};
  const s = {
    version: 4, year: y, month: m, scenario: 'standard',
    settings: Object.assign(clone(window.SEED_DATA.settings), { companyName: b.companyName || 'Company', subtitle: b.subtitle || '', logo: b.logo || '', oee: b.oee || 80, hoursPerDay: b.hoursPerDay || 22, daysPerMonth: b.daysPerMonth || 25 }),
    machines: (d.machines || []).map(x => ({ code: x.machine, cell: E.cellOf(x.machine), availDays: null, hoursPerDay: null, remarks: '', active: true })),
    operations: (d.operations || []).map(o => ({ id: o.id, partNo: clean(o.partNo), partName: clean(o.partName), process: clean(o.process), machine: o.machine, cycleTime: Number(o.cycleTime) || 0, alternates: [] })),
    plans: {}
  };
  const parts = {};
  (d.operations || []).forEach(o => { if (!parts[o.partNo]) parts[o.partNo] = { qty: Number(o.monthPlan) || 0, due: E.iso(y, m, Math.min(last, o.dueDay || last)) }; });
  const machines = {};
  (d.machines || []).forEach(x => machines[x.machine] = { availDays: x.availDays, remarks: x.remarks || '' });
  s.plans[key] = { parts, machines, splits: {} };
  Object.entries(d.periodPlans || {}).forEach(([k, snap]) => {
    if (k === key) return;
    const [yy, mm] = k.split('-').map(Number), ld = E.daysInMonth(yy, mm - 1), pp = {};
    (d.operations || []).forEach(o => { const v = snap[o.id]; if (v && !pp[o.partNo]) pp[o.partNo] = { qty: v.qty || 0, due: E.iso(yy, mm - 1, Math.min(ld, v.dueDay || ld)) }; });
    s.plans[k] = { parts: pp, machines: {}, splits: {} };
  });
  return s;
}

function loadLocal() {
  let s = LS.get(K_STATE);
  if (!s) {
    try {   // migrate data saved by the earlier version in this browser
      const ops = JSON.parse(localStorage.getItem('kmr_v3_operations'));
      if (ops && ops.length) s = convertV3({ operations: ops, machines: JSON.parse(localStorage.getItem('kmr_v3_machines')), branding: JSON.parse(localStorage.getItem('kmr_v3_branding')), periodPlans: JSON.parse(localStorage.getItem('kmr_v3_period_plans')) });
    } catch (e) { s = null; }
  }
  if (!s && window.KMR_PLATFORM && (window.CAPACITY_CLOUD_CONFIG || {}).url) return blankState();
  return normalise(s || defaultState());
}

function commit(opts) {
  opts = opts || {};
  LS.set(K_STATE, state);
  if (cloudActive() && can('editor') && sharedHash() !== cloud.savedHash) {
    cloud.dirty = true; clearTimeout(cloud.timer); cloud.timer = setTimeout(cloudSave, 1200); setSync('busy', 'Saving…');
