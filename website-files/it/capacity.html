/* ---------- roles ----------
   Local mode (no cloud): full access on this device.
   Cloud mode: admin > editor > viewer, enforced by the database (RLS) and mirrored in the UI. */
const ROLE_RANK = { viewer: 1, editor: 2, admin: 3 };
const ROLE_INFO = {
  admin: { label: 'Admin', text: 'Everything an editor can do, plus Settings: users, company name and logo, cloud connection, backups and restoring old versions.' },
  editor: { label: 'Editor', text: 'Enter monthly plans, change available days and remarks, edit machines, routings, plant standards and working calendar, apply load balancing.' },
  viewer: { label: 'Viewer', text: 'Sees every screen and can export Excel/PDF. Cannot change anything.' }
};
function cloudActive() { return Cloud.configured() && Cloud.signedIn() && Boolean(cloud.role); }
function can(level) { if (!cloudActive()) return true; return (ROLE_RANK[cloud.role] || 0) >= ROLE_RANK[level]; }
function roleLabel() { return cloud.role ? ROLE_INFO[cloud.role].label : ''; }

// Month, year and scenario are personal view choices; everything else is the shared plan
function sharedPart(s) { const c = Object.assign({}, s); delete c.year; delete c.month; delete c.scenario; if (typeof cloud !== "undefined" && cloud.ops && cloud.own) { c.machines = cloud.own.machines; c.operations = cloud.own.operations; } return c; }
function sharedHash() { return JSON.stringify(sharedPart(state)); }
function adoptRemote(data) {
  const keep = state ? { year: state.year, month: state.month, scenario: state.scenario } : null;
  state = normalise(data);
  if (keep) Object.assign(state, keep);
  if (typeof cloud !== "undefined" && cloud.ops) { cloud.own = null; applyOpsData(); }
  if (typeof cloud !== "undefined" && cloud.brand) { state.settings.companyName = cloud.brand.name; if (cloud.brand.logo) state.settings.logo = cloud.brand.logo; }
  LS.set(K_STATE, state);
  cloud.savedHash = sharedHash();
}

/* ---------- cloud sync ---------- */
function setSync(status, msg) { cloud.status = status; cloud.msg = msg || ''; const el = $('#syncPill'); if (el) el.innerHTML = syncPillHtml(); }
function syncPillHtml() {
  if (!Cloud.configured()) return `<span class="dot"></span> Saved on this device`;
  if (!Cloud.signedIn()) return `<span class="dot"></span> Cloud: signed out`;
  const map = { on: 'on', busy: 'busy', err: 'err', local: '' };
  return `<span class="dot ${map[cloud.status] || ''}"></span> ${h(cloud.msg || 'Cloud connected')}`;
}
async function cloudBoot() {
  if (!Cloud.configured()) { cloud.role = null; hideGate(); setSync('local'); return; }
  if (!Cloud.signedIn()) { cloud.role = null; setSync('local'); if (window.KMR_SSO && window.KMR_SSO.active) return window.KMR_SSO.toPortal(); showGate('signin'); return; }
  try {
    showGate('loading');
    setSync('busy', 'Connecting…');
    if (!(await Cloud.resolveOrg())) { showGate('noaccess'); setSync('err', 'No access'); return; }
    const lic = await Cloud.licence();
    if (lic && lic.ok === false) { showGate('error', (lic.message || 'Your company\'s access is paused.') + ' Your plan is safe and returns as soon as the subscription is renewed.'); setSync('err', 'Access paused'); return; }
    cloud.feat = await Cloud.features();
    cloud.role = await Cloud.myRole();
    if (!cloud.role) { showGate('noaccess'); setSync('err', 'No access'); return; }
    const r = await Cloud.load();
    if (r && r.data) { adoptRemote(r.data); cloud.stamp = r.updated_at; setSync('on', 'Synced · ' + timeAgo(r.updated_at)); }
    else if (can('editor')) {
      // KMR platform: an empty workspace (new, or flushed in Data Master) starts blank — never re-publishes an old copy from this browser
      if (window.KMR_PLATFORM) { const keep = { year: state.year, month: state.month, scenario: state.scenario }; state = Object.assign(blankState(), keep); LS.set(K_STATE, state); }
      cloud.savedHash = null; cloud.firstPublish = !window.KMR_PLATFORM;
    }
    else { setSync('err', 'No shared plan published yet'); }
    try {   // company name and logo come from the customer's KMR Apps Administration
      const b = await Cloud._fetch('/rest/v1/rpc/kmr_workspace_brand', { method: 'POST', body: JSON.stringify({ p_product: 'capacity', p_org: Cloud.org }) });
      if (b && b.name) { cloud.brand = b; state.settings.companyName = b.name; if (b.logo) state.settings.logo = b.logo; }
    } catch (e) { /* keep the plan's own name */ }
    await applyOpsMasters();   // machines, parts, cycle times, plant standards and HRM holidays
    hideGate(); render(); startPoll(); setTimeout(publishRmp, 1500);
    if (cloud.firstPublish) { cloud.firstPublish = false; firstPublishModal(); }
  } catch (e) {
    setSync('err', e.message);
    if (/sign in again/i.test(e.message)) showGate('signin', e.message);
    else showGate('error', e.message);
  }
}
/* Raw Material Planning: the parts to start this month, published for the RMP app. Best-effort and silent — nothing happens if the company has no RMP licence. */
let rmpLast = '';
async function publishRmp() {
  if (!window.KMR_PLATFORM || !cloudActive() || !can('editor') || !Cloud.org) return;
  try {
    const m = E.compute(state, { scenario: 'standard' }), dyn = m.mode === 'dynamic', by = {};
    m.rows.forEach(r => { if (r.qty > 0) (by[r.partNo] = by[r.partNo] || []).push(r); });
    const rows = Object.keys(by).map(pn => {
      const rs = by[pn].slice().sort((a, b) => a.start - b.start), n = (m.net || {})[pn] || {};
      const q = dyn ? Number((n.material || {}).need || 0) : Math.max(...rs.map(r => Number(r.qty || 0))), d = rs.map(r => r.startDate).filter(Boolean).sort()[0] || null;
      return { part_code: pn, start_qty: Math.round(q), sales_qty: Math.round(Number(n.sales || rs[0].qty || 0)), need_by: d };
    }).filter(r => r.start_qty > 0);
    const sig = m.key + JSON.stringify(rows); if (sig === rmpLast) return; rmpLast = sig;
    await Cloud._fetch('/rest/v1/rpc/kmr_rmp_publish', { method: 'POST', body: JSON.stringify({ p_org: Cloud.org, p_month: m.key, p_rows: rows }) });
  } catch (e) { rmpLast = ''; }
}
async function cloudSave(force) {
  if (!can('editor')) return;
  const hash = sharedHash();
  try {
    setSync('busy', 'Saving…');
    const r = await Cloud.save(sharedPart(state), cloud.stamp, force === true);
    if (r.conflict) { cloud.dirty = true; setSync('err', 'Newer version in cloud'); conflictModal(r.remote); return; }
    cloud.stamp = r.stamp; cloud.savedHash = hash; cloud.dirty = sharedHash() !== hash; setSync('on', 'Synced · just now'); publishRmp();
  } catch (e) { setSync('err', navigator.onLine === false ? 'Offline — will save when back online' : e.message); if (!navigator.onLine) cloud.dirty = true; }
}
async function pullIfChanged(quiet) {
  if (!cloudActive() || cloud.dirty || cloud.pulling) return;
  cloud.pulling = true;
  try {
    const hd = await Cloud.head();
    if (hd && hd.updated_at !== cloud.stamp) {
      const r = await Cloud.load(); adoptRemote(r.data); cloud.stamp = r.updated_at;
      render(true); setSync('on', 'Synced · ' + timeAgo(r.updated_at));
      if (!quiet) toast(`Plan updated by ${r.updated_by || 'a colleague'}`);
    } else if (hd) setSync('on', 'Synced · ' + timeAgo(hd.updated_at));
  } catch (e) { setSync('err', e.message); }
  finally { cloud.pulling = false; }
}
function startPoll() {
  clearInterval(cloud.poll);
  cloud.poll = setInterval(() => { if (!document.hidden) pullIfChanged(); }, 20000);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) pullIfChanged(); });
window.addEventListener('online', () => { if (cloud.dirty) cloudSave(); else pullIfChanged(true); });
function conflictModal(remote) {
  modal({
    title: 'Someone else saved a newer version',
    body: `<p><b>${h(remote.updated_by || 'A colleague')}</b> saved the plan ${h(timeAgo(remote.updated_at))}. Your latest change has not been saved to the cloud yet.</p><p class="muted">Load theirs to discard your unsaved change, or keep yours to overwrite the cloud copy. Every version is kept, so an admin can restore either one later.</p>`,
    buttons: [
      { label: 'Load their version', act: async () => { const r = await Cloud.load(); adoptRemote(r.data); cloud.stamp = r.updated_at; cloud.dirty = false; render(); setSync('on', 'Synced'); } },
      { label: 'Keep mine and overwrite', cls: 'primary', act: () => cloudSave(true) }

function firstPublishModal() {

/* ---------- sign-in gate (cloud mode) ---------- */
let resendTimer = null;
function showGate(kind, msg, okMsg) {
  // KMR platform: no login screen of its own — sign-in is always the customer's KMR Apps page
  // KMR platform: only the planner's own SIGN-IN screens are replaced (by the KMR Apps sign-in); loading / no-access / error cards stay
  if (window.KMR_SSO && window.KMR_SSO.active && /^(signin|otp|forgot|reset|setpw)$/.test(kind)) { window.KMR_SSO.toPortal(null, { signin: true }); return; }
  if (window.KMR_SSO && window.KMR_SSO.active && kind === 'noaccess') { window.KMR_SSO.toPortal(null); return; }   // standard KMR route: repair access, else the standard message
  let g = $('#gate');
  if (!g) { g = document.createElement('div'); g.id = 'gate'; g.className = 'gate'; document.body.appendChild(g); }
  const s = state ? state.settings : {}, c = Cloud.config(), ses = Cloud.session();
  const initials = (s.companyName || 'C').split(/\s+/).filter(Boolean).map(w => w[0]).join('').slice(0, 2).toUpperCase();
  const logo = s.logo ? `<img src="${h(s.logo)}" alt="">` : h(initials);
  const err = msg ? `<div class="note crit">${icon('alert')}<div>${h(msg)}</div></div>` : '';
  const ok = okMsg ? `<div class="note ok">${icon('check')}<div>${h(okMsg)}</div></div>` : '';
  let title = 'Sign in', body = '';
  if (kind === 'loading') body = `<p class="muted">Loading the shared plan…</p>`;
  else if (kind === 'noaccess') body = `<div class="note warn">${icon('alert')}<div><b>${h(ses && ses.email)}</b> has signed in, but has no access to this planner yet. Ask your administrator to add you.</div></div><div class="gate-actions"><button class="btn" data-act="gateRetry">Try again</button><button class="btn ghost" data-act="signOut">Sign out</button></div>`;
  else if (kind === 'error') body = `${err}<div class="gate-actions"><button class="btn primary" data-act="gateRetry">Try again</button><button class="btn ghost" data-act="signOut">Sign out</button></div>`;
  else if (kind === 'forgot') {
    title = 'Forgot password';
    body = `${err}<p class="small muted">Enter your e-mail. We will send you a one-time code to set a new password.</p>
      <form id="gateForgot" class="gate-form"><div class="field"><label for="gfEmail">E-mail</label><input class="inp" id="gfEmail" type="email" autocomplete="username" required value="${h(ui.lastEmail || '')}"></div>
      <button class="btn primary" type="submit" style="height:40px">Send code</button></form>
      <button class="btn ghost sm" data-act="gateBack">← Back to sign in</button>`;
  } else if (kind === 'otp') {
    title = 'Set a new password';
    body = `${err}${ok}<form id="gateOtp" class="gate-form">
      <div class="field"><label for="goCode">Code from the e-mail</label><input class="inp otp" id="goCode" inputmode="numeric" autocomplete="one-time-code" maxlength="10" required placeholder="••••••"></div>
      ${pwField('goPw1', 'New password', 'new-password', 'minlength="8" required')}
      ${pwField('goPw2', 'Repeat new password', 'new-password', 'required')}
      <button class="btn primary" type="submit" style="height:40px">Save password & sign in</button></form>
      <div class="gate-actions"><button class="btn sm" data-act="gateResend" id="gateResend">Send a new code</button><button class="btn ghost sm" data-act="gateBack">← Back to sign in</button></div>`;
  } else {
    body = `${err}${ok}<form id="gateForm" class="gate-form" autocomplete="on">
        <div class="field"><label for="gEmail">E-mail</label><input class="inp" id="gEmail" type="email" autocomplete="username" required value="${h(ui.lastEmail || '')}"></div>
        ${pwField('gPass', 'Password', 'current-password', 'required')}
        <button class="btn primary" type="submit" style="height:40px">Sign in</button>
      </form>
      <div class="gate-actions"><button class="btn ghost sm" data-act="gateForgot">Forgot password?</button></div>`;
  }
  g.innerHTML = `<div class="gate-card"><div class="gate-brand"><div class="logo">${logo}</div><div><div class="gate-co">${h(s.companyName || 'Capacity Planner')}</div><div class="small muted">${h(s.subtitle || 'Capacity Planner')}</div></div></div><h1>${h(title)}</h1>${body}<p class="small muted gate-foot">Powered By : <a href="https://www.kmr-groups.com" target="_blank" rel="noopener">KMR Group of Companies</a></p></div>`;
  g.hidden = false;
  document.body.classList.add('gated');
  gateKind = kind;

  const f = $('#gateForm');
  if (f) {
    f.addEventListener('submit', async ev => {
      ev.preventDefault();
      const email = $('#gEmail').value.trim(), pass = $('#gPass').value; ui.lastEmail = email;
      const btn = f.querySelector('button[type=submit]'); btn.disabled = true; btn.textContent = 'Signing in…';
      try { await Cloud.signIn(email, pass); await cloudBoot(); }
      catch (e) {
        let m = e.message;
        if (/invalid login credentials/i.test(m)) m = 'E-mail or password is not correct. Use “Forgot password?” below, or ask your administrator to reset it.';
        else if (/email not confirmed/i.test(m)) m = 'This user is not confirmed yet. Ask your administrator to add you again from Settings.';
        else { const d = await Cloud.diagnose(); if (d) m = d; }
        showGate('signin', m);

    ($('#gEmail').value ? $('#gPass') : $('#gEmail')).focus();
  }
  const fg = $('#gateForgot');
  if (fg) {
    fg.addEventListener('submit', async ev => {
      ev.preventDefault();

      const btn = fg.querySelector('button[type=submit]'); btn.disabled = true; btn.textContent = 'Sending…';
      try { await Cloud.sendResetCode(email); ui.resetEmail = email; ui.resetSentAt = Date.now(); showGate('otp', '', `If ${email} has an account, a code is on its way. Check your inbox and spam folder.`); }
      catch (e) { showGate('forgot', resetMailError(e.message)); }
    });
    $('#gfEmail').focus();
  }
  const fo = $('#gateOtp');
  if (fo) {
    fo.addEventListener('submit', async ev => {
      ev.preventDefault();
      const code = $('#goCode').value.replace(/\D/g, ''), a = $('#goPw1').value, b = $('#goPw2').value;
      if (code.length < 6) return showGate('otp', 'Enter the code from the e-mail (6 or more digits).');
      if (a.length < 8) return showGate('otp', 'The new password needs at least 8 characters.');
      if (a !== b) return showGate('otp', 'The two passwords are different.');
      const btn = fo.querySelector('button[type=submit]'); btn.disabled = true; btn.textContent = 'Saving…';
      try {
        await Cloud.verifyResetCode(ui.resetEmail, code);
        await Cloud.changePassword(a);
        toast('Password changed. You are signed in.');
        await cloudBoot();
      } catch (e) {
        Cloud.signOut();
        showGate('otp', /expired|invalid|not found/i.test(e.message) ? 'The code is wrong or has expired. Check it, or send a new code.' : e.message);
      }
    });
    $('#goCode').focus();
    tickResend();
  }
}
let gateKind = '';
function tickResend() {
  clearInterval(resendTimer);
  const upd = () => {
    const b = $('#gateResend'); if (!b) return clearInterval(resendTimer);
    const left = Math.ceil(60 - (Date.now() - (ui.resetSentAt || 0)) / 1000);
    b.disabled = left > 0; b.textContent = left > 0 ? `Send a new code (${left}s)` : 'Send a new code';
    if (left <= 0) clearInterval(resendTimer);
  };
  upd(); resendTimer = setInterval(upd, 1000);
}
function resetMailError(m) {
  if (/rate limit|too many|seconds/i.test(m)) return 'Too many requests. Please wait a minute and try again.';
  if (/not authorized|smtp|sending|mail/i.test(m)) return 'Password e-mails are not set up yet. Ask your administrator to reset your password in Settings.';
  return m;
}
function hideGate() { const g = $('#gate'); if (g) g.hidden = true; document.body.classList.remove('gated'); }

function timeAgo(ts) {
  if (!ts) return '';
  const s = (Date.now() - new Date(ts).getTime()) / 1000;
  if (s < 60) return 'just now'; if (s < 3600) return Math.round(s / 60) + ' min ago';
  if (s < 86400) return Math.round(s / 3600) + ' h ago'; return new Date(ts).toLocaleDateString();
}

function toast(msg) {

  t.textContent = msg; t.hidden = false; clearTimeout(t._h); t._h = setTimeout(() => t.hidden = true, 3200);

function modal(o) {
  closeModal();
  const wrap = document.createElement('div'); wrap.className = 'scrim'; wrap.id = 'scrim';
  wrap.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle"><div class="modal-h"><h2 id="mTitle">${h(o.title)}</h2></div><div class="modal-b">${o.body}</div><div class="modal-f">${(o.buttons || []).map((b, i) => `<button class="btn ${b.cls || ''}" data-mb="${i}">${h(b.label)}</button>`).join('')}<button class="btn ghost" data-mb="x">${h(o.cancel || 'Cancel')}</button></div></div>`;
  document.body.appendChild(wrap);
  // Close on the dark background only for simple dialogs, and only when the whole click
  // (press AND release) happened on the background — never while typing or selecting text in a form.
  const hasForm = Boolean(wrap.querySelector('.modal-b input, .modal-b select, .modal-b textarea'));
  let downOnScrim = false;
  wrap.addEventListener('mousedown', ev => { downOnScrim = ev.target === wrap; });
  wrap.addEventListener('click', async ev => {
    if (ev.target === wrap) { if (downOnScrim && !hasForm && o.dismissible !== false) closeModal(); downOnScrim = false; return; }
    const b = ev.target.closest('[data-mb]'); if (!b) return;
    if (b.dataset.mb === 'x') return closeModal();
    const btn = o.buttons[Number(b.dataset.mb)];
    const keep = btn.act ? await btn.act(wrap) : false;
    if (keep !== true) closeModal();
  });
  wrap.addEventListener('keydown', ev => { if (ev.key === 'Escape' && !hasForm) closeModal(); });
  const f = wrap.querySelector('input,select,textarea,button.primary,button'); if (f) f.focus();
  if (o.onOpen) o.onOpen(wrap);
}
function closeModal() { const s = $('#scrim'); if (s) s.remove(); }
function confirmBox(title, text, label, fn, danger) { modal({ title, body: `<p>${text}</p>`, buttons: [{ label, cls: danger ? 'danger' : 'primary', act: fn }] }); }
function download(name, blob) {
  const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = name;

/* ---------- lock controls the signed-in role may not use ---------- */
const EDITOR_ACTS = ['pmNew', 'pmPick', 'pmAddStep', 'pmDelStep', 'pmUp', 'pmDown', 'pmAddMach', 'pmDelMach', 'pmSave', 'pmDelPart', 'applyBalance', 'applyMinSug', 'pullSales', 'addHoliday', 'delHoliday', 'pastePlan', 'pasteStock', 'clearStock', 'importXlsx', 'copyPrev', 'clearQty', 'applyLevel', 'clearSplits', 'addMachine', 'delMachine', 'addOp', 'delOp', 'opUp', 'alternates', 'pasteRoutings'];
const ADMIN_ACTS = ['uploadLogo', 'removeLogo', 'importJson', 'resetAll', 'blankStart', 'clearPlans', 'connSave', 'connReset', 'connDownload'];
const EDITOR_SETTINGS = ['autoShare', 'levelTargetPct', 'lotSize', 'levelAnyMachine', 'oee', 'hoursPerDay', 'daysPerMonth', 'warnPct', 'transferLagHours'];
function actNeeds(act) { return ADMIN_ACTS.includes(act) ? 'admin' : EDITOR_ACTS.includes(act) ? 'editor' : null; }
function fieldNeeds(el) {
  const d = el.dataset;
  if (d.qty || d.stk || d.cover || d.minon || d.due || d.avail || d.remark || d.mfield || d.ofield) return 'editor';
  if (d.setting) return EDITOR_SETTINGS.includes(d.setting) ? 'editor' : 'admin';
  if (d.settingBool) return EDITOR_SETTINGS.includes(d.settingBool) ? 'editor' : 'admin';
  if (d.weekoff !== undefined || el.id === 'hDate' || el.id === 'hName') return 'editor';
  return null;
}
function applyPermissions() {
  if (!cloudActive()) return;
  const view = $('#view');
  view.querySelectorAll('input,select,textarea,button').forEach(el => {
    const need = el.dataset.act ? actNeeds(el.dataset.act) : fieldNeeds(el);
    if (need && !can(need)) {
      if (el.dataset.act) { el.hidden = true; }
      else { el.disabled = true; el.setAttribute('data-locked', ''); el.title = need === 'admin' ? 'Only an admin can change this' : 'View only'; }
    }

/* ---------- favicon from the logo in Settings ---------- */
const DEFAULT_ICON = document.querySelector('link[rel="icon"]') ? document.querySelector('link[rel="icon"]').href : '';
let faviconFor = null;
function setIconLink(rel, href, sizes) {
  let l = document.querySelector(`link[rel="${rel}"]`);
  if (!l) { l = document.createElement('link'); l.rel = rel; document.head.appendChild(l); }
  if (sizes) l.sizes = sizes;
  l.href = href;
}
function applyFavicon(logo) {
  if (faviconFor === (logo || '')) return;          // only redraw when the logo changes
  faviconFor = logo || '';
  if (!logo) { setIconLink('icon', DEFAULT_ICON); setIconLink('apple-touch-icon', DEFAULT_ICON); return; }
  const img = new Image();
  img.onload = () => {
    // Square, padded versions so wide logos stay readable in the browser tab and on home screens
    const draw = (size, pad, bg) => {
      const c = document.createElement('canvas'); c.width = c.height = size;
      const x = c.getContext('2d');
      if (bg) { x.fillStyle = bg; x.fillRect(0, 0, size, size); }
      const box = size - pad * 2, sc = Math.min(box / img.width, box / img.height);
      const w = img.width * sc, h = img.height * sc;
      x.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
      return c.toDataURL('image/png');
    };
    try {
      setIconLink('icon', draw(64, 2, null), '64x64');
      setIconLink('apple-touch-icon', draw(180, 18, '#FFFFFF'), '180x180');
    } catch (e) { setIconLink('icon', logo); }
  };
  img.onerror = () => setIconLink('icon', DEFAULT_ICON);
  img.src = logo;
}

function syncHash() { try { history.replaceState(null, '', pageHref(ui.page, ui.page === 'masters' ? ui.mastersTab : ui.page === 'settings' ? ui.settingsTab : '')); } catch (e) { /* ignore */ } }

function cellSummary() {
  const cells = [...new Set(model.machines.map(m => m.cell))];
  return cells.map(c => {
    const ms = model.machines.filter(m => m.cell === c);
    const av = ms.reduce((a, m) => a + m.availDays, 0), rq = ms.reduce((a, m) => a + m.reqDays, 0), u = av ? rq / av * 100 : 0;
    const worst = ms.some(m => m.tier === 'critical') ? 'critical' : ms.some(m => m.tier === 'sunday') ? 'sunday' : u >= state.settings.warnPct ? 'tight' : 'ok';
    return `<button class="cellbox ${ui.cellFilter === c ? 'on' : ''}" data-cell="${h(c)}"><span class="t"><span>${h(c)}</span><span class="num">${fmt(u, 0)}%</span></span>
      <div class="meter"><i class="fill-${worst}" style="width:${Math.min(100, u)}%"></i></div>
      <span class="s"><span>${ms.length} machine${ms.length > 1 ? 's' : ''}</span><span class="num">${fmt(rq, 1)} / ${fmt(av, 0)} d</span></span></button>`;
  }).join('');
}

function attentionList() {
  const items = [];
  const sun = model.sundaysAvailable;
  model.machines.filter(m => m.tier === 'critical').sort((a, b) => a.balDays - b.balDays).forEach(m => {
    const short = m.reqDays - (m.availDays + (state.scenario === 'sunday' ? 0 : sun));
    items.push({ k: 'crit', t: `${m.code} is overloaded by ${fmt(-m.balDays)} days (${fmtInt(m.overloadHours)} h)`,
      p: state.scenario === 'sunday' ? `Even with Sundays it needs ${fmt(-m.balDays)} more days. Move or split work to another machine.` : `Working all ${sun} Sundays still leaves it ${fmt(short)} days short. Move or split work to another machine.`,
      b: [['Open Load Balancer', 'nav:balance'], ['View machine', 'mach:' + m.code]] });
  });
  model.machines.filter(m => m.tier === 'sunday').forEach(m => {
    items.push({ k: 'warn', t: `${m.code} needs ${fmt(-m.balDays)} extra days`, p: `Cover with ${Math.ceil(-m.balDays - 1e-9)} Sunday${Math.ceil(-m.balDays) > 1 ? 's' : ''} of ${sun} available, or move ${fmtInt(m.overloadHours)} h of work.`, b: [['View machine', 'mach:' + m.code]] });
  });
  const takt = model.rows.filter(r => r.qty > 0 && !r.meetsTakt);
  takt.slice(0, 3).forEach(r => {
    const need = Math.ceil(r.effCT / r.taktSec);
    items.push({ k: 'warn', t: `${r.partNo} ${r.process} cannot reach takt on ${r.machine}`, p: `Needs ${fmt(r.effCT, 0)} s/pc at ${state.settings.oee}% OEE but takt to ${fmtDate(r.due)} is ${fmt(r.taktSec, 0)} s/pc. Run it on ${need} machines in parallel or move the due date.`, b: [['Open schedule', 'nav:schedule']] });
  });
  const late = model.rows.filter(r => r.qty > 0 && r.late && r.meetsTakt);
  if (late.length) items.push({ k: 'warn', t: `${late.length} operations finish after their due date`, p: `Mostly caused by machines loaded beyond the month. The Loading Schedule shows each start and finish date.`, b: [['Open schedule', 'nav:schedule']] });
  const issues = dataIssues();
  if (issues.length) items.push({ k: 'info', t: `${issues.length} master data check${issues.length > 1 ? 's' : ''} to review`, p: issues[0].text, b: [['Review data', 'masters:check']] });
  if (!items.length) return `<div class="act"><span class="stripe" style="background:var(--ok)"></span><div><h4>Plan is within capacity</h4><p>All machines have spare days and every operation finishes by its due date.</p></div></div>`;
  const col = { crit: 'var(--crit)', warn: 'var(--warn)', info: 'var(--brass)' };
  return items.slice(0, 7).map(i => `<div class="act"><span class="stripe" style="background:${col[i.k]}"></span><div><h4>${h(i.t)}</h4><p>${h(i.p)}</p><div class="go">${i.b.map(b => `<button class="btn sm" data-go="${h(b[1])}">${h(b[0])}${icon('arrow')}</button>`).join('')}</div></div></div>`).join('');
}

function drawLoadChart(sel) {
  const host = $(sel); if (!host) return;
  const W = Math.max(300, host.clientWidth || 640);
  const narrow = W < 520;
  const ms = model.machines;
  const labelW = narrow ? 104 : 140, valW = narrow ? 44 : 56, rowH = narrow ? 24 : 26, top = 22;
  const plotW = W - labelW - valW - 8;
  const sunOn = state.scenario === 'standard';
  const max = Math.ceil(Math.max(30, ...ms.map(m => Math.max(m.reqDays, m.availDays + (sunOn ? model.sundaysAvailable : 0)))) / 5) * 5;
  const x = v => labelW + (v / max) * plotW;
  const H = top + ms.length * rowH + 6;
  let g = '';
  for (let v = 0; v <= max; v += 5) g += `<line class="grid" x1="${x(v)}" x2="${x(v)}" y1="${top - 4}" y2="${H - 4}"/><text x="${x(v)}" y="12" text-anchor="middle">${v}${v === max ? ' d' : ''}</text>`;
  ms.forEach((m, i) => {
    const y = top + i * rowH, bh = rowH - 10;
    g += `<rect class="row-hit" data-go="mach:${h(m.code)}" x="0" y="${y}" width="${W}" height="${rowH}"><title>${h(m.code)}: ${fmt(m.reqDays)} of ${fmt(m.availDays, 1)} days</title></rect>`;
    g += `<text class="lab" x="${labelW - 8}" y="${y + rowH / 2 + 4}" text-anchor="end">${h(narrow ? m.code.replace('Engineering', 'Engg') : m.code)}</text>`;
    g += `<rect class="track" x="${x(0)}" y="${y + 5}" width="${plotW}" height="${bh}" rx="3"/>`;
    g += `<rect class="b-${m.tier}" x="${x(0)}" y="${y + 5}" width="${Math.max(0, x(Math.min(m.reqDays, max)) - x(0))}" height="${bh}" rx="3" pointer-events="none"/>`;
    g += `<line class="capline" x1="${x(m.availDays)}" x2="${x(m.availDays)}" y1="${y + 2}" y2="${y + rowH - 2}" pointer-events="none"/>`;
    if (sunOn) g += `<line class="sunline" x1="${x(m.availDays + model.sundaysAvailable)}" x2="${x(m.availDays + model.sundaysAvailable)}" y1="${y + 2}" y2="${y + rowH - 2}" pointer-events="none"/>`;
    g += `<text class="val" x="${W - 4}" y="${y + rowH / 2 + 4}" text-anchor="end">${fmt(m.reqDays, 1)}</text>`;
  });
  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Required days per machine compared with available days">${g}</svg>`;
}

  return `<section class="card"><div class="card-h"><div><h2>Operation-level workout</h2><div class="sub">PPH = (3600 ÷ cycle time) × ${s.oee}% OEE · Required hours = plan ÷ PPH · Required days = hours ÷ hours per day</div></div></div>
    <div class="toolbar">${searchBox('work', 'Search part, process or machine')}
      <select class="inp" style="width:auto" id="workMachine" aria-label="Machine filter"><option value="ALL">All machines</option>${model.machines.map(m => `<option ${m.code === machFilter ? 'selected' : ''}>${h(m.code)}</option>`).join('')}</select>
      <label class="chk"><input type="checkbox" id="hideZero" ${ui.hideZero ? 'checked' : ''}> Hide zero-quantity rows</label>
      <span class="grow"></span><span class="small muted">${rows.length} rows</span></div>
    <div class="tbl-wrap" id="tw-work"><table class="tbl"><thead><tr>
      <th class="stick">Part name<span class="xl">A</span></th><th>Part #<span class="xl">B</span></th><th>Process<span class="xl">C</span></th><th>Machine<span class="xl">D</span></th><th class="r">Month plan<span class="xl">E</span></th><th class="r">Cycle time (s)<span class="xl">F</span></th><th class="r">PPH @ ${s.oee}%<span class="xl">G</span></th><th class="r">Hrs / day<span class="xl">H</span></th><th class="r">Days / month<span class="xl">I</span></th><th class="r">Req. hours<span class="xl">J = E ÷ G</span></th><th class="r">Req. days<span class="xl">K = J ÷ H</span></th><th class="r">Balance days<span class="xl">L = I − K</span></th></tr></thead>
    <tbody>${rows.map(r => `<tr class="${r.qty ? '' : 'zero'}"><td class="stick">${h(r.partName)}</td><td class="mono">${h(r.partNo)}</td><td>${h(r.process)}</td><td>${h(r.machine)}${r.moved ? ' <span class="tag brass">moved</span>' : r.split ? ' <span class="tag brass">split</span>' : ''}</td>
      <td class="r num">${fmtInt(r.qty)}</td><td class="r num">${r.cycleTime}</td><td class="r num">${fmt(r.pph)}</td><td class="r num">${r.hoursPerDay}</td><td class="r num">${s.daysPerMonth}</td><td class="r num">${fmt(r.reqHours)}</td><td class="r num"><b>${fmt(r.reqDays)}</b></td><td class="r num ${r.rowBalance < 0 ? 'neg' : ''}">${fmt(r.rowBalance)}</td></tr>`).join('')}</tbody>
    <tfoot><tr><td class="stick">Total</td><td></td><td></td><td></td><td class="r num">${fmtInt(sumK('qty'))}</td><td></td><td></td><td></td><td></td><td class="r num">${fmt(sumK('reqHours'))}</td><td class="r num">${fmt(sumK('reqDays'))}</td><td></td></tr></tfoot></table></div>
    <div class="card-b" style="padding-top:12px">${note('', 'info', '“Balance days” (column L) treats each operation as if it had the machine to itself, exactly like the Excel sheet. The machine-level balance on the Capacity Plan is the figure to act on.')}</div></section>`;
};

/* ---------------------------------------------------------------- SCHEDULE */
Pages.schedule = () => {
  const mf = ui.schedMachine;
  const ms = model.machines.filter(m => mf === 'ALL' || m.code === mf);
  const cal = model.cal;
  const N = cal.n;
  const cols = `repeat(${N}, minmax(0,1fr))`;
  const wk = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
  const today = new Date(); const tIso = E.iso(today.getFullYear(), today.getMonth(), today.getDate());
  // map schedulable unit -> calendar position (fractional day index 0..N)
  const sched = cal.schedulable;
  const pos = u => { if (u >= sched.length) return N; const i = Math.floor(u), f = u - i; return (sched[i].d - 1) + f; };
  const dayHead = cal.days.map(d => `<div class="g-day ${d.isHol ? 'hol' : d.isOff ? 'off' : ''}" title="${d.date}${d.isHol ? ' · Holiday' : d.isOff ? ' · Weekly off' : ''}"><span class="w">${wk[d.dow]}</span>${d.d}</div>`).join('');
  const bg = cal.days.map(d => `<i class="${d.isHol ? 'hol' : d.isOff && state.scenario !== 'sunday' ? 'off' : ''}"></i>`).join('');
  const lanes = ms.map(m => {
    const ops = m.ops.filter(r => r.qty > 0 && r.start != null);
    const bars = ops.map((r, i) => {
      const cls = r.overflow ? 'over' : r.late ? 'late' : (i % 2 ? 'b' : 'a');
      const dueD = Number(r.due.slice(8)); const dueL = (dueD - 0.5) / N * 100;
      const tip = `${h(r.partNo)} ${h(r.process)} · ${fmtInt(r.qty)} pcs · ${fmt(r.reqDays)} d · ${fmtDate(r.startDate)} → ${r.endDate ? fmtDate(r.endDate) : 'beyond month'} · due ${fmtDate(r.due)}${r.pieces.length > 1 ? ` · runs in ${r.pieces.length} blocks` : ''}`;
      return (r.pieces || [{ start: r.start, end: r.end }]).filter(pc => pc.start < sched.length).map(pc => {
        const l = pos(pc.start) / N * 100, rgt = pos(Math.min(pc.end, sched.length)) / N * 100;
        return `<div class="g-bar ${cls} ${r.moved ? 'moved' : ''}" style="left:${l.toFixed(2)}%;width:${Math.max(0.8, rgt - l).toFixed(2)}%" title="${tip}">${h(r.partNo)}</div>`;
      }).join('') + `<span class="g-due" style="left:${dueL.toFixed(2)}%" title="Due ${h(r.partNo)}: ${fmtDateLong(r.due)}"></span>`;
    }).join('');
    const capU = Math.min(m.availDays, sched.length);
    const capL = pos(capU) / N * 100;
    return `<div class="g-row"><div class="g-name"><b>${h(m.code)}</b><span style="color:${m.balDays < 0 ? 'var(--crit)' : 'var(--muted)'}">${fmt(m.reqDays, 1)} / ${fmt(m.availDays, 1)} d</span></div><div class="g-lane"><div class="g-bg" style="grid-template-columns:${cols}">${bg}</div>${bars}<span class="g-cap" style="left:${capL.toFixed(2)}%" title="Available days end"></span></div></div>`;
  }).join('');
  const tIdx = tIso.slice(0, 7) === model.key ? (Number(tIso.slice(8)) - 0.5) / N * 100 : null;

  const rows = [];
  ms.forEach(m => m.ops.filter(r => r.qty > 0).sort((a, b) => a.start - b.start).forEach(r => rows.push(r)));
  const status = r => r.overflow ? '<span class="pill critical">Beyond month</span>' : r.late ? '<span class="pill sunday">After due date</span>' : '<span class="pill ok">On time</span>';
  return `
  <section class="card"><div class="card-h"><div><h2>Loading timeline · ${monthName()}</h2><div class="sub">Operations run in due-date order on each machine. A 2nd operation cannot start before its 1st operation (transfer lag ${state.settings.transferLagHours} h). Hatched days are weekly offs.</div></div>
    <select class="inp" style="width:auto" id="schedMachine" aria-label="Machine"><option value="ALL">All machines</option>${model.machines.map(m => `<option ${m.code === mf ? 'selected' : ''}>${h(m.code)}</option>`).join('')}</select></div>
    <div class="toolbar legend"><span><i style="background:#2F4C7A"></i>Planned run</span><span><i class="fill-sunday"></i>Ends after due date</span><span><i class="fill-critical"></i>Runs beyond month</span><span><i style="background:var(--ink);transform:rotate(45deg);width:8px;height:8px"></i>Due date</span><span><i class="line"></i>End of available days</span><span><i style="outline:2px dashed var(--brass);background:transparent"></i>Moved by balancer</span></div>
    <div class="tbl-wrap" id="tw-gantt"><div class="gantt"><div class="g-head"><div class="g-name">Machine</div><div class="g-days" style="grid-template-columns:${cols}">${dayHead}</div></div>
      <div style="position:relative">${lanes}${tIdx != null ? `<span class="g-today" style="left:calc(170px + (100% - 170px) * ${(tIdx / 100).toFixed(4)})" title="Today"></span>` : ''}</div></div></div>
  </section>
  <section class="card"><div class="card-h"><div><h2>Operation schedule & takt check</h2><div class="sub">Takt time = working time available until the due date ÷ quantity on that machine. Effective cycle time = cycle time ÷ OEE.</div></div></div>
    <div class="tbl-wrap" id="tw-sched"><table class="tbl"><thead><tr><th class="stick">Machine</th><th>Part</th><th>Process</th><th class="r">Qty</th><th class="r">Due</th><th class="r">Cycle / effective (s)</th><th class="r">Takt (s)</th><th class="r">Run days</th><th class="r">Start</th><th class="r">Finish</th><th>Status</th></tr></thead>
    <tbody>${rows.map(r => `<tr><td class="stick"><b>${h(r.machine)}</b></td><td><span class="mono">${h(r.partNo)}</span><div class="small muted">${h(r.partName)}</div></td><td>${h(r.process)}</td><td class="r num">${fmtInt(r.qty)}</td><td class="r num">${fmtDate(r.due)}</td>
      <td class="r num">${r.cycleTime} / ${fmt(r.effCT, 0)}</td><td class="r num ${r.meetsTakt ? 'pos' : 'neg'}">${fmt(r.taktSec, 0)}</td><td class="r num">${fmt(r.reqDays)}</td><td class="r num">${fmtDate(r.startDate)}</td><td class="r num">${r.endDate ? fmtDate(r.endDate) : '—'}</td><td>${status(r)}</td></tr>`).join('') || `<tr><td colspan="11" class="muted">No quantities entered for ${monthName()}.</td></tr>`}</tbody></table></div></section>`;
};

/* ---------------------------------------------------------------- BALANCER */
Pages.balance = () => {
  const s = state.settings;
  const base = E.compute(state, { scenario: 'standard' });
  const L = E.autoLevel(state);
  const after = E.compute(state, { scenario: 'standard', splitsOverride: L.splits });
  const applied = Object.keys(planOf().splits || {}).length;
  const overB = base.machines.filter(m => m.balDays < 0);
  const cmp = base.machines.map((m, i) => { const a = after.machines[i]; return `<tr><td class="stick"><b>${h(m.code)}</b></td><td class="r num">${fmt(m.availDays, 1)}</td><td class="r num ${m.balDays < 0 ? 'neg' : ''}">${fmt(m.reqDays)}</td><td>${pill(m.tier)}</td><td class="r num ${a.balDays < 0 ? 'neg' : ''}"><b>${fmt(a.reqDays)}</b></td><td>${pill(a.tier)}</td><td class="r num">${signed(a.reqDays - m.reqDays)}</td></tr>`; }).join('');
  const sundays = base.machines.filter(m => m.balDays < 0).map(m => `<tr><td class="stick"><b>${h(m.code)}</b></td><td class="r num">${fmt(-m.balDays)}</td><td class="r num">${fmtInt(m.overloadHours)}</td><td class="r num">${Math.ceil(-m.balDays - 1e-9)}</td><td>${-m.balDays <= base.sundaysAvailable ? `<span class="pill sunday">Sundays cover it</span>` : `<span class="pill critical">Short by ${fmt(-m.balDays - base.sundaysAvailable)} d</span>`}</td></tr>`).join('');
  return `
  ${applied ? note('ok', 'check', `<b>${applied} balancing change${applied > 1 ? 's are' : ' is'} applied to ${monthName()}.</b> They are part of the plan on every screen and in exports. <button class="btn sm" data-act="clearSplits" style="margin-left:8px">Undo applied moves</button>`) : ''}
  <div class="grid-2e">
    <section class="card"><div class="card-h"><div><h2>Option A · Work Sundays / overtime</h2><div class="sub">${base.sundaysAvailable} Sundays in ${monthName()}. Days needed beyond available capacity, per machine.</div></div></div>
      ${overB.length ? `<div class="tbl-wrap" id="tw-sun"><table class="tbl"><thead><tr><th class="stick">Machine</th><th class="r">Days short</th><th class="r">Hours short</th><th class="r">Sundays needed</th><th>Result</th></tr></thead><tbody>${sundays}</tbody></table></div>` : `<div class="card-b">${note('ok', 'check', 'No machine is over capacity in the standard plan.')}</div>`}
      <div class="card-b" style="padding-top:12px"><button class="btn" data-scn="sunday">Preview with Sundays</button></div></section>
    <section class="card"><div class="card-h"><div><h2>Option B · Auto-Level</h2><div class="sub">Moves or splits operations from overloaded machines to machines with spare days.</div></div></div>
      <div class="card-b"><div class="form-grid">
        <div class="field"><label for="lvTarget">Load machines up to (%)</label><input class="inp num" type="number" id="lvTarget" data-setting="levelTargetPct" value="${s.levelTargetPct}" min="50" max="130"><span class="hint">100% = exactly the available days</span></div>
        <div class="field"><label for="lvLot">Round moved quantity to</label><input class="inp num" type="number" id="lvLot" data-setting="lotSize" value="${s.lotSize}" min="1"><span class="hint">pieces (lot size)</span></div></div>
        <label class="chk" style="margin-top:12px"><input type="checkbox" id="lvAny" data-setting-bool="levelAnyMachine" ${s.levelAnyMachine ? 'checked' : ''}><span>Allow any machine when an operation has no alternates defined<br><span class="small muted">Assumes the same cycle time on the new machine. Define alternates in Masters › Routings for a realistic result.</span></span></label></div></section>
  </div>

  <section class="card"><div class="card-h"><div><h2>Proposed moves</h2><div class="sub">${L.moves.length ? `${L.moves.length} change${L.moves.length > 1 ? 's' : ''} · ${L.residual.length ? `${L.residual.length} machine${L.residual.length > 1 ? 's' : ''} still overloaded` : 'no machine left overloaded'}` : 'Nothing to move'}</div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-scn="levelled">Preview on all screens</button><button class="btn brass" data-act="applyLevel" ${L.moves.length ? '' : 'disabled'}>Apply to ${E.MONTHS[state.month]} plan</button></div></div>
    ${L.moves.length ? `<div class="tbl-wrap" id="tw-moves"><table class="tbl"><thead><tr><th class="stick">Part</th><th>Operation</th><th>Type</th><th>From</th><th>To</th><th class="r">Qty moved</th><th class="r">Days on new machine</th></tr></thead><tbody>
      ${L.moves.map(mv => `<tr><td class="stick"><span class="mono">${h(mv.partNo)}</span><div class="small muted">${h(mv.partName)}</div></td><td>${h(mv.process)}</td><td><span class="tag brass">${mv.type}</span></td><td>${h(mv.from)}</td><td><b>${h(mv.to)}</b></td><td class="r num">${fmtInt(mv.qty)}</td><td class="r num">${fmt(mv.days)}</td></tr>`).join('')}</tbody></table></div>` : `<div class="card-b">${overB.length ? note('warn', 'alert', 'No move is possible with the current rules. Define alternate machines in Masters › Routings or allow any machine above.') : note('ok', 'check', 'All machines are within capacity. Nothing to balance.')}</div>`}
    ${L.residual.length ? `<div class="card-b" style="padding-top:12px">${note('crit', 'alert', `Still overloaded after levelling: ${L.residual.map(r => `<b>${h(r.machine)}</b> (${fmt(r.overDays)} d)`).join(', ')}. Use Sundays / overtime for these.`)}</div>` : ''}
  </section>

  <section class="card"><div class="card-h"><div><h2>Before and after</h2><div class="sub">Required days per machine, standard available days</div></div></div>
    <div class="tbl-wrap" id="tw-cmp"><table class="tbl"><thead><tr><th class="stick">Machine</th><th class="r">Available</th><th class="r">Before</th><th>Status</th><th class="r">After</th><th>Status</th><th class="r">Change</th></tr></thead><tbody>${cmp}</tbody></table></div></section>`;
};

/* ---------------------------------------------------------------- MONTHLY PLAN */
Pages.plan = () => {
  const plan = planOf();
  const q = (ui.search.plan || '').toLowerCase();
  const parts = new Map();
  state.operations.forEach(o => { if (!parts.has(o.partNo)) parts.set(o.partNo, { partNo: o.partNo, partName: o.partName, ops: [] }); parts.get(o.partNo).ops.push(o); });
  const rowsByOp = new Map(); model.rows.forEach(r => { const l = rowsByOp.get(r.opId) || []; l.push(r); rowsByOp.set(r.opId, l); });
  const first = E.iso(state.year, state.month, 1), last = model.monthEnd;
  const list = [...parts.values()].filter(p => !q || `${p.partNo} ${p.partName}`.toLowerCase().includes(q));
  const prevKey = E.periodKey(state.month === 0 ? state.year - 1 : state.year, (state.month + 11) % 12);
  const totQty = list.reduce((a, p) => a + ((plan.parts[p.partNo] || {}).qty || 0), 0);
  const body = list.map(p => {
    const pp = plan.parts[p.partNo] || {};
    const rs = p.ops.flatMap(o => rowsByOp.get(o.id) || []);
    const days = rs.reduce((a, r) => a + r.reqDays, 0);
    const late = rs.some(r => r.qty > 0 && r.late), takt = rs.some(r => r.qty > 0 && !r.meetsTakt);
    const st = !(pp.qty > 0) ? '<span class="pill idle">No quantity</span>' : takt ? '<span class="pill critical">Takt not met</span>' : late ? '<span class="pill sunday">Late</span>' : '<span class="pill ok">On time</span>';
    const id = safeName(p.partNo);
    return `<tr><td class="stick mono"><b>${h(p.partNo)}</b></td><td>${h(p.partName)}</td>
      <td class="r"><input class="cell-inp" style="width:110px;text-align:right" type="number" min="0" step="100" inputmode="numeric" id="qty-${id}" data-qty="${h(p.partNo)}" value="${pp.qty || 0}" aria-label="Quantity for ${h(p.partNo)}"></td>
      <td><input class="cell-inp" style="width:150px" type="date" min="${first}" max="${last}" id="due-${id}" data-due="${h(p.partNo)}" value="${h(pp.due || last)}" aria-label="Due date for ${h(p.partNo)}"></td>
      <td><div style="display:flex;flex-wrap:wrap;gap:4px">${p.ops.map(o => `<span class="tag" title="${h(o.process)} on ${h(o.machine)}, ${o.cycleTime}s">${h(o.process)} · ${h(o.machine)} · ${o.cycleTime}s</span>`).join('')}</div></td>
      <td class="r num">${fmt(days)}</td><td>${st}</td></tr>`;
  }).join('');
  const mcards = list.map(p => { const pp = plan.parts[p.partNo] || {}; const id = safeName(p.partNo); const rs = p.ops.flatMap(o => rowsByOp.get(o.id) || []);
    const late = rs.some(r => r.qty > 0 && r.late), takt = rs.some(r => r.qty > 0 && !r.meetsTakt);
    const st = !(pp.qty > 0) ? '<span class="pill idle">No quantity</span>' : takt ? '<span class="pill critical">Takt not met</span>' : late ? '<span class="pill sunday">Late</span>' : '<span class="pill ok">On time</span>';
    return `<div class="mcard"><div class="t"><span class="mono">${h(p.partNo)}</span>${st}</div><div class="small muted">${h(p.partName)} · ${p.ops.length} operation${p.ops.length > 1 ? 's' : ''}</div>
      <div class="mrow"><input class="cell-inp" style="text-align:right" type="number" min="0" step="100" inputmode="numeric" id="mqty-${id}" data-qty="${h(p.partNo)}" value="${pp.qty || 0}" aria-label="Quantity for ${h(p.partNo)}"><input class="cell-inp" type="date" min="${first}" max="${last}" id="mdue-${id}" data-due="${h(p.partNo)}" value="${h(pp.due || last)}" aria-label="Due date for ${h(p.partNo)}"></div></div>`; }).join('');
  return `
  ${model.mode === 'dynamic' ? note('ok', 'info', '<b>Dynamic capacity is ON.</b> Machine days below use the quantity left to make after the stock entered under <button class="btn sm" data-nav="stock">Stock & Balance</button>.') : ''}
  ${!hasPlan() ? note('warn', 'info', `<b>${monthName()} has no plan yet.</b> Start from zero, or copy last month’s quantities and due dates. ${state.plans[prevKey] ? `<button class="btn sm" data-act="copyPrev" style="margin-left:8px">Copy from ${E.MONTHS[(state.month + 11) % 12]}</button>` : ''}`) : ''}
  <section class="card"><div class="card-h"><div><h2>Quantities & due dates · ${monthName()}</h2><div class="sub">The quantity applies to every operation of the part. Leave the due date at month end if the customer has none.</div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">${window.KMR_PLATFORM && cloud.ops ? `<button class="btn primary" data-act="pullSales" title="Read this month's demand per part from Sales Flow">${icon('copy')}Pull from Sales Flow</button>` : ''}<button class="btn" data-act="pastePlan">${icon('paste')}Paste from Excel</button><button class="btn" data-act="importXlsx">${icon('excel')}Import .xlsx</button>${state.plans[prevKey] && hasPlan() ? `<button class="btn" data-act="copyPrev">${icon('copy')}Copy last month</button>` : ''}<button class="btn danger" data-act="clearQty">Clear quantities</button></div></div>
    <div class="toolbar">${searchBox('plan', 'Search part number or name')}<span class="grow"></span><span class="small muted">${list.length} parts · <span class="num">${fmtInt(totQty)}</span> pcs</span></div>
    <div class="mcards">${mcards}</div>
    <div class="tbl-wrap desk-only" id="tw-plan"><table class="tbl"><thead><tr><th class="stick">Part #</th><th>Part name</th><th class="r">Monthly quantity</th><th>Customer due date</th><th>Routing (process · machine · cycle time)</th><th class="r">Machine days</th><th>Status</th></tr></thead><tbody>${body}</tbody></table></div>
    <div class="card-b" style="padding-top:12px"><button class="btn primary" data-nav="capacity">Review capacity ${icon('arrow')}</button></div>
  </section>`;
};


/* ====================================================================================================
   NEW SCREENS — Can we make it? · Demand & Stock · Loading Plan · Process Master
   Rough-cut check first (is there time on every machine?), then the finite machine loading (do the dates hold?).
   ==================================================================================================== */
Pages.present = () => '<div id="preshost"></div>';
PageAfter.present = () => {
  const el = document.getElementById('preshost'); if (!el || !window.KMRPresent) { if (el) el.textContent = 'Presentation engine not loaded.'; return; }
  const st = (n, c) => [[n, c]];
  KMRPresent.mount(el, { app: 'capacity', code: 'capacity', stdKey: 'capacity', appName: 'Capacity Planner', company: state.settings.companyName || '', slug: 'capacity', call: async () => { throw new Error('local'); }, canEdit: true, controls: [],
    load: async () => {
      const t = model.totals, ms = model.machines.filter(m => m.reqDays > 0).sort((a, b) => b.util - a.util).slice(0, 12), over = model.machines.filter(m => m.tier === 'critical' || m.tier === 'sunday');
      return { period: monthName() + ' · ' + scenarioLabel(), kpis: [
        { id: 'ut', name: 'Plant utilisation', value: t.util, unit: '%', target: 85, tol: 12, dir: 'low', std: [['IATF', '8.1'], ['ISO', '7.1.3'], ['VDA', '6.3 P5']], why: t.req.toFixed(0) + ' of ' + t.avail.toFixed(0) + ' machine-days needed. Above ~85% leaves no room for breakdowns.' },
        { id: 'ov', name: 'Machines over capacity', value: over.length, target: 0, amber: 2, dir: 'low', std: [['IATF', '8.1'], ['ISO', '8.1'], ['VDA', '6.3 P5']], why: 'Needs overtime, Sunday work, outsourcing or load balancing.' },
        { id: 'late', name: 'Operations that will miss the due date', value: t.lateOps, target: 0, amber: 2, dir: 'low', std: [['IATF', '8.2.1'], ['VDA', '6.3 P7']], why: 'Out of ' + t.activeOps + ' active operations.' },
        { id: 'tk', name: 'Operations that cannot reach takt', value: t.taktFail, target: 0, amber: 2, dir: 'low', std: [['IATF', '8.5.1.1'], ['VDA', '6.3 P6']], why: 'Cycle time is too long for the customer takt on one machine.' },
        { id: 'sp', name: 'Spare machine-days', value: t.bal, std: [['ISO', '7.1.3']], why: 'Available minus required; negative means a shortage.' },
        { id: 'vol', name: 'Monthly volume (pcs)', value: t.qtyParts, std: [['ISO', '8.2.1']], why: 'Customer quantity entered in the monthly plan.' }],

/* ---------------------------------------------------------------- PROCESS MASTER */
function pmParts() {

}

function pmSyncDraft(el) {

async function pmSave() {
  const d = ui.pmDraft; const pn = (d.partNo || '').trim(); if (!pn) return toast('Enter the part number first.');
  if (ui.pmPart === '__new' && pmParts().some(p => p.partNo.toLowerCase() === pn.toLowerCase())) return toast('This part number already exists — pick it from the list.');
  const steps = d.steps.filter(s => (s.process || '').trim());
  if (!steps.length) return toast('Add at least one process.');
  const bad = steps.find(s => s.source !== 'Supplier' && !s.machines.some(m => (m.code || '').trim()));
  if (bad) return toast(`“${bad.process}” has no machine — add one, or mark the process as Supplier.`);
  const noct = steps.find(s => s.source !== 'Supplier' && s.machines.some(m => (m.code || '').trim() && !(Number(m.ct) > 0)));
  if (noct) return toast(`“${noct.process}”: every machine needs a cycle time in seconds.`);
  const payload = { partNo: pn, partName: (d.partName || '').trim() || pn, steps: steps.map(s => ({ process: s.process.trim(), source: s.source, machines: s.source === 'Supplier' ? [] : s.machines.filter(m => (m.code || '').trim()).map(m => ({ code: m.code.trim(), ct: Number(m.ct) })) })) };

    await applyOpsMasters(); ui.pmPart = pn; ui.pmDraft = null; render(); return toast('Process flow saved to the Operations Master.');
  }

  <section class="card" style="margin-top:16px"><div class="card-h"><div><h2>② Process by process</h2><div class="sub">Pieces per hour of a machine = 3600 ÷ cycle time × OEE. Machines of one process add up. <b>Days needed</b> = quantity ÷ pieces per day. The last-but-one column compares the process’s own time per piece with the takt time.</div></div>

    <div class="tbl-wrap" id="tw-quick" data-nofilter><table class="tbl"><thead><tr><th>Process</th><th>Machines · cycle time · share of work</th><th class="r">Pieces to make</th><th class="r">Capacity per day</th><th class="r">Days needed</th><th class="r">Days available</th><th>Load</th><th class="r" title="seconds per piece of this process / takt time">Time per piece / takt (s)</th><th>Result</th></tr></thead><tbody>${rows || '<tr><td colspan="12" class="muted" style="padding:20px">No routing yet.</td></tr>'}</tbody></table></div>

    <section class="card"><div class="card-h"><div><h2>④ What to do next</h2></div></div><div class="card-b prose">

      ${w.gaps.length ? `<p><b>Please complete these in the Operations Master:</b></p><ul>${w.gaps.slice(0, 8).map(g => `<li>${h(g)}</li>`).join('')}</ul>` : ''}
      <p class="small muted">Need to see days, due dates or stock? Open <a href="${pageHref('capacity')}" data-nav="capacity">Capacity Plan</a>, <a href="${pageHref('schedule')}" data-nav="schedule">Loading Schedule</a> or <a href="${pageHref('bulletin')}" data-nav="bulletin">Verdict &amp; Actions</a> under “Classic screens”.</p>
    </div></section>
  </div>`;
};


/* ---------------------------------------------------------------- VERDICT & ACTION BULLETIN */
Pages.bulletin = () => {
  const v = E.verdict(state), cap = v.capacity, del = v.delivery;
  const cp = { yes: ['ok', 'YES', 'Every machine has enough time for the whole sales plan.'],
    sunday: ['warn', 'YES — with Sunday working', 'Some machines are short in normal days, but Sundays cover the gap.'],
    act: ['warn', 'YES — if you act', 'Short on some machines, but load balancing and Sunday working together cover it.'],
    no: ['bad', 'NO', `Even after load balancing and Sunday working some machines are still short — about ${fmtInt(cap.shortPcs)} pieces cannot be made.`] }[v.capLevel];
  const dl = del.late === 0 ? ['ok', 'YES', `All ${del.total} parts finish on or before the customer date.`]
    : del.lateA > 0 ? ['bad', 'NO', `${del.late} of ${del.total} parts will be late, including ${del.lateA} A-class runner part${del.lateA > 1 ? 's' : ''}.`]
    : ['warn', `${del.late} of ${del.total} PARTS LATE`, `${del.onTime} parts are on time. Late: ${v.parts.filter(p => p.late).map(p => p.partNo).join(', ')}.`];
  const dsp = d => `<details class="dsp"><summary><span class="pill ${d.sev === 3 ? 'critical' : d.sev === 2 ? 'sunday' : 'tight'} plain">${d.sev === 3 ? 'Urgent' : d.sev === 2 ? 'Act' : 'Watch'}</span> ${h(d.title)}</summary>
    <div class="small muted" style="margin-top:6px">${h(d.detail)}</div><ul>${d.fixes.map(f => `<li><b>${h(f.title)}</b>${f.kind === 'cause' || f.kind === 'watch' ? '' : (f.covers ? ' <span class="pill ok plain">covers it</span>' : ' <span class="pill tight plain">part of it</span>')} — ${h(f.text)}</li>`).join('')}</ul></details>`;
  const mach = v.disputes.filter(d => d.type === 'overload' || d.type === 'tight'), late = v.disputes.filter(d => d.type === 'late');
  const prow = p => `<tr><td class="mono">${h(p.partNo)}</td><td>${h(p.partName)}</td><td><span class="cls ${p.cls}">${p.cls}</span></td><td class="r num">${fmtInt(p.qty)}</td><td>${fmtDate(p.due)}</td><td>${p.finish ? fmtDate(p.finish) : 'after month end'}</td>
    <td>${p.late ? `<span class="pill critical">${p.finish ? p.lateDays + ' d late' : 'Late'}</span>` : '<span class="pill ok">On time</span>'}</td><td class="small muted">${h(p.bottleneck)} · ${h(p.bottleneckOp)}</td></tr>`;
  return `
  <div class="vd-grid">
    <div class="vd ${cp[0]}"><div class="q">1 · Can we achieve the sales? <span class="muted" style="text-transform:none;letter-spacing:0">(capacity · takt)</span></div><div class="a">${cp[1]}</div><div class="small">${cp[2]}</div>
      <div class="small muted" style="margin-top:8px">Machine time needed <b>${fmt(cap.req, 1)}</b> of <b>${fmt(cap.avail, 1)}</b> days (${fmt(cap.util, 0)}%) · overloaded machines <b>${cap.over.length}</b> · nearly full <b>${cap.tight.length}</b> · ${state.capMode === 'dynamic' ? 'Dynamic' : 'Static'} capacity</div></div>
    <div class="vd ${dl[0]}"><div class="q">2 · Can we deliver on time? <span class="muted" style="text-transform:none;letter-spacing:0">(machine loading · throughput)</span></div><div class="a">${dl[1]}</div><div class="small">${dl[2]}</div>
      <div class="small muted" style="margin-top:8px">On time <b>${del.onTime}</b> · late <b>${del.late}</b> of <b>${del.total}</b> parts · A runners late <b>${del.lateA}</b></div></div>
  </div>
  <section class="card" style="margin-top:16px"><div class="card-h"><div><h2>Bulletin — what to do to meet the sales</h2><div class="sub">Most urgent first. A runners are protected first, B repeaters next; C strangers give way first.</div></div>
    <button class="btn" data-act="copyBulletin">${icon('copy')}Copy as text</button></div>
    ${v.bulletin.length ? v.bulletin.map((b, i) => `<div class="bul s${b.sev}"><div class="n">${i + 1}</div><div><h4>${h(b.title)}</h4><div class="k"><b>Why:</b> ${h(b.why)}</div>${b.how ? `<div class="k"><b>Do:</b> ${h(b.how)}</div>` : ''}<div class="k"><b>Result:</b> ${h(b.result)}</div></div></div>`).join('')
      : `<div class="card-b muted">Nothing to do — every machine has time and every part is on schedule.</div>`}
  </section>
  <section class="card" style="margin-top:16px"><div class="card-h"><div><h2>If you act, what changes?</h2><div class="sub">Same plan, same data, worked out three ways.</div></div></div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Case</th><th class="r">Overloaded machines</th><th class="r">Overload (days)</th><th class="r">Parts late</th><th class="r">A runners late</th><th class="r">Machine use</th></tr></thead><tbody>
    ${v.what.map((w, wi) => (wi === 1 && isLocked('balance')) || (wi === 2 && isLocked('scn:sunday')) ? `<tr><td><b>${h(w.label)}</b></td><td colspan="5" class="muted">🔒 Not in your plan — contact KMR Group of Companies to add it</td></tr>` : `<tr><td><b>${h(w.label)}</b></td><td class="r num">${w.over}</td><td class="r num">${fmt(w.overDays, 1)}</td><td class="r num">${w.late}</td><td class="r num">${w.lateA}</td><td class="r num">${fmt(w.util, 0)}%</td></tr>`).join('')}</tbody></table></div>
    ${v.gap.length && !isLocked('balance') && !isLocked('scn:sunday') ? `<div class="card-b">${note('warn', 'info', `<b>Still short after everything:</b> ${v.gap.map(g => `${h(g.machine)} — ${h(g.partNo)} (${g.cls}) about ${fmtInt(g.qty)} pcs`).join('; ')}. Outsource, work longer, or agree the quantity with the customer. A parts are cut last.`)}</div>` : ''}
    <div class="card-b" style="padding-top:0">${isLocked('balance') ? '' : `<button class="btn primary" data-nav="balance">Open the Load Balancer ${icon('arrow')}</button>`}</div>
  </section>
  <section class="card" style="margin-top:16px"><div class="card-h"><div><h2>Problems and how to overcome each one</h2><div class="sub">Open a line to see every way out, with numbers.</div></div></div>
    ${mach.length || late.length ? mach.concat(late).map(dsp).join('') : '<div class="card-b muted">No problems found.</div>'}</section>
  <section class="card" style="margin-top:16px"><div class="card-h"><div><h2>Delivery check, part by part</h2><div class="sub">Expected finish comes from the machine loading schedule (finite capacity, routing order, transfer time).</div></div></div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Part #</th><th>Name</th><th>Class</th><th class="r">Quantity</th><th>Customer date</th><th>Expected finish</th><th>Status</th><th>Last step</th></tr></thead><tbody>${v.parts.map(prow).join('')}</tbody></table></div></section>`;
};

/* ---------------------------------------------------------------- STOCK & BALANCE (Dynamic capacity) */

/* Suggested minimum stock: how much cover each part can carry with the machine time that is spare */
function minSugCard(dyn) {
  const sg = ui.minSug && ui.minSug.key === model.key ? ui.minSug.res : null, edit = can('editor');
  const head = `<div class="card-h"><div><h2>Suggested minimum stock</h2><div class="sub">Uses only spare machine time: A runners first, then B repeaters, then C strangers — never overloading a machine or making another part late.</div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="suggestMin">${sg ? 'Work out again' : 'Work out'}</button>${sg && edit && sg.rows.some(r => r.days > 0) ? '<button class="btn primary" data-act="applyMinSug">Apply to the plan</button>' : ''}</div></div>`;
  if (!sg) return `<section class="card" style="margin-top:16px">${head}<div class="card-b muted">Press <b>Work out</b>. Stock levels you typed yourself are kept until you apply the suggestion.${dyn ? '' : ' (Switch to Dynamic capacity — Static ignores stock.)'}</div></section>`;
  const rows = sg.rows.filter(r => r.days > 0 || r.limit);
  return `<section class="card" style="margin-top:16px">${head}
    <div class="card-b">${note(sg.baseOver ? 'warn' : 'ok', 'info', sg.baseOver ? `<b>${sg.baseOver} machine(s) are already overloaded without any minimum stock.</b> Parts on them get no minimum stock until the overload is solved (see Verdict &amp; Actions).` : `<b>Spare machine time exists.</b> The suggestion adds <b>${fmt(sg.totalExtra, 1)} machine days</b> (${fmt(sg.baseReq, 1)} → ${fmt(sg.newReq, 1)}) and keeps every machine within its available days.`)}</div>
    <div class="tbl-wrap"><table class="tbl fit"><thead><tr><th>Part</th><th>Class</th><th class="r">Suggested cover (days)</th><th class="r">Minimum stock (pcs)</th><th class="r">Machine days used</th><th>What limits it</th></tr></thead><tbody>
    ${rows.map(r => `<tr><td><span class="mono">${h(r.partNo)}</span> ${h(r.partName || '')}</td><td>${h({ A: 'A · Runner', B: 'B · Repeater', C: 'C · Stranger' }[r.cls])}</td><td class="r num">${r.days}${r.days >= r.maxDays ? ' (max)' : ''}</td><td class="r num"><b>${fmtInt(r.qty)}</b></td><td class="r num">${fmt(r.extraDays, 2)}</td><td class="small muted">${h(r.days >= r.maxDays ? 'Reached the cover limit for its class' : r.limit)}</td></tr>`).join('')}</tbody></table></div>
    <div class="card-b small muted">Cover limits: A up to ${sg.maxDays.A} days, B ${sg.maxDays.B}, C ${sg.maxDays.C} of sales. “Apply to the plan” writes each quantity into the part’s <i>Min stock qty</i> box below and sets the class cover days to 0; change any of them by hand afterwards.</div></section>`;
}
Pages.stock = () => {
  const plan = planOf(), stockOf = p => (plan.stock || {})[p] || {}, dyn = model.mode === 'dynamic';
  const q = (ui.search.stock || '').toLowerCase();
  const parts = new Map();
  state.operations.forEach(o => { if (!parts.has(o.partNo)) parts.set(o.partNo, { partNo: o.partNo, partName: o.partName, ops: [] }); parts.get(o.partNo).ops.push(o); });
  const list = [...parts.values()].filter(p => !q || `${p.partNo} ${p.partName}`.toLowerCase().includes(q));
  const sModel = E.compute(state, { mode: 'static' }), dModel = E.compute(state, { mode: 'dynamic' }), dNoMin = E.compute(state, { mode: 'dynamic', noMin: true });
  const minDays = dModel.totals.req - dNoMin.totals.req;
  const sales = list.reduce((a, p) => a + ((plan.parts[p.partNo] || {}).qty || 0), 0);
  const sum = o => Object.values(o || {}).reduce((x, v) => x + (+v || 0), 0);
  const stockUnits = list.reduce((a, p) => { const st = stockOf(p.partNo); return a + (st.fg || 0) + sum(st.wip) + sum(st.sup) + sum(st.insp); }, 0);
  const startQty = list.reduce((a, p) => a + (((dModel.net[p.partNo] || {}).material || {}).need || 0), 0);
  const saved = sModel.totals.req - dModel.totals.req;
  const inp = (part, kind, op, val, step) => `<input class="cell-inp" style="width:84px;text-align:right" type="number" min="0" ${kind === 'scrap' ? 'max="99"' : ''} step="${step || 1}" inputmode="decimal" data-stk="${h(part)}" data-kind="${kind}" ${op != null ? `data-op="${op}"` : ''} value="${val || 0}" aria-label="${h(kind)} for ${h(part)}">`;
  const cards = list.map(p => {
    const n = (model.net || {})[p.partNo], st = stockOf(p.partNo);
    if (!n) return '';
    const sc = plan.scrap || {};
    const th = (t, sub) => `<th class="r" style="min-width:104px">${t}${sub ? `<div class="small muted" style="font-weight:400">${sub}</div>` : ''}</th>`;
    const cell = (v, bold) => `<td class="r num"${bold ? ' style="font-weight:700;background:var(--brass-soft,#fbf3dc)"' : ''}>${fmtInt(v)}</td>`;
    const head = p.ops.map(o => th(h(o.process), h(o.machine))).join('') + th('Finished goods', 'FG stock');
    const row = (label, sub, cells) => `<tr><td><b>${label}</b>${sub ? `<div class="small muted">${sub}</div>` : ''}</td>${cells}</tr>`;
    const clsSel = `<select class="inp" data-stk="${h(p.partNo)}" data-kind="cls" aria-label="ABC class">${[['A', 'A · Runner'], ['B', 'B · Repeater'], ['C', 'C · Stranger']].map(c => `<option value="${c[0]}" ${((plan.cls || {})[p.partNo] || (state.partClass || {})[p.partNo] || 'B') === c[0] ? 'selected' : ''}>${c[1]}</option>`).join('')}</select>`;
    const rScrap = p.ops.map(o => `<td class="r">${inp(p.partNo, 'scrap', o.id, sc[o.id], 0.1)}</td>`).join('') + '<td></td>';
    const rWip = p.ops.map(o => `<td class="r">${inp(p.partNo, 'wip', o.id, (st.wip || {})[o.id])}</td>`).join('') + `<td class="r">${inp(p.partNo, 'fg', null, st.fg)}</td>`;
    const rSup = p.ops.map(o => `<td class="r">${inp(p.partNo, 'sup', o.id, (st.sup || {})[o.id])}</td>`).join('') + '<td></td>';
    const rIns = p.ops.map(o => `<td class="r">${inp(p.partNo, 'insp', o.id, (st.insp || {})[o.id])}</td>`).join('') + '<td></td>';
    const rNeed = n.steps.map(x => cell(x.needAfter)).join('') + cell(n.sales);
    const rGood = n.steps.map(x => cell(x.good)).join('') + cell(n.needAfterFg);
    const rRun = n.steps.map(x => cell(x.produce, true)).join('') + '<td></td>';
    return `<section class="card"><div class="card-h"><div><h2><span class="mono">${h(p.partNo)}</span> · ${h(p.partName)}</h2><div class="sub">Sales quantity <b>${fmtInt(n.sales)}</b>${n.minStock ? ` + minimum stock <b>${fmtInt(n.minStock)}</b>` : ''} → parts to start at the first process: <b>${fmtInt(n.material.need)}</b></div></div>
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><label class="small muted">Class ${clsSel}</label><label class="small muted">Min stock qty (0 = from class days) ${inp(p.partNo, 'minq', null, (plan.minStock || {})[p.partNo])}</label></div></div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th style="min-width:190px">Process →</th>${head}</tr></thead><tbody>
        ${row('Scrap allowance %', 'type by hand for now', rScrap)}
        ${row('Stock in house (WIP)', 'good parts finished this process, waiting', rWip)}
        ${row('Stock at supplier', 'done at a supplier process', rSup)}
        ${row('Stock in inward inspection', 'back from supplier, being inspected', rIns)}
        ${row('Needed after this process', n.minStock ? 'sales + min stock − FG stock' : 'sales − FG stock', rNeed)}
        ${row('Good parts still to make', 'needed − all stock', rGood)}
        ${row('To run on the machine', 'good parts ÷ (1 − scrap %)', rRun)}</tbody></table></div></section>`;
  }).join('');
  return `
  ${dyn ? note('ok', 'info', '<b>Dynamic capacity is ON.</b> Machine loading, the load balancer and the schedule use the balance below — not the full sales quantity.')
         : note('warn', 'info', '<b>Static capacity is ON</b> — the sales quantity goes to every process with the scrap allowance added; stock and minimum stock below are not used. Switch to <b>Dynamic</b> (top bar) to load the machines with the balance only.')}
  <section class="card"><div class="card-h"><div><h2>How the balance is worked out · ${monthName()}</h2><div class="sub">Starting from the customer: <b>sales quantity + minimum stock (if switched on) − finished-goods stock</b> is what the last process must deliver. Each process makes only <b>what is needed after it − the stock after it</b> (in-house WIP + at supplier + in inward inspection). Then the scrap % is added on top, because rejected parts must be made again. The process before it must supply exactly what this one runs. The <b>parts to start</b> at the first process will go to the Raw Material Planning app (coming).</div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="pasteStock">${icon('paste')}Paste stock from Excel</button><button class="btn danger" data-act="clearStock">Clear stock</button></div></div>
    <div class="grid kpis" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;padding:0 16px 14px">
      <div class="kpi"><div class="small muted">Sales quantity</div><div class="num" style="font-size:20px;font-weight:700">${fmtInt(sales)}</div></div>
      <div class="kpi"><div class="small muted">Stock (FG + all processes)</div><div class="num" style="font-size:20px;font-weight:700">${fmtInt(stockUnits)}</div></div>
      <div class="kpi"><div class="small muted">Machine days · Static</div><div class="num" style="font-size:20px;font-weight:700">${fmt(sModel.totals.req, 1)}</div></div>
      <div class="kpi"><div class="small muted">Machine days · Dynamic</div><div class="num" style="font-size:20px;font-weight:700">${fmt(dModel.totals.req, 1)} <span class="small" style="color:var(--ok,#16a34a)">${saved > 0.05 ? '− ' + fmt(saved, 1) : ''}</span></div></div>
      <div class="kpi"><div class="small muted">Machine days for minimum stock</div><div class="num" style="font-size:20px;font-weight:700">${fmt(minDays, 1)}</div></div>
      <div class="kpi"><div class="small muted">Parts to start (first process)</div><div class="num" style="font-size:20px;font-weight:700">${fmtInt(startQty)}</div></div>
    </div>
    <div class="toolbar">${searchBox('stock', 'Search part number or name')}<label class="small muted" title="Keep a minimum stock on top of the sales quantity">Minimum stock <select class="inp" data-minon="1"><option value="1" ${plan.minOn !== false ? 'selected' : ''}>On</option><option value="0" ${plan.minOn === false ? 'selected' : ''}>Off</option></select></label>${[['A', 'Runner', 7, plan.coverA != null ? plan.coverA : plan.cover], ['B', 'Repeater', 0, plan.coverB], ['C', 'Stranger', 0, plan.coverC]].map(c => `<label class="small muted" title="Days of sales kept as minimum stock for ${c[1]} parts">${c[0]} ${c[1]}: <input class="cell-inp" style="width:52px;text-align:right" type="number" min="0" step="1" data-cover="${c[0]}" value="${c[3] != null ? c[3] : c[2]}"> days</label>`).join('')}<span class="grow"></span><span class="small muted">${list.length} parts</span></div>
  </section>
  ${minSugCard(dyn)}
  ${cards || '<section class="card"><div class="card-b muted">No parts yet — add parts and routings under Masters.</div></section>'}`;
};

/* ---------------------------------------------------------------- MASTERS */
Pages.masters = () => window.KMR_PLATFORM ? kmrMastersPage() : mastersOriginal();

function dataIssues() {
  const out = [];
  const codes = new Set(state.machines.map(m => m.code));
  const names = new Map();
  state.operations.forEach(o => {
    if (!codes.has(o.machine)) out.push({ level: 'crit', text: `${o.partNo} ${o.process} is routed to “${o.machine}”, which is not in the machine list.` });
    if (!(o.cycleTime > 0)) out.push({ level: 'crit', text: `${o.partNo} ${o.process} has no cycle time.` });
    const n = names.get(o.partNo) || new Set(); n.add(o.partName); names.set(o.partNo, n);
  });
  names.forEach((set, pn) => { if (set.size > 1) out.push({ level: 'warn', text: `Part ${pn} has ${set.size} different names: ${[...set].join(' / ')}.` }); });
  const seen = new Set();
  state.operations.forEach(o => { const k = o.partNo + '|' + o.process.toLowerCase(); if (seen.has(k)) out.push({ level: 'warn', text: `${o.partNo} has “${o.process}” twice.` }); seen.add(k); });
  state.machines.forEach(m => { if (m.active !== false && !state.operations.some(o => o.machine === m.code)) out.push({ level: 'warn', text: `Machine ${m.code} has no routings.` }); });
  const dupM = state.machines.map(m => m.code).filter((c, i, a) => a.indexOf(c) !== i);
  dupM.forEach(c => out.push({ level: 'crit', text: `Machine code ${c} appears more than once.` }));
  return out;
}

'use strict';

function ensurePlan() {
  const k = model.key;
  if (!state.plans[k]) state.plans[k] = { parts: {}, machines: {}, splits: {} };
  const p = state.plans[k]; p.parts = p.parts || {}; p.machines = p.machines || {}; p.splits = p.splits || {};
  return p;
}
async function autoPullSales() {
  // the month's demand comes from Sales Flow on its own — only when nothing has been typed for that month yet
  if (!window.KMR_PLATFORM || !cloud.pull) return;
  const rows = (cloud.pull.sales || []).filter(r => state.operations.some(o => o.partNo === r.partNo) && Number(r.qty) > 0);
  const key = E.periodKey(state.year, state.month), pl = state.plans[key];
  if (!rows.length || (pl && Object.values(pl.parts || {}).some(x => (x.qty || 0) > 0))) return;

function editMachine(i, f, el) {
  const m = state.machines[i]; if (!m) return;
  if (f === 'code') {
    const nv = el.value.trim(); if (!nv) { toast('Machine code cannot be empty.'); return render(); }
    if (nv !== m.code && state.machines.some(x => x.code === nv)) { toast(`${nv} already exists.`); return render(); }
    const old = m.code; m.code = nv;
    state.operations.forEach(o => { if (o.machine === old) o.machine = nv; o.alternates = (o.alternates || []).map(a => a === old ? nv : a); });
    Object.values(state.plans).forEach(p => {
      if (p.machines && p.machines[old]) { p.machines[nv] = p.machines[old]; delete p.machines[old]; }
      Object.values(p.splits || {}).forEach(list => list.forEach(a => { if (a.machine === old) a.machine = nv; }));
    });
    toast(`Renamed ${old} to ${nv} everywhere`);
  } else if (f === 'active') m.active = el.checked;
  else if (f === 'cell') m.cell = el.value.trim() || E.cellOf(m.code);
  else m[f] = el.value === '' ? null : Math.max(0, Number(el.value));
  commit();
}
function editOp(id, f, el) {
  const o = state.operations.find(x => x.id === id); if (!o) return;
  if (f === 'cycleTime') { const v = Number(el.value); if (!(v > 0)) { toast('Cycle time must be greater than 0.'); return render(); } o.cycleTime = v; }
  else if (f === 'partNo') {
    const nv = el.value.trim(); if (!nv) return render();
    const old = o.partNo; o.partNo = nv;
    if (!state.operations.some(x => x.partNo === old)) Object.values(state.plans).forEach(p => { if (p.parts && p.parts[old]) { p.parts[nv] = p.parts[nv] || p.parts[old]; delete p.parts[old]; } });
  } else o[f] = el.value.trim();
  commit();
}

const KMR_DAYS = { sunday: 0, monday: 1, tuesday: 2, wednesday: 3, thursday: 4, friday: 5, saturday: 6 };

/* The Operations Master is the only source for a linked planner — an empty list there means an empty list here.
   The planner's own earlier masters are kept aside (and stay in its saved file) only for the one-time "Move". */
function applyOpsData() {
  const m = cloud.ops; if (!m) return;
  if (!cloud.own) cloud.own = { machines: JSON.parse(JSON.stringify(state.machines || [])), operations: JSON.parse(JSON.stringify(state.operations || [])) };
  cloud.opsEmpty = !(m.machines || []).length && !(m.operations || []).length;
  state.machines = (m.machines || []).map(x => ({ code: x.code, cell: x.cell || '', availDays: x.availDays == null ? null : Number(x.availDays),
    hoursPerDay: x.hoursPerDay == null ? null : Number(x.hoursPerDay), remarks: x.remarks || '', active: x.active !== false }));
  state.operations = (m.operations || []).map((o, i) => ({ id: i + 1, partNo: o.partNo || '', partName: o.partName || o.partNo || '', process: o.process || '',
    machine: o.machine || '', cycleTime: Number(o.cycleTime) || 0, alternates: Array.isArray(o.alternates) ? o.alternates : [], supplier: !!o.supplier })).map(parseAlts);
  state.partClass = {}; state.partMinDays = {};
  (m.parts || []).forEach(x => { if (x.partNo) { state.partClass[x.partNo] = ['A', 'B', 'C'].includes(x.abcClass) ? x.abcClass : 'B'; if (x.minStockDays != null && Number(x.minStockDays) > 0) state.partMinDays[x.partNo] = Number(x.minStockDays); } });
  applyProcessPlan();
  const st = m.standards || {}, s = state.settings;
  ['oee', 'hoursPerDay', 'shifts', 'daysPerMonth', 'warnPct', 'transferLagHours', 'lotSize', 'levelTargetPct'].forEach(k => { if (st[k] !== undefined && st[k] !== '' && !isNaN(Number(st[k]))) s[k] = Number(st[k]); });
  if (st.weeklyOff !== undefined) s.weeklyOff = kmrWeeklyOff(st.weeklyOff);
  if (m.has_hrm) { s.holidays = m.holidays || []; s.holidayNames = m.holidayNames || {}; }
}
/* Operations from the Process Plan (in-house steps, machine picked from the Operations Master). A part with no process plan keeps its Operations Master routing. */
function applyProcessPlan() {
  state.planGaps = []; state.opSource = {};
  const pl = cloud.pull; if (!pl || !Array.isArray(pl.plan) || !pl.plan.length) return;
  const mcodes = new Set(state.machines.map(x => x.code)), cts = pl.cycleTimes || [];
  const nz = s => String(s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
  const planParts = new Map(pl.plan.map(p => [p.partNo, p]));
  const hasIn = p => (p.ops || []).some(x => x.inHouse);
  const keep = state.operations.filter(o => !(planParts.has(o.partNo) && hasIn(planParts.get(o.partNo))));
  const add = [];
  pl.plan.filter(hasIn).forEach(p => {
    state.opSource[p.partNo] = 'plan';
    (p.ops || []).filter(x => x.inHouse).forEach(x => {
      const mine = cts.filter(c => c.partNo === p.partNo);
      const rec = mine.find(c => nz(c.process) === nz(x.name) && c.machine === x.machineId) || mine.find(c => nz(c.process) === nz(x.name)) || (x.machineId ? mine.find(c => c.machine === x.machineId) : null);
      let machine = mcodes.has(x.machineId) ? x.machineId : (rec && mcodes.has(rec.machine) ? rec.machine : '');
      const ct = rec && rec.ct > 0 ? Number(rec.ct) : 0;
      if (!machine) state.planGaps.push({ partNo: p.partNo, process: x.name, issue: x.machineId ? `machine ${x.machineId} is not in the Operations Master` : 'no machine chosen in the Process Plan — pick one from the Operations Master' });
      if (!ct) state.planGaps.push({ partNo: p.partNo, process: x.name, issue: 'no cycle time in the Operations Master › Cycle times (this step loads 0 days until it is added)' });
      add.push(parseAlts({ partNo: p.partNo, partName: p.partName || p.partNo, process: x.name || 'Operation', machine, cycleTime: ct, alternates: rec && rec.alternates ? String(rec.alternates).split(',').map(a => a.trim()).filter(Boolean) : [], fromPlan: true }));
    });
  });
  state.operations = keep.concat(add).sort((a, b) => a.partNo.localeCompare(b.partNo)).map((o, i) => Object.assign({}, o, { id: i + 1 }));
}
